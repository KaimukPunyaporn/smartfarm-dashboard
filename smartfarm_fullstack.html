function Farm3DView({ onSelect, pinMode, onPinPlace }) {
  const cvRef  = React.useRef(null);
  const stRef  = React.useRef({
    angle: -0.52, tilt: 0.46, scale: 10.5,
    drag: false, lx: 0, ly: 0,
    hover: null, frame: 0, _pts: [],
    panX: 0, panZ: 0,
  });
  const rafRef = React.useRef(null);
  const [hover, setHover]   = React.useState(null);
  const [hint, setHint]     = React.useState(true);
  const pinModeRef  = React.useRef(pinMode);
  const onPinRef    = React.useRef(onPinPlace);
  React.useEffect(() => { pinModeRef.current = pinMode; }, [pinMode]);
  React.useEffect(() => { onPinRef.current = onPinPlace; }, [onPinPlace]);

  // ── isometric projection ──────────────────────────────────────
  function iso(x, y, z, st, W, H) {
    const a = st.angle, co = Math.cos(a), si = Math.sin(a);
    const rx = (x + st.panX) * co - (z + st.panZ) * si;
    const rz = (x + st.panX) * si + (z + st.panZ) * co;
    return [
      W * 0.5  + rx * st.scale,
      H * 0.46 + (rz * Math.cos(st.tilt) - y * Math.sin(st.tilt) * 0.92) * st.scale,
    ];
  }

  // ── draw helpers ──────────────────────────────────────────────
  function poly(ctx, pts, fill, strk, lw) {
    ctx.beginPath(); ctx.moveTo(...pts[0]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strk) { ctx.strokeStyle = strk; ctx.lineWidth = lw || 0.5; ctx.stroke(); }
  }

  function box(ctx, x, y, z, W, H, D, top, lft, rgt, p, edgeClr) {
    const TL = p(x,   y+H, z),   TR = p(x+W, y+H, z);
    const BR = p(x+W, y+H, z+D), BL = p(x,   y+H, z+D);
    const LL = p(x,   y,   z),   LR = p(x,   y,   z+D);
    const RL = p(x+W, y,   z);
    const e  = edgeClr || "rgba(255,255,255,0.06)";
    poly(ctx, [TL,TR,BR,BL], top, e, 0.4);
    poly(ctx, [TL,BL,LR,LL], lft, e, 0.4);
    poly(ctx, [TR,BR,LR,RL], rgt, e, 0.4);
  }

  function cyl(ctx, x, y, z, r, h, fill, p, sc) {
    const b = p(x,y,z), t = p(x,y+h,z), rPx = r * sc;
    poly(ctx, [
      [b[0]-rPx, b[1]], [t[0]-rPx, t[1]],
      [t[0]+rPx, t[1]], [b[0]+rPx, b[1]],
    ], fill);
    ctx.beginPath();
    ctx.ellipse(t[0], t[1], rPx, rPx * 0.34, 0, 0, Math.PI*2);
    ctx.fillStyle = fill; ctx.fill();
  }

  function glowLine(ctx, pts, color, lw, blur) {
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = blur || 10;
    ctx.strokeStyle = color; ctx.lineWidth = lw || 1.5;
    ctx.beginPath(); ctx.moveTo(...pts[0]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
    ctx.stroke(); ctx.restore();
  }

  // ── main render ───────────────────────────────────────────────
  function render() {
    const cv = cvRef.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const st = stRef.current;
    st.frame++;
    const p = (x,y,z) => iso(x,y,z,st,W,H);
    const sc = st.scale;
    const f  = st.frame;

    // ── background ─────────────────────────────────────────────
    const bgGrad = ctx.createRadialGradient(W*.5, H*.45, 0, W*.5, H*.5, W*.7);
    bgGrad.addColorStop(0, "#0d1f14");
    bgGrad.addColorStop(1, "#060e08");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    // ── ground grid ────────────────────────────────────────────
    ctx.save(); ctx.globalAlpha = 0.18;
    for (let i = -36; i <= 36; i += 4) {
      glowLine(ctx, [p(i,0,-36), p(i,0,36)], "#22aa44", 0.4, 4);
      glowLine(ctx, [p(-36,0,i), p(36,0,i)], "#22aa44", 0.4, 4);
    }
    ctx.restore();

    // Ground base
    poly(ctx, [p(-36,0,-36),p(36,0,-36),p(36,0,36),p(-36,0,36)], "rgba(10,24,14,0.85)");

    // ── glowing perimeter road ─────────────────────────────────
    const roadCorners = [
      [p(-31,.08,-31), p(31,.08,-31), p(31,.08,31), p(-31,.08,31)],
    ];
    // Outer glow road fill
    poly(ctx, roadCorners[0], "rgba(20,36,24,0.6)");
    const roadPts = [...roadCorners[0], roadCorners[0][0]];
    for (let pass = 0; pass < 3; pass++) {
      const alpha = 0.15 + pass * 0.18 + 0.04 * Math.sin(f * 0.03);
      glowLine(ctx, roadPts, `rgba(180,140,40,${alpha})`, 2.5 - pass * 0.6, 18 - pass * 4);
    }
    // Inner highlight
    glowLine(ctx, roadPts, `rgba(255,210,60,${0.55 + 0.12 * Math.sin(f * 0.04)})`, 0.8, 8);

    // Internal paths (cross)
    const crossH = [p(-31,.1, 0), p(31,.1,0)];
    const crossV = [p(0,.1,-31), p(0,.1,31)];
    glowLine(ctx, crossH, "rgba(255,200,50,0.25)", 0.8, 6);
    glowLine(ctx, crossV, "rgba(255,200,50,0.25)", 0.8, 6);

    // ── Zone fills ─────────────────────────────────────────────
    const zones = [
      { pts: [p(-28,.1,-28),p(-3,.1,-28),p(-3,.1,-3),p(-28,.1,-3)],  fill:"rgba(30,100,50,0.13)",  strk:"rgba(60,180,80,0.25)"  },
      { pts: [p(3,.1,-28), p(28,.1,-28),p(28,.1,-3), p(3,.1,-3)],    fill:"rgba(40,100,100,0.12)", strk:"rgba(60,160,160,0.22)" },
      { pts: [p(-28,.1,3), p(-3,.1,3), p(-3,.1,28), p(-28,.1,28)],   fill:"rgba(100,40,30,0.12)",  strk:"rgba(180,70,50,0.22)"  },
      { pts: [p(3,.1,3),   p(28,.1,3), p(28,.1,28), p(3,.1,28)],     fill:"rgba(30,60,140,0.13)",  strk:"rgba(50,100,220,0.22)" },
    ];
    zones.forEach(z => {
      poly(ctx, z.pts, z.fill);
      ctx.save(); ctx.strokeStyle = z.strk; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(...z.pts[0]); z.pts.slice(1).forEach(pt => ctx.lineTo(...pt)); ctx.closePath(); ctx.stroke();
      ctx.restore();
    });

    // ── ZONE A — ผักสลัด (Isometric raised beds + crop rows) ─────
    // Soil beds
    for (let row = 0; row < 3; row++) {
      const bz = -26 + row * 7.5;
      box(ctx,-26,.0,-26+row*7.5, 20,.45,5,
        "rgba(62,42,22,0.95)","rgba(42,28,12,0.9)","rgba(50,34,16,0.9)", p);
      // Crop rows (glowing green dots)
      for (let c = 0; c < 8; c++) {
        const cx2 = -25 + c * 2.5 + 1.2, cz2 = bz + 2.5;
        const col = (row===1&&c===3) ? "rgba(160,220,60,0.9)" : "rgba(50,180,60,0.85)";
        // Stem
        cyl(ctx, cx2,.45,cz2, .055,.7,"rgba(60,44,18,0.8)", p, sc);
        // Leaf blob
        const [lx,ly2] = p(cx2, 1.25, cz2);
        const lr = (.48 + (row===1&&c===3 ? .1:0)) * sc;
        const g2 = ctx.createRadialGradient(lx,ly2,0,lx,ly2,lr);
        g2.addColorStop(0, col); g2.addColorStop(1,"rgba(20,80,20,0.3)");
        ctx.beginPath(); ctx.ellipse(lx,ly2,lr,lr*.52,0,0,Math.PI*2);
        ctx.fillStyle = g2; ctx.fill();
      }
    }

    // ── ZONE B — โรงเรือนเมล่อน ────────────────────────────────
    // Floor slab
    box(ctx,5,.0,-27, 21,.2,22, "rgba(30,58,44,0.9)","rgba(22,42,32,0.85)","rgba(26,50,38,0.85)",p);
    // Glass walls — semi transparent
    ctx.save(); ctx.globalAlpha = 0.14;
    box(ctx,5,.2,-27, 21,7.5,22, "rgba(140,220,200,0.7)","rgba(100,180,160,0.6)","rgba(120,200,180,0.65)",p);
    ctx.restore();
    // Frame edges glow
    const ghCorners = [[5,7.7,-27],[26,7.7,-27],[26,7.7,-5],[5,7.7,-5]];
    glowLine(ctx, [...ghCorners, ghCorners[0]].map(([x,,z])=>p(x,7.7,z)), "rgba(80,200,160,0.45)", 0.8, 6);
    [[5,-27],[26,-27],[26,-5],[5,-5]].forEach(([x,z])=>{
      glowLine(ctx,[p(x,.2,z),p(x,7.7,z)],"rgba(80,200,160,0.3)",0.5,3);
    });
    // Roof arches
    for (let i=0;i<5;i++){
      const zz=-27+i*5.5;
      ctx.save(); ctx.strokeStyle="rgba(80,200,160,0.5)"; ctx.lineWidth=0.8; ctx.shadowColor="rgba(80,200,160,0.4)"; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.moveTo(...p(5,7.7,zz)); ctx.quadraticCurveTo(...p(15.5,12,zz),...p(26,7.7,zz)); ctx.stroke(); ctx.restore();
    }
    // Ridge
    glowLine(ctx,[p(15.5,12,-27),p(15.5,12,-5)],"rgba(80,200,160,0.4)",0.7,5);
    // Grow lights
    for (let l=0;l<3;l++){
      const gz=-9-l*6;
      const [gx,gy]=p(15.5,10.5,gz);
      const ga=0.6+.18*Math.sin(f*.06+l);
      ctx.save(); ctx.shadowColor=`rgba(200,100,255,${ga})`; ctx.shadowBlur=16;
      ctx.fillStyle=`rgba(220,130,255,${ga})`;
      ctx.fillRect(gx-sc*4,gy-2.5,sc*8,4); ctx.restore();
    }
    // Plants inside
    for (let i=0;i<4;i++){
      const px=7.5+i*4.5;
      cyl(ctx,px,.2,-16,.07,5.5,"rgba(90,60,20,0.75)",p,sc);
      for(let j=0;j<4;j++){
        const[bx,by]=p(px,1.5+j*1.1,-16);
        const bg=ctx.createRadialGradient(bx,by,0,bx,by,.5*sc);
        bg.addColorStop(0,"rgba(60,180,50,0.85)"); bg.addColorStop(1,"rgba(20,80,20,0.1)");
        ctx.beginPath(); ctx.ellipse(bx,by,.5*sc,.28*sc,0,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      }
    }

    // ── ZONE C — มะเขือเทศ ────────────────────────────────────
    for(let row=0;row<3;row++){
      const bz=5+row*7.2;
      box(ctx,-26,.0,5+row*7.2,20,.35,5.5,"rgba(55,30,15,0.9)","rgba(38,20,8,0.85)","rgba(46,24,10,0.85)",p);
      for(let c=0;c<5;c++){
        const cx2=-25+c*3.8+1.8, cz2=bz+2.8;
        const warn=row===1&&c===2;
        cyl(ctx,cx2,.35,cz2,.07,2.5,warn?"rgba(100,90,20,0.7)":"rgba(80,50,15,0.75)",p,sc);
        const[lx,ly2]=p(cx2,3,cz2);
        const lg=ctx.createRadialGradient(lx,ly2,0,lx,ly2,.45*sc);
        lg.addColorStop(0,warn?"rgba(160,150,30,0.85)":"rgba(30,140,30,0.85)"); lg.addColorStop(1,"rgba(10,50,10,0.1)");
        ctx.beginPath(); ctx.ellipse(lx,ly2,.45*sc,.26*sc,0,0,Math.PI*2); ctx.fillStyle=lg; ctx.fill();
        // Tomatoes
        [[cx2-.2,1.6],[cx2+.3,2],[cx2-.1,1.3]].forEach(([tx,ty])=>{
          const[rx,ry]=p(tx,ty,cz2);
          ctx.beginPath(); ctx.arc(rx,ry,.18*sc,0,Math.PI*2);
          ctx.fillStyle=Math.random()>.45?"rgba(210,50,30,0.9)":"rgba(230,90,40,0.85)"; ctx.fill();
        });
      }
    }

    // ── ZONE D — ไฮโดรโปนิกส์ ──────────────────────────────────
    box(ctx,5,.0,5, 21,.12,21,"rgba(18,42,58,0.9)","rgba(12,30,44,0.85)","rgba(15,36,52,0.85)",p);
    for(let row=0;row<3;row++){
      const tz=7+row*6;
      // Table glow edge
      const tabPts=[p(6,2,tz-.5),p(25,2,tz-.5),p(25,2,tz+.5),p(6,2,tz+.5)];
      poly(ctx,tabPts,"rgba(30,80,120,0.7)");
      ctx.save(); ctx.strokeStyle="rgba(60,160,220,0.4)"; ctx.lineWidth=0.6; ctx.shadowColor="rgba(60,160,220,0.5)"; ctx.shadowBlur=8;
      ctx.beginPath(); tabPts.forEach((pt,i)=>i?ctx.lineTo(...pt):ctx.moveTo(...pt)); ctx.closePath(); ctx.stroke(); ctx.restore();
      cyl(ctx,6.5,.0,tz,.1,2,"rgba(30,60,90,0.7)",p,sc); cyl(ctx,24.5,.0,tz,.1,2,"rgba(30,60,90,0.7)",p,sc);
      for(let c=0;c<13;c++){
        const[bx,by]=p(7+c*.95,2.3,tz);
        const hg=ctx.createRadialGradient(bx,by,0,bx,by,.26*sc);
        hg.addColorStop(0,"rgba(50,220,100,0.9)"); hg.addColorStop(1,"rgba(20,100,40,0.1)");
        ctx.beginPath(); ctx.ellipse(bx,by,.26*sc,.15*sc,0,0,Math.PI*2); ctx.fillStyle=hg; ctx.fill();
      }
    }
    // Reservoir
    box(ctx,4,.0,18,3.5,1.6,2.5,"rgba(18,50,80,0.9)","rgba(12,36,60,0.85)","rgba(14,42,70,0.85)",p);
    // Pipes
    cyl(ctx,6,.0,15,.08,2,"rgba(80,100,120,0.7)",p,sc);
    cyl(ctx,6,.0,20,.08,2,"rgba(80,100,120,0.7)",p,sc);

    // ── Pump house ──────────────────────────────────────────────
    box(ctx,-35,.0,-3,5,3.5,5,"rgba(50,44,36,0.95)","rgba(36,32,26,0.9)","rgba(42,38,30,0.9)",p);
    box(ctx,-35.4,3.5,-3.4,5.8,.5,5.8,"rgba(60,54,44,0.95)","rgba(44,38,30,0.9)","rgba(50,44,36,0.9)",p);
    // Glow window
    const[pw,ph]=p(-32.5,1.8,-3); ctx.beginPath(); ctx.rect(pw-sc*.5,ph-sc*.4,sc,sc*.7);
    ctx.fillStyle=`rgba(255,200,80,${0.3+.12*Math.sin(f*.04)})`; ctx.fill();
    // Water tower
    cyl(ctx,-34,.0,-10,2.2,5.5,"rgba(40,54,70,0.9)",p,sc);
    cyl(ctx,-34,5.5,-10,2.6,.5,"rgba(50,66,84,0.9)",p,sc);
    cyl(ctx,-32.5,.0,-10,.12,5.5,"rgba(70,88,100,0.6)",p,sc);

    // ── Solar panels ────────────────────────────────────────────
    for(let i=0;i<4;i++){
      cyl(ctx,-34+i*2.6,.0,12+i*.4,.09,2,"rgba(80,80,100,0.65)",p,sc);
      const panPts=[p(-35+i*2.6,2.4,12+i*.4),p(-32.8+i*2.6,2.4,12+i*.4),p(-32.8+i*2.6,1.9,13.2+i*.4),p(-35+i*2.6,1.9,13.2+i*.4)];
      poly(ctx,panPts,"rgba(15,40,160,0.9)");
      ctx.save(); ctx.strokeStyle=`rgba(50,120,255,${0.4+.15*Math.sin(f*.02+i)})`; ctx.lineWidth=0.5; ctx.shadowColor="rgba(50,120,255,0.4)"; ctx.shadowBlur=6;
      ctx.beginPath(); panPts.forEach((pt,j)=>j?ctx.lineTo(...pt):ctx.moveTo(...pt)); ctx.closePath(); ctx.stroke(); ctx.restore();
    }

    // ── Trees ───────────────────────────────────────────────────
    [[-29,-22],[-22,-29],[22,-29],[29,-22],[29,22],[22,29],[-22,29],[-29,22],[-29,6],[29,6]].forEach(([tx,tz2])=>{
      cyl(ctx,tx,.0,tz2,.28,3,"rgba(50,30,12,0.8)",p,sc);
      const[lx,ly2]=p(tx,4.2,tz2);
      const tg=ctx.createRadialGradient(lx,ly2,0,lx,ly2,1.8*sc);
      tg.addColorStop(0,"rgba(20,100,25,0.9)"); tg.addColorStop(1,"rgba(10,50,10,0)");
      ctx.beginPath(); ctx.ellipse(lx,ly2,1.8*sc,sc*0.9,0,0,Math.PI*2); ctx.fillStyle=tg; ctx.fill();
    });

    // ── Fence ───────────────────────────────────────────────────
    ctx.save(); ctx.globalAlpha=0.5;
    [[-32,-32],[32,-32],[32,32],[-32,32]].forEach(([x,z],i,a)=>{
      const n=a[(i+1)%4];
      glowLine(ctx,[p(x,1.4,z),p(n[0],1.4,n[2])],"rgba(80,140,80,0.35)",0.5,3);
      glowLine(ctx,[p(x,.9,z),p(n[0],.9,n[2])],"rgba(80,140,80,0.28)",0.4,2);
    });
    for(let i=-30;i<=30;i+=3){
      [[-32,i],[32,i],[i,-32],[i,32]].forEach(([fx,fz])=>cyl(ctx,fx,.0,fz,.07,1.5,"rgba(80,100,60,0.6)",p,sc));
    }
    ctx.restore();

    // ── Sensor markers (CIB-style glowing orbs on poles) ────────
    const SENSORS=[
      {x:-22,z:-22,col:"#33ff66",label:"TMP-01",val:"28.4°C",zone:"A",kind:"sage"},
      {x:-16,z:-15,col:"#33ff66",label:"HUM-01",val:"72%",   zone:"A",kind:"sage"},
      {x:-23,z:-10,col:"#33ff66",label:"LUX-01",val:"24.6klx",zone:"A",kind:"sage"},
      {x:10, z:-20,col:"#33ff66",label:"WTR-01",val:"64%",   zone:"B",kind:"sage"},
      {x:19, z:-13,col:"#ffbb22",label:"TMP-02",val:"36.8°C",zone:"B",kind:"warn"},
      {x:10, z:-25,col:"#33ff66",label:"CO2-01",val:"612ppm",zone:"B",kind:"sage"},
      {x:-14,z:8,  col:"#33ff66",label:"SOL-01",val:"41%",   zone:"C",kind:"sage"},
      {x:-10,z:18, col:"#ff3322",label:"SOL-03",val:"24%",   zone:"C",kind:"danger"},
      {x:16, z:8,  col:"#33ff66",label:"PH-01", val:"6.4pH", zone:"D",kind:"sage"},
      {x:20, z:18, col:"#33ff66",label:"EC-01", val:"1.8mS", zone:"D",kind:"sage"},
    ];
    const newPts=[];
    SENSORS.forEach(s=>{
      const isH=st.hover===s.label;
      const pulse=.05+.06*Math.abs(Math.sin(f*.07+(s.x+s.z)*.12));
      const r=(isH?.32:.22+pulse)*sc;

      // Pole
      cyl(ctx,s.x,.0,s.z,.05,1.8,"rgba(140,160,140,0.5)",p,sc);
      // Connector line on top
      const[px,py]=p(s.x,2,s.z);

      // Multi-ring glow (CIB style)
      [4,2.2,1.3].forEach((mult,i)=>{
        const alpha=[0.08,0.18,0.55][i];
        ctx.save();
        ctx.shadowColor=s.col; ctx.shadowBlur=20*mult;
        ctx.beginPath(); ctx.arc(px,py,r*mult,0,Math.PI*2);
        ctx.fillStyle=s.col.replace(")",`,${alpha})`).replace("rgb","rgba").replace("#",`rgba(${parseInt(s.col.slice(1,3),16)},${parseInt(s.col.slice(3,5),16)},${parseInt(s.col.slice(5,7),16)},`)+")";
        // simpler approach:
        ctx.fillStyle=`${s.col}${Math.round(alpha*255).toString(16).padStart(2,"0")}`;
        ctx.fill(); ctx.restore();
      });
      // Core bright dot
      ctx.save(); ctx.shadowColor=s.col; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.arc(px,py,r*.55,0,Math.PI*2);
      ctx.fillStyle=isH?"#ffffff":s.col; ctx.fill(); ctx.restore();

      newPts.push({px,py,r:r*1.8,s});
    });
    st._pts=newPts;

    // ── Hover tooltip (floating card, CIB style) ─────────────────
    if(st.hover){
      const hit=newPts.find(q=>q.s.label===st.hover);
      if(hit){
        const lx=hit.px+18, ly=hit.py-52;
        const TW=188, TH=62;
        // Card bg
        ctx.save();
        ctx.shadowColor="rgba(50,200,100,0.35)"; ctx.shadowBlur=20;
        ctx.fillStyle="rgba(8,20,12,0.94)";
        if(ctx.roundRect) ctx.roundRect(lx,ly,TW,TH,8); else ctx.rect(lx,ly,TW,TH);
        ctx.fill();
        ctx.strokeStyle=hit.s.col; ctx.lineWidth=1;
        if(ctx.roundRect) ctx.roundRect(lx,ly,TW,TH,8); else ctx.rect(lx,ly,TW,TH);
        ctx.stroke(); ctx.restore();
        // Connector line to sensor
        ctx.save(); ctx.strokeStyle=`${hit.s.col}88`; ctx.lineWidth=0.8; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(hit.px,hit.py); ctx.lineTo(lx,ly+TH); ctx.stroke(); ctx.restore();
        // Text
        ctx.font="bold 11px 'IBM Plex Mono',monospace";
        ctx.fillStyle=hit.s.col; ctx.fillText(hit.s.label, lx+12, ly+18);
        ctx.font="13px 'IBM Plex Mono',monospace";
        ctx.fillStyle="#ffffff"; ctx.fillText(hit.s.val, lx+12, ly+36);
        ctx.font="10px 'IBM Plex Mono',monospace";
        ctx.fillStyle="rgba(150,220,170,0.6)"; ctx.fillText(`โซน ${hit.s.zone} · LIVE`, lx+12, ly+52);
      }
    }

    // ── Zone labels ──────────────────────────────────────────────
    [{x:-17,y:4,z:-16,l:"A · ผักสลัด",    c:"#44ee66"},
     {x:15, y:12,z:-14,l:"B · โรงเรือน", c:"#66ddcc"},
     {x:-17,y:3, z:18, l:"C · มะเขือเทศ",c:"#ee6644"},
     {x:15, y:3, z:18, l:"D · ไฮโดรโปนิกส์",c:"#6699ff"},
    ].forEach(z=>{
      const[px,py]=p(z.x,z.y,z.z);
      ctx.save();
      ctx.shadowColor=z.c; ctx.shadowBlur=10;
      ctx.font="bold 12px 'IBM Plex Mono',monospace";
      ctx.fillStyle=z.c; ctx.fillText(z.l,px,py);
      ctx.restore();
    });

    // ── Animated scan line ───────────────────────────────────────
    const scanY=H*0.25+((f*1.8)%(H*.7));
    const sg=ctx.createLinearGradient(0,scanY-18,0,scanY+2);
    sg.addColorStop(0,"rgba(50,220,100,0)"); sg.addColorStop(1,"rgba(50,220,100,0.04)");
    ctx.fillStyle=sg; ctx.fillRect(0,scanY-18,W,20);
  }

  // ── event loop ───────────────────────────────────────────────
  React.useEffect(()=>{
    const cv=cvRef.current; if(!cv) return;
    function resize(){
      const el=cv.parentElement;
      cv.width=el.clientWidth||760; cv.height=el.clientHeight||600;
    }
    resize(); window.addEventListener("resize",resize);
    function loop(){ render(); rafRef.current=requestAnimationFrame(loop); }
    rafRef.current=requestAnimationFrame(loop);

    function onDown(e){ stRef.current.drag=true; stRef.current.lx=e.clientX; stRef.current.ly=e.clientY; setHint(false); }
    function onUp(){ stRef.current.drag=false; }
    function onMove(e){
      const st=stRef.current;
      if(st.drag){
        const dx=e.clientX-st.lx, dy=e.clientY-st.ly;
        st.angle-=dx*.007; st.tilt=Math.max(.15,Math.min(.78,st.tilt+dy*.004));
        st.lx=e.clientX; st.ly=e.clientY; return;
      }
      const rect=cv.getBoundingClientRect();
      const mx=(e.clientX-rect.left)*(cv.width/rect.width), my=(e.clientY-rect.top)*(cv.height/rect.height);
      const hit=(st._pts||[]).find(q=>Math.hypot(q.px-mx,q.py-my)<q.r);
      const nw=hit?hit.s.label:null;
      if(nw!==st.hover){ st.hover=nw; setHover(nw); cv.style.cursor=pinModeRef.current?"crosshair":nw?"pointer":"default"; }
    }
    function onClick(e){
      // Pin mode takes priority
      if (pinModeRef.current) {
        onPinRef.current && onPinRef.current();
        return;
      }
      const st=stRef.current;
      const rect=cv.getBoundingClientRect();
      const mx=(e.clientX-rect.left)*(cv.width/rect.width), my=(e.clientY-rect.top)*(cv.height/rect.height);
      const hit=(st._pts||[]).find(q=>Math.hypot(q.px-mx,q.py-my)<q.r);
      if(hit) onSelect&&onSelect({id:hit.s.label,name:hit.s.label,val:hit.s.val,zone:hit.s.zone,kind:hit.s.kind});
    }
    function onWheel(e){ e.preventDefault(); stRef.current.scale=Math.max(4.5,Math.min(24,stRef.current.scale-e.deltaY*.016)); }
    let lt=null;
    function onTStart(e){ if(e.touches.length===1){stRef.current.drag=true;lt={x:e.touches[0].clientX,y:e.touches[0].clientY};setHint(false);} }
    function onTEnd(){ stRef.current.drag=false; lt=null; }
    function onTMove(e){ if(!stRef.current.drag||!lt)return; const dx=e.touches[0].clientX-lt.x,dy=e.touches[0].clientY-lt.y; lt={x:e.touches[0].clientX,y:e.touches[0].clientY}; stRef.current.angle-=dx*.007; stRef.current.tilt=Math.max(.15,Math.min(.78,stRef.current.tilt+dy*.004)); }

    cv.addEventListener("mousedown",onDown); cv.addEventListener("mouseup",onUp);
    cv.addEventListener("mousemove",onMove); cv.addEventListener("click",onClick);
    cv.addEventListener("wheel",onWheel,{passive:false});
    cv.addEventListener("touchstart",onTStart); cv.addEventListener("touchend",onTEnd); cv.addEventListener("touchmove",onTMove);
    return ()=>{
      cancelAnimationFrame(rafRef.current); window.removeEventListener("resize",resize);
      cv.removeEventListener("mousedown",onDown); cv.removeEventListener("mouseup",onUp);
      cv.removeEventListener("mousemove",onMove); cv.removeEventListener("click",onClick);
      cv.removeEventListener("wheel",onWheel);
    };
  },[]);

  return (
    <div style={{position:"absolute",inset:0,overflow:"hidden",background:"#060e08"}}>
      <canvas ref={cvRef} style={{width:"100%",height:"100%",display:"block"}}/>

      {/* Legend — top left, CIB-style */}
      <div style={{position:"absolute",top:16,left:16,background:"rgba(6,16,10,0.88)",border:"1px solid rgba(50,180,80,0.22)",borderRadius:10,padding:"12px 16px",backdropFilter:"blur(8px)"}}>
        <div style={{fontFamily:"var(--f-mono)",fontSize:9,color:"rgba(100,220,130,0.5)",textTransform:"uppercase",letterSpacing:"0.14em",marginBottom:8}}>Sensor Status</div>
        {[{c:"#33ff66",l:"ปกติ"},{c:"#ffbb22",l:"เตือน"},{c:"#ff3322",l:"วิกฤต"},{c:"rgba(100,200,180,0.7)",l:"โรงเรือน"},{c:"#cc88ff",l:"Grow Light"}].map(x=>(
          <div key={x.l} style={{display:"flex",alignItems:"center",gap:10,fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(160,255,175,0.8)",marginBottom:5}}>
            <span style={{width:9,height:9,borderRadius:"50%",background:x.c,flexShrink:0,boxShadow:`0 0 6px ${x.c}`}}/>
            {x.l}
          </div>
        ))}
      </div>

      {/* Controls hint */}
      {hint&&(
        <div style={{position:"absolute",bottom:20,left:"50%",transform:"translateX(-50%)",background:"rgba(6,16,10,0.82)",border:"1px solid rgba(50,180,80,0.25)",borderRadius:24,padding:"7px 20px",fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(140,255,160,0.65)",pointerEvents:"none",whiteSpace:"nowrap",backdropFilter:"blur(6px)"}}>
          🖱 ลากเพื่อหมุน · Scroll เพื่อ Zoom · คลิก Sensor เพื่อดูข้อมูล
        </div>
      )}

      {/* Upload CTA */}
      <div style={{position:"absolute",bottom:16,right:16}}>
        <button className="btn" style={{background:"rgba(6,16,10,0.88)",color:"rgba(140,255,160,0.85)",border:"1px solid rgba(50,180,80,0.3)",fontSize:11,backdropFilter:"blur(6px)"}}
          onClick={()=>{const i=document.createElement("input");i.type="file";i.accept=".png,.jpg,.svg,.pdf";i.onchange=()=>pushToast("อัปโหลดผังฟาร์มสำเร็จ","success");i.click();}}>
          <I.Plus size={12}/> อัปโหลดผังฟาร์ม
        </button>
      </div>
    </div>
  );
}

function FarmMap({ layer, pins, devices, onSelect, selected }) {
  // svg-based stylized farm plot
  return (
    <div style={{position: "absolute", inset: 0}}>
      <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" style={{position: "absolute", inset: 0}}>
        {/* background subtle grid */}
        {Array.from({length: 10}).map((_, i) => (
          <line key={"v"+i} x1={i*10} y1="0" x2={i*10} y2="100" stroke="var(--hair-2)" strokeWidth="0.05"/>

function ReportsPage() {
  const [type, setType] = React.useState("all");

  const filtered = type==="all" ? reports : reports.filter(r => r.kind?.toLowerCase()===type || r.kind===type);

  function handleNewReport() {
    pushModal(<NewReportModal onDone={(kind, zones, fmt) => {
      const id = "RPT-" + Date.now();
      const name = kind==="Daily" ? `รายงานประจำวัน — ${new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}`

        : `รายงาน ${kind} — ${new Date().toLocaleDateString('th-TH')}`;
      if (demo) { pushToast("Demo: สร้างรายงาน "+name,"warn"); return; }
      const userId = window._supabase?.auth?.getUser ? null : null;
      window.sbReports.insert({ id, name, kind, file_size:"กำลังสร้าง...", format:fmt||"PDF", zones:zones||['A','B','C','D'] })
        .then(() => { pushToast("สร้างรายงานสำเร็จ · กำลังประมวลผล…","success"); refetch(); });
    }}/>);
  }

  function handleDownload(r) {
    const content = `รายงาน: ${r.name}\nรหัส: ${r.id}\nประเภท: ${r.kind}\nสร้างโดย: ${r.created_by_name || (r.profiles && r.profiles.full_name) || "—"}\nวันที่: ${formatDate(r.created_at)}`;
    const blob = new Blob([content],{type:"text/plain;charset=utf-8"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${r.id}.txt`; a.click();
    pushToast(`ดาวน์โหลด ${r.name}`,"success");
  }

  function handleDelete(r) {
    pushModal(<ConfirmModal icon={<I.Trash size={24}/>} tone="danger"
      title={`ลบรายงาน?`} desc={r.name} confirmLabel="ลบ"
      onConfirm={() => {
        if (demo) return;
        window.sbReports.delete(r.id).then(() => { pushToast("ลบรายงานแล้ว","danger"); refetch(); });
      }}/>);
  }

    <>

function UsersPage() {
  const demo = !window.sb();
  const currentUser = window._currentUser || {};

  const { data: dbProfiles, loading, refetch } = useSB(
    () => window.sbProfiles.getAll(), []
  );
  const profiles = dbProfiles || window.DEMO.profiles;

  function handleInvite() {
    pushModal(<InviteUserModal onInvite={u => {
      if (demo) { pushToast("Demo mode","warn"); return; }
      pushToast(`ส่งคำเชิญถึง ${u.email} แล้ว`,"success");
    }}/>);
  }

  function handleRoleChange(profileId, newRole) {
    if (demo) { pushToast("Demo mode","warn"); return; }
    window.sbProfiles.update(profileId, { role: newRole })
      .then(() => { pushToast("อัพเดต Role แล้ว","success"); refetch(); });
  }

  function handleDelete(p) {
    pushModal(<ConfirmModal icon={<I.Trash size={24}/>} tone="danger"
      title={`ลบผู้ใช้ ${p.full_name||p.name}?`}
      desc="ไม่สามารถย้อนกลับได้ — ผู้ใช้จะสูญเสียการเข้าถึงทั้งหมด"
      confirmLabel="ลบผู้ใช้"
      onConfirm={() => {
        // Can only delete via Supabase admin API or edge function
        pushToast("ต้องลบผ่าน Supabase Dashboard (auth.users)","warn");
      }}/>);
  }

  function handleExport() {
    const rows = ["ชื่อ,อีเมล,บทบาท,เข้าใช้ล่าสุด",
      ...profiles.map(u => `${u.full_name||u.name||""},${u.email||""},${u.role||"Viewer"},${formatDate(u.last_seen)||"—"}`)
    ].join("\n");
    const blob = new Blob([rows],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="users.csv"; a.click();
    pushToast("Export รายชื่อผู้ใช้สำเร็จ","success");
  }

  const roleCounts = { Owner:0, Admin:0, Manager:0, "Farm Operator":0, Viewer:0 };
  profiles.forEach(p => { const r = p.role||"Viewer"; if (roleCounts[r]!==undefined) roleCounts[r]++; else roleCounts["Viewer"]++; });

  return (
    <>
      <div className="page-head">
        <div>
          <div className="muted small uc">User Management · {profiles.length} บัญชี · {demo?"Demo":"Supabase Auth"}</div>
          <h1>Users & Permissions</h1>
          <div className="meta mt-2">จัดการบทบาทและสิทธิ์ · เชิญผู้ใช้ · ติดตามกิจกรรม</div>
        </div>
        <div className="spacer"/>
        <div className="actions">
          <button className="btn" onClick={refetch} disabled={loading}><I.Refresh size={14}/></button>
          <button className="btn" onClick={handleExport}><I.Export size={14}/> Export</button>
          <button className="btn primary" onClick={handleInvite}><I.Plus size={14}/> เชิญผู้ใช้</button>
        </div>
      </div>

      {/* Role KPIs */}
      <div className="grid g-4 mb-4">
        {[
          {role:"Admin/Owner",  count:(roleCounts.Owner+roleCounts.Admin),       desc:"ควบคุมระบบทั้งหมด",           c:"var(--ink)"},
          {role:"Manager",      count:roleCounts.Manager,                         desc:"จัดการฟาร์มและรายงาน",        c:"var(--sage-2)"},
          {role:"Farm Operator",count:roleCounts["Farm Operator"],                desc:"ดูแลอุปกรณ์และโซน",          c:"var(--info)"},
          {role:"Viewer",       count:roleCounts.Viewer,                          desc:"ดูข้อมูลอย่างเดียว",          c:"var(--muted)"},
        ].map(r=>(
          <div className="card" key={r.role}>
            <div className="flex-cb"><div className="tiny mono uc muted">{r.role}</div><div style={{width:8,height:8,borderRadius:999,background:r.c}}/></div>
            <div className="serif" style={{fontSize:36,letterSpacing:"-0.02em",marginTop:6}}>{r.count}<span className="muted" style={{fontSize:14}}> บัญชี</span></div>
            <div className="small muted mt-2">{r.desc}</div>
          </div>
        ))}
      </div>

      {demo && (
        <div style={{background:"var(--warn-soft)",border:"1px solid var(--warn)",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,display:"flex",gap:10}}>
          <I.Alert size={14} stroke="var(--warn)"/>
          <span style={{color:"var(--warn)"}}>Demo Mode — แสดง Demo Users เท่านั้น กรอก Supabase credentials เพื่อดูผู้ใช้จริง</span>
        </div>
      )}

      {/* Users Table */}
      <div className="card mb-4" style={{padding:0}}>
        <div className="card-h" style={{padding:18,marginBottom:0,borderBottom:"1px solid var(--hair-2)"}}>
          <div className="card-title">ผู้ใช้ทั้งหมด ({profiles.length})</div>
          <div className="search"><I.Search size={14}/><input placeholder="ค้นหาชื่อหรืออีเมล..."/></div>
        </div>
        {loading ? (
          <div className="loading-state"><div className="spinner"/><div className="small muted">กำลังโหลด…</div></div>
        ) : (
          <table className="tbl">
            <thead><tr><th>ผู้ใช้</th><th>บทบาท</th><th>เข้าใช้ล่าสุด</th><th>Auth Provider</th><th></th></tr></thead>
            <tbody>
              {profiles.map(u=>(
                <tr key={u.id}>
                  <td>
                    <div className="flex-c gap-3">
                      <div style={{width:36,height:36,borderRadius:8,overflow:"hidden",flexShrink:0}}>
                        {u.avatar_url
                          ? <img src={u.avatar_url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                          : <div className="avatar-img" style={{width:36,height:36,fontSize:14,display:"grid",placeItems:"center",background:"var(--sage-soft)",color:"var(--sage-2)"}}>{(u.full_name||u.name||u.email||"?")[0].toUpperCase()}</div>
                        }
                      </div>
                      <div>
                        <div className="ink2">{u.full_name||u.name||"—"}</div>
                        <div className="tiny mono muted">{u.email||"—"}</div>
                      </div>
                      {u.id === currentUser.id && <span className="chip info" style={{fontSize:9}}>คุณ</span>}

                  </td>
                  <td>

                      disabled={u.id===currentUser.id}
                      style={{fontFamily:"var(--f-sans)",fontSize:12,padding:"5px 8px",background:"var(--cream)",border:"1px solid var(--hair)",borderRadius:6,color:"var(--ink)",outline:"none",cursor:u.id===currentUser.id?"not-allowed":"pointer"}}>

                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* Permission Matrix */}
      <div className="card">
        <div className="card-h">
          <div><div className="card-title">Permission Matrix</div><div className="card-sub">สิทธิ์ตามบทบาท · View/Edit/Delete per Module</div></div>
        </div>
        <table className="tbl">

  const authUser = window._currentUser || {};

  const [name,   setName]   = React.useState(meta.full_name || meta.name || authUser.email?.split('@')[0] || "");
  const [phone,  setPhone]  = React.useState("");
  const [lineId, setLineId] = React.useState("");

    () => authUser.id && !demo ? window.sbProfiles.getOne(authUser.id) : null,

      setName(profile.full_name || "");

        setTimeout(() => setSaved(false), 3000);

function App() {
  const [user,    setUser]    = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [page,    setPage]    = React.useState("dashboard");
  const [drawerOpen, setDrawerOpen] = React.useState(false);

  // Global search state
  const [globalSearch, setGlobalSearch] = React.useState("");
  window._setPage = setPage;

  React.useEffect(() => {
    // Init Supabase from localStorage if not already done
    const url = localStorage.getItem("sf_sb_url");
    const key = localStorage.getItem("sf_sb_key");
    if (url && key && window.supabase && !window._supabase) {
      try { window._supabase = window.supabase.createClient(url, key); }
      catch(e) { console.warn("Supabase init error:", e); }
    }

    const sb = window._supabase;
    if (!sb) { setLoading(false); return; }

    // Check existing session
    sb.auth.getSession().then(result => {
      const session = result.data && result.data.session;
      if (session && session.user) {
        upsertProfile(sb, session.user);
        fetchRole(sb, session.user).then(role => {
          setUser({ ...session.user, _role: role });
          setLoading(false);
        });
      } else {
        setLoading(false);
      }
    }).catch(() => { setLoading(false); });

    // Listen for auth state changes (handles OAuth redirect)
    let sub = null;
    try {
      const result = sb.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_IN" && session && session.user) {
          upsertProfile(sb, session.user);
          fetchRole(sb, session.user).then(role => {
            setUser({ ...session.user, _role: role });
            setLoading(false);
          });
        } else if (event === "SIGNED_OUT") {
          setUser(null);
        }
      });
      sub = result.data && result.data.subscription;
    } catch(e) { console.warn("onAuthStateChange:", e); }

    return () => { if (sub) try { sub.unsubscribe(); } catch(e) {} };
  }, []);

  function handleLogout() {
    const sb = window._supabase;
    if (sb && user && !user._demo) {
      sb.auth.signOut().catch(() => {});
    }
    setUser(null);
    setPage("dashboard");
  }

  // Close drawer on page change
  function navigateTo(p) {
    setPage(p);
    setDrawerOpen(false);
  }

  if (loading) return (
    <div style={{height:"100vh",display:"grid",placeItems:"center",background:"var(--cream)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:40,height:40,border:"3px solid var(--sage-2)",borderTopColor:"transparent",borderRadius:"50%",animation:"lspin 0.8s linear infinite",margin:"0 auto 16px"}}/>
        <div className="muted small">กำลังตรวจสอบ session…</div>
      </div>
      <style>{`@keyframes lspin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );

  // Store user globally for ProfileTab and other components
if (user) window._currentUser = user;
if (!user) return <LoginPage onLogin={u => { setUser(u); setPage("dashboard"); window._currentUser = u; }}/>;

  const Page = {
    dashboard:     DashboardPage,
    command:       CommandCenterPage,
    executive:     ExecutiveDashboardPage,
    sensors:       SensorsPage,
    devices:       DevicesPage,
    map:           MapPage,
    farm3d:        Farm3DPage,
    twin:          DigitalTwinPage,
    ai:            AIPage,
    vision:        VisionAnalyticsPage,
    predictive:    PredictiveAIPage,
    assistant:     AIAssistantPage,
    drone:         DroneIntelligencePage,
    reports:       ReportsPage,
    automation:    AutomationPage,
    water:         WaterManagementPage,
    energy:        EnergyManagementPage,
    production:    ProductionPage,
    inventory:     InventoryPage,
    maintenance:   MaintenancePage,
    cctv:          CCTVPage,
    access:        AccessControlPage,
    connections:   ConnectionsPage,
    notifications: NotificationsPage,
    users:         UsersPage,
    settings:      SettingsPage,
  }[page] || DashboardPage;

  return (
    <div className="app">
      {/* Desktop sidebar */}
      <Sidebar page={page} setPage={navigateTo} onLogout={handleLogout} user={user}/>

      {/* Mobile drawer overlay */}
      <div className={`mobile-overlay ${drawerOpen ? "open" : ""}`} onClick={() => setDrawerOpen(false)}/>
      <div className={`mobile-drawer ${drawerOpen ? "open" : ""}`}>
        <Sidebar page={page} setPage={navigateTo} onLogout={handleLogout} user={user}/>
      </div>

      <div data-screen-label={PAGE_META[page]?.title || page}>
        <Topbar page={page} user={user} onLogout={handleLogout}
          onMenuClick={() => setDrawerOpen(v => !v)}
          globalSearch={globalSearch} setGlobalSearch={setGlobalSearch}
          navigateTo={navigateTo}/>
        <main className="main">
          <Page/>
        </main>
      </div>
      <ModalRoot/>
      <ToastRoot/>
    </div>
  );
}

// ── Supabase helpers (no async/await) ─────────────────────────
function upsertProfile(sb, user) {
  if (!sb || !user || !user.id) return;
  const meta = user.user_metadata || {};
  sb.from("profiles").upsert({
    id:         user.id,
    email:      user.email || "",
    full_name:  meta.full_name || meta.name || (user.email || "").split("@")[0] || "",
    avatar_url: meta.avatar_url || meta.picture || null,
    last_seen:  new Date().toISOString(),
    updated_at: new Date().toISOString(),
  }, { onConflict: "id" }).catch(e => console.warn("upsertProfile:", e.message));
}

function fetchRole(sb, user) {
  if (!sb || !user || !user.id) return Promise.resolve("Viewer");
  return sb.from("profiles").select("role").eq("id", user.id).single()
    .then(res => (res.data && res.data.role) || "Viewer")
    .catch(() => "Viewer");
}

      {ALERTS.map((a, i) => (
        <div key={i} className="alert-row">
          <div className={cx("alert-dot", a.sev)}/>
          <div>
            <div className="alert-title">{a.title}</div>
            <div className="alert-meta">{a.meta}</div>
          </div>
          <div className="alert-time">{a.time}</div>
        </div>
      ))}
    </Modal>
  );
}

function ConnectionsPage() {
  const [conns, setConns]     = React.useState(INIT_CONNECTIONS);
  const [tab, setTab]         = React.useState("all"); // all | cctv | iot
  const [search, setSearch]   = React.useState("");
  const [testing, setTesting] = React.useState({});

  const filtered = conns.filter(c => {
    const matchTab = tab === "all" || c.type === tab;
    const matchS   = !search || c.name.toLowerCase().includes(search.toLowerCase()) ||
                     c.host.includes(search) || c.protocol.toLowerCase().includes(search.toLowerCase());
    return matchTab && matchS;
  });

  const onlineCount  = conns.filter(c => c.status === "online").length;
  const cctvCount    = conns.filter(c => c.type === "cctv").length;
  const iotCount     = conns.filter(c => c.type === "iot").length;
  const warnCount    = conns.filter(c => c.status === "warn" || c.status === "offline").length;

  function testConnection(id) {
    setTesting(prev => ({...prev, [id]: "testing"}));
    setTimeout(() => {
      const c = conns.find(x => x.id === id);
      const result = c.status === "offline" ? "fail" : "ok";
      setTesting(prev => ({...prev, [id]: result}));
      if (result === "ok") pushToast(`${c.name} — เชื่อมต่อสำเร็จ`, "success");
      else pushToast(`${c.name} — ไม่สามารถเชื่อมต่อได้`, "danger");
      setTimeout(() => setTesting(prev => { const n={...prev}; delete n[id]; return n; }), 3000);
    }, 1800 + Math.random()*800);
  }

  function deleteConn(id) {
    setConns(prev => prev.filter(c => c.id !== id));
    pushToast("ลบการเชื่อมต่อแล้ว", "danger");
  }

  function openAdd(defaultType) {
    pushModal(<AddConnectionModal
      defaultType={defaultType || "iot"}
      existingIds={conns.map(c => c.id)}
      onAdd={conn => { setConns(prev => [...prev, conn]); pushToast(`เพิ่ม ${conn.name} สำเร็จ`, "success"); }}
    />);
  }

  const STATUS_CHIP = {
    online:  <Chip tone="sage" dot>Online</Chip>,
    offline: <Chip tone="danger" dot>Offline</Chip>,
    warn:    <Chip tone="warn" dot>Warning</Chip>,
  };

  return (
    <>
      {/* ── Header ── */}
      <div className="page-head">
        <div>
          <div className="muted small uc">การเชื่อมต่ออุปกรณ์ · CCTV + IoT</div>
          <h1>Connections</h1>
          <div className="meta mt-2">
            {conns.length} อุปกรณ์ · {onlineCount} online · {cctvCount} กล้อง · {iotCount} IoT
            {warnCount > 0 && <span style={{color:"var(--danger)"}}> · {warnCount} มีปัญหา</span>}
          </div>
        </div>
        <div className="spacer"/>
        <div className="actions">
          <div className="search">
            <I.Search size={14}/>
            <input placeholder="ค้นหา IP, ชื่อ, โปรโตคอล..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <button className="btn" onClick={()=>openAdd("cctv")}><I.Video size={14}/> เพิ่มกล้อง</button>
          <button className="btn primary" onClick={()=>openAdd("iot")}><I.Plug size={14}/> เพิ่ม IoT</button>
        </div>
      </div>

      {/* ── KPI strip ── */}
      <div className="grid g-4 mb-4">
        {[
          { l:"อุปกรณ์ทั้งหมด", v:conns.length,   u:"",   icon:"Plug",   color:"var(--sage)"   },
          { l:"กล้อง CCTV",     v:cctvCount,       u:"",   icon:"Video",  color:"var(--info)"   },
          { l:"IoT Devices",    v:iotCount,         u:"",   icon:"Wifi",   color:"var(--sage-2)" },
          { l:"มีปัญหา",        v:warnCount,        u:"",   icon:"Alert",  color:warnCount?"var(--danger)":"var(--muted)" },
        ].map(k => {
          const Ico = I[k.icon];
          return (
            <div className="kpi" key={k.l}>
              <div className="kpi-row">
                <div className="kpi-label">{k.l}</div>
                <div className="kpi-icon" style={{color:k.color,background:"var(--cream)"}}><Ico size={14}/></div>
              </div>
              <div className="kpi-value" style={{color:k.color}}>{k.v}</div>
            </div>
          );
        })}
      </div>

      {/* ── Tab bar ── */}
      <div className="flex-c gap-3 mb-4">
        <div className="seg">
          {[{v:"all",l:"ทั้งหมด"},{v:"cctv",l:"📷 กล้อง CCTV"},{v:"iot",l:"📡 IoT Devices"}].map(t=>(
            <button key={t.v} className={cx(tab===t.v&&"on")} onClick={()=>setTab(t.v)}>{t.l}</button>
          ))}
        </div>
        <div style={{flex:1}}/>
        <button className="btn" onClick={()=>{
          conns.forEach(c => setTimeout(() => testConnection(c.id), Math.random()*500));
        }}><I.Refresh size={14}/> ทดสอบทั้งหมด</button>
      </div>

      {/* ── Connection cards ── */}
      {filtered.length === 0 ? (
        <div className="card" style={{textAlign:"center",padding:"56px",color:"var(--muted)"}}>
          <I.Plug size={36}/>
          <div className="serif mt-4" style={{fontSize:18}}>ยังไม่มีการเชื่อมต่อ</div>
          <div className="small mt-2 mb-4">เริ่มเพิ่มกล้อง CCTV หรืออุปกรณ์ IoT</div>
          <div className="flex-c gap-3" style={{justifyContent:"center"}}>
            <button className="btn" onClick={()=>openAdd("cctv")}><I.Video size={14}/> เพิ่มกล้อง</button>
            <button className="btn primary" onClick={()=>openAdd("iot")}><I.Plug size={14}/> เพิ่ม IoT</button>
          </div>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>
          {filtered.map(c => (
            <ConnectionCard
              key={c.id} conn={c}
              testState={testing[c.id]}
              onTest={()=>testConnection(c.id)}
              onEdit={()=>pushModal(<EditConnectionModal conn={c} onSave={updated=>{setConns(prev=>prev.map(x=>x.id===updated.id?updated:x));pushToast(`อัพเดต ${updated.name}`,"success");}}/>)}
              onDelete={()=>pushModal(<ConfirmModal icon={<I.Trash size={22}/>} tone="danger" title={`ลบ ${c.name}?`} desc="การเชื่อมต่อนี้จะถูกยกเลิกและลบออกจากระบบ" confirmLabel="ลบ" onConfirm={()=>deleteConn(c.id)}/>)}
              STATUS_CHIP={STATUS_CHIP}
            />
          ))}

          {/* Add card */}
          <div onClick={()=>openAdd(tab==="cctv"?"cctv":"iot")}
            style={{border:"2px dashed var(--hair)",borderRadius:12,padding:"20px 24px",display:"flex",alignItems:"center",gap:16,cursor:"pointer",color:"var(--muted)",transition:"all 0.15s"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--sage)";e.currentTarget.style.color="var(--sage-2)";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--hair)";e.currentTarget.style.color="var(--muted)";}}>
            <div style={{width:40,height:40,borderRadius:10,border:"2px dashed currentColor",display:"grid",placeItems:"center",flexShrink:0}}><I.Plus size={18}/></div>
            <div>
              <div style={{fontFamily:"var(--f-serif)",fontSize:14}}>เพิ่มการเชื่อมต่อใหม่</div>
              <div style={{fontFamily:"var(--f-mono)",fontSize:11,marginTop:2}}>CCTV · RTSP / ONVIF · IoT · MQTT / Modbus / Zigbee / HTTP</div>
            </div>
          </div>
        </div>
      )}

      {/* ── Protocol Guide ── */}
      <div className="card">
        <div className="card-h">
          <div className="card-title">โปรโตคอลที่รองรับ</div>
          <div className="card-sub">Supported Protocols</div>
        </div>
        <div className="grid g-4" style={{gap:14}}>
          {[
            {proto:"RTSP",     cat:"CCTV",  desc:"กล้องวงจรปิดทั่วไป Hikvision, Dahua, Axis", port:"554",   color:"var(--info)"},
            {proto:"ONVIF",    cat:"CCTV",  desc:"มาตรฐาน IP Camera ทุกยี่ห้อ",              port:"80",    color:"var(--info)"},
            {proto:"MQTT",     cat:"IoT",   desc:"Lightweight pub/sub สำหรับ sensor ทั่วไป",  port:"1883",  color:"var(--sage-2)"},
            {proto:"Modbus",   cat:"IoT",   desc:"PLC, Industrial controller, Energy meter",  port:"502",   color:"var(--warn)"},
            {proto:"Zigbee",   cat:"IoT",   desc:"Mesh network สำหรับ sensor ประหยัดไฟ",     port:"—",     color:"var(--sage)"},
            {proto:"LoRa",     cat:"IoT",   desc:"Long range, low power — LoRaWAN Gateway",   port:"1700",  color:"var(--sage)"},
            {proto:"HTTP/REST",cat:"IoT",   desc:"API-based device, Web hook, Custom firmware",port:"80/443",color:"var(--muted)"},
            {proto:"Modbus RTU",cat:"IoT",  desc:"Serial RS-485 ผ่าน USB/RS-485 Converter",   port:"COM",   color:"var(--warn)"},

// ── Connection Card component ──────────────────────────────────
function ConnectionCard({ conn, testState, onTest, onEdit, onDelete, STATUS_CHIP }) {
  const [expanded, setExpanded] = React.useState(false);
  const isCCTV = conn.type === "cctv";
  const Ico    = isCCTV ? I.Video : I.Wifi;

  const testBtn = testState === "testing"
    ? <button className="btn" disabled style={{opacity:0.6}}><I.Refresh size={12}/> กำลังทดสอบ…</button>
    : testState === "ok"
    ? <button className="btn" style={{color:"var(--sage-2)",borderColor:"var(--sage)"}}><I.Check size={12}/> สำเร็จ</button>
    : testState === "fail"
    ? <button className="btn" style={{color:"var(--danger)",borderColor:"var(--danger)"}}><I.Alert size={12}/> ล้มเหลว</button>
    : <button className="btn" onClick={onTest}><I.Signal size={12}/> ทดสอบ</button>;

  return (
    <div className="card" style={{padding:0,overflow:"hidden"}}>
      {/* Main row */}
      <div style={{padding:"16px 18px",display:"flex",alignItems:"center",gap:14,cursor:"pointer"}} onClick={()=>setExpanded(v=>!v)}>
        {/* Type icon */}
        <div style={{width:40,height:40,borderRadius:10,flexShrink:0,display:"grid",placeItems:"center",
          background:conn.status==="online"?(isCCTV?"var(--info-soft)":"var(--sage-soft)"):conn.status==="warn"?"var(--warn-soft)":"var(--danger-soft)",
          color:conn.status==="online"?(isCCTV?"var(--info)":"var(--sage-2)"):conn.status==="warn"?"var(--warn)":"var(--danger)",
        }}>
          <Ico size={18}/>
        </div>

        {/* Info */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:3}}>
            <div className="serif" style={{fontSize:15,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{conn.name}</div>
            {STATUS_CHIP[conn.status]}
          </div>
          <div className="flex-c gap-3">
            <span className="tiny mono muted">{conn.host}:{conn.port}</span>
            <span className="tiny mono" style={{background:"var(--cream)",padding:"1px 6px",borderRadius:4}}>{conn.protocol}</span>
            <span className="tiny muted">โซน {conn.zone}</span>
            {isCCTV
              ? <span className="tiny muted">{conn.res} · {conn.fps} fps</span>
              : <span className="tiny muted">{conn.sensors} sensors</span>
            }
          </div>
        </div>

        {/* Actions */}
        <div className="flex-c gap-2" onClick={e=>e.stopPropagation()}>
          {testBtn}
          <button className="icon-btn" onClick={onEdit}><I.Edit size={13}/></button>
          <button className="icon-btn" onClick={onDelete}><I.Trash size={13}/></button>
          <div style={{color:"var(--muted)",transform:expanded?"rotate(180deg)":"none",transition:"transform 0.2s"}}><I.Down size={14}/></div>
        </div>
      </div>

      {/* Expanded detail */}
      {expanded && (
        <div style={{borderTop:"1px solid var(--hair-2)",padding:"16px 18px",background:"var(--cream)"}}>
          <div className="grid g-4" style={{gap:16}}>
            {[
              {l:"Model",        v:conn.model},
              {l:"Host / IP",    v:`${conn.host}:${conn.port}`},
              {l:"Protocol",     v:conn.protocol},
              {l:"Zone",         v:`โซน ${conn.zone}`},
              {l:"Last Seen",    v:conn.last},
              isCCTV
                ? {l:"Resolution", v:`${conn.res} @ ${conn.fps}fps`}
                : {l:"Sensors",    v:`${conn.sensors} nodes`},
              isCCTV
                ? {l:"Stream URL", v:`rtsp://${conn.host}/stream`}
                : {l:"Topic",      v:`farm/${conn.zone.toLowerCase()}/#`},
              {l:"Uptime",       v:"99.2% (30d)"},
            ].map(x=>(
              <div key={x.l}>
                <div className="tiny mono uc muted">{x.l}</div>
                <div className="mono small mt-1" style={{wordBreak:"break-all"}}>{x.v}</div>
              </div>
            ))}
          </div>

          {isCCTV && (
            <div style={{marginTop:16,padding:"12px 14px",background:"var(--paper)",borderRadius:8,display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:120,height:68,background:conn.status==="online"?"#111":"var(--hair-2)",borderRadius:6,display:"grid",placeItems:"center",flexShrink:0}}>
                {conn.status==="online"
                  ? <div style={{color:"rgba(255,255,255,0.5)",fontFamily:"var(--f-mono)",fontSize:9,textAlign:"center"}}>LIVE<br/>PREVIEW</div>
                  : <div style={{color:"var(--muted-2)",fontFamily:"var(--f-mono)",fontSize:9}}>OFFLINE</div>
                }
              </div>
              <div>
                <div className="small ink2 mb-1">Stream URL</div>
                <div className="tiny mono muted" style={{wordBreak:"break-all"}}>{`rtsp://${conn.host}:${conn.port}/Streaming/Channels/101`}</div>
                <button className="btn mt-3" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>pushToast("เปิดใน VLC / Player","success")}>
                  <I.Video size={11}/> เปิด Stream
                </button>
              </div>
            </div>
          )}

          <div className="flex gap-2 mt-3">
            <button className="btn" onClick={onTest} style={{fontSize:12}}><I.Signal size={12}/> ทดสอบการเชื่อมต่อ</button>
            <button className="btn" onClick={onEdit} style={{fontSize:12}}><I.Edit size={12}/> แก้ไข</button>
            <button className="btn" style={{fontSize:12}} onClick={()=>pushToast("คัดลอก config แล้ว","success")}><I.Export size={12}/> Export Config</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Modal: เพิ่มการเชื่อมต่อใหม่ ─────────────────────────────
function AddConnectionModal({ defaultType, existingIds, onAdd }) {
  const [step, setStep]       = React.useState(1); // 1=type 2=config 3=test
  const [type, setType]       = React.useState(defaultType);
  const [testState, setTestState] = React.useState(null); // null | testing | ok | fail
  const [form, setForm]       = React.useState({
    name:"", host:"", port:"", protocol:"MQTT", zone:"A",
    user:"", pass:"", topic:"farm/#", model:"",
    rtspPath:"/stream", fps:"25", res:"4MP",
  });
  const f = (k,v) => setForm(prev=>({...prev,[k]:v}));

  const PROTOCOLS_CCTV = ["RTSP","ONVIF","HTTP"];
  const PROTOCOLS_IOT  = ["MQTT","Modbus","Zigbee","LoRa","HTTP/REST","Modbus RTU"];

  function defaultPort(proto) {
    return {RTSP:"554",ONVIF:"80",MQTT:"1883",Modbus:"502",Zigbee:"8080",LoRa:"1700","HTTP/REST":"80","Modbus RTU":"COM1",HTTP:"80"}[proto]||"";
  }

  function startTest() {
    setStep(3); setTestState("testing");
    setTimeout(() => {
      setTestState("ok");
    }, 2200 + Math.random()*800);
  }

  function handleSave() {
    const id = `${type==="cctv"?"cam":"iot"}-${Date.now().toString(36)}`;
    onAdd({
      id, type,
      name: form.name || `${type==="cctv"?"CAM":"IoT"}-${id.slice(-4).toUpperCase()}`,
      host: form.host, port: form.port || defaultPort(form.protocol),
      protocol: form.protocol, zone: form.zone, status:"online",
      model: form.model || "Custom Device", last:"just now",
      ...(type==="cctv"
        ? {fps:parseInt(form.fps)||25, res:form.res}
        : {sensors:0, freq:"—"}
      ),
    });
    popModal();
  }

  const canNext = step===1 ? true : (form.host.trim().length>0 && form.name.trim().length>0);

  return (
    <Modal wide title="เพิ่มการเชื่อมต่อใหม่" sub="เชื่อมต่ออุปกรณ์ CCTV หรือ IoT เข้าสู่ระบบ"
      footer={
        <div style={{display:"flex",alignItems:"center",width:"100%",gap:8}}>
          {/* Step indicators */}
          <div className="flex-c gap-2">
            {[1,2,3].map(s=>(
              <div key={s} style={{width:24,height:24,borderRadius:999,display:"grid",placeItems:"center",fontSize:11,fontFamily:"var(--f-mono)",
                background:step>=s?"var(--ink)":"var(--hair-2)",color:step>=s?"var(--paper)":"var(--muted)"}}>
                {step>s ? <I.Check size={11}/> : s}
              </div>
            ))}
            <span className="tiny mono muted">{["","เลือกประเภท","กรอกข้อมูล","ทดสอบ"][step]}</span>
          </div>
          <div style={{flex:1}}/>
          <button className="btn" onClick={step===1?popModal:()=>setStep(s=>s-1)}>
            {step===1?"ยกเลิก":"← ย้อนกลับ"}
          </button>
          {step < 3
            ? <button className="btn primary" disabled={!canNext} onClick={()=>step===2?startTest():setStep(s=>s+1)}>
                {step===2?"ทดสอบการเชื่อมต่อ →":"ถัดไป →"}
              </button>
            : <button className="btn primary" disabled={testState!=="ok"} onClick={handleSave}>
                <I.Plug size={14}/> บันทึกการเชื่อมต่อ
              </button>
          }
        </div>
      }
    >
      {/* ── Step 1: เลือกประเภท ── */}
      {step===1 && (
        <div>
          <div className="field">
            <label>ประเภทอุปกรณ์</label>
            <div className="grid g-2" style={{gap:14}}>
              {[
                {v:"cctv", icon:"Video",  title:"กล้อง CCTV",    desc:"RTSP · ONVIF · IP Camera\nHikvision, Dahua, Axis, Uniview",    color:"var(--info)"},
                {v:"iot",  icon:"Plug",   title:"IoT Device",     desc:"MQTT · Modbus · LoRa · Zigbee\nESP32, Arduino, PLC, Gateway",  color:"var(--sage-2)"},
              ].map(t=>(
                <div key={t.v} onClick={()=>{ setType(t.v); f("protocol",t.v==="cctv"?"RTSP":"MQTT"); }}
                  style={{border:`2px solid ${type===t.v?t.color:"var(--hair)"}`,borderRadius:12,padding:"20px",cursor:"pointer",
                    background:type===t.v?`color-mix(in srgb, ${t.color} 8%, var(--paper))`:"var(--paper)",transition:"all 0.15s"}}>
                  <div style={{width:44,height:44,borderRadius:12,background:type===t.v?t.color:"var(--cream)",display:"grid",placeItems:"center",marginBottom:12,transition:"all 0.15s"}}>
                    {React.createElement(I[t.icon],{size:22,stroke:type===t.v?"white":"currentColor"})}
                  </div>
                  <div className="serif" style={{fontSize:17,marginBottom:6}}>{t.title}</div>
                  <div style={{fontSize:11,fontFamily:"var(--f-mono)",color:"var(--muted)",whiteSpace:"pre-line",lineHeight:1.7}}>{t.desc}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="field">
            <label>โปรโตคอล</label>
            <div className="flex gap-2" style={{flexWrap:"wrap"}}>
              {(type==="cctv"?PROTOCOLS_CCTV:PROTOCOLS_IOT).map(p=>(
                <div key={p} onClick={()=>f("protocol",p)} style={{
                  border:`1px solid ${form.protocol===p?"var(--ink)":"var(--hair)"}`,
                  background:form.protocol===p?"var(--ink)":"var(--paper)",
                  color:form.protocol===p?"var(--paper)":"var(--ink-2)",
                  padding:"7px 14px",borderRadius:8,fontSize:12,cursor:"pointer",fontFamily:"var(--f-mono)",
                }}>{p}</div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── Step 2: กรอกข้อมูล ── */}
      {step===2 && (
        <div>
          <div className="grid g-2" style={{gap:12}}>
            <div className="field" style={{margin:0}}>
              <label>ชื่ออุปกรณ์ *</label>
              <input value={form.name} onChange={e=>f("name",e.target.value)} placeholder={type==="cctv"?"เช่น CAM-A01 ทางเข้า":"เช่น Gateway-LoRa โซน A"}/>
            </div>
            <div className="field" style={{margin:0}}>
              <label>รุ่น / Model</label>
              <input value={form.model} onChange={e=>f("model",e.target.value)} placeholder={type==="cctv"?"เช่น Hikvision DS-2CD2143G2":"เช่น ESP32 + DHT22"}/>
            </div>
          </div>

          <div className="grid g-2" style={{gap:12,marginTop:12}}>
            <div className="field" style={{margin:0}}>
              <label>IP Address / Host *</label>
              <input value={form.host} onChange={e=>f("host",e.target.value)} placeholder="192.168.1.100" style={{fontFamily:"var(--f-mono)"}}/>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Port</label>
              <input value={form.port||defaultPort(form.protocol)} onChange={e=>f("port",e.target.value)} placeholder={defaultPort(form.protocol)} style={{fontFamily:"var(--f-mono)"}}/>
            </div>
          </div>

          <div className="field mt-3">
            <label>โซน</label>
            <div className="flex gap-2">
              {FARM_ZONES.map(z=>(
                <div key={z.id} onClick={()=>f("zone",z.id)} style={{flex:1,border:`1px solid ${form.zone===z.id?"var(--ink)":"var(--hair)"}`,background:form.zone===z.id?"var(--ink)":"var(--paper)",color:form.zone===z.id?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>
                  โซน {z.id}
                </div>
              ))}
            </div>
          </div>

          {type==="cctv" ? (
            <div className="grid g-2" style={{gap:12}}>
              <div className="field" style={{margin:0}}>
                <label>RTSP Path</label>
                <input value={form.rtspPath} onChange={e=>f("rtspPath",e.target.value)} placeholder="/Streaming/Channels/101" style={{fontFamily:"var(--f-mono)"}}/>
              </div>
              <div className="field" style={{margin:0}}>
                <label>Resolution</label>
                <select value={form.res} onChange={e=>f("res",e.target.value)} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
                  {["2MP","4MP","8MP","12MP"].map(r=><option key={r}>{r}</option>)}
                </select>
              </div>
            </div>
          ) : (
            <div className="field mt-3">
              <label>Topic / Path (MQTT)</label>
              <input value={form.topic} onChange={e=>f("topic",e.target.value)} placeholder="farm/zone-a/#" style={{fontFamily:"var(--f-mono)"}}/>
            </div>
          )}

          <div className="grid g-2" style={{gap:12,marginTop:form.type==="cctv"?0:0}}>
            <div className="field" style={{margin:0}}>
              <label>Username (ถ้ามี)</label>
              <input value={form.user} onChange={e=>f("user",e.target.value)} placeholder="admin"/>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Password</label>
              <input type="password" value={form.pass} onChange={e=>f("pass",e.target.value)} placeholder="••••••••"/>
            </div>
          </div>

          {/* URL Preview */}
          <div style={{marginTop:16,padding:"12px 14px",background:"var(--cream)",borderRadius:8}}>
            <div className="tiny mono uc muted mb-2">URL Preview</div>
            <div className="mono small" style={{wordBreak:"break-all",color:"var(--sage-2)"}}>
              {type==="cctv"
                ? `rtsp://${form.user?form.user+":***@":""}${form.host||"<ip>"}:${form.port||"554"}${form.rtspPath}`
                : `${form.protocol.toLowerCase()}://${form.host||"<ip>"}:${form.port||defaultPort(form.protocol)}`
              }
            </div>
          </div>
        </div>
      )}

      {/* ── Step 3: ทดสอบ ── */}
      {step===3 && (
        <div style={{textAlign:"center",padding:"24px 0"}}>
          <div style={{
            width:80,height:80,borderRadius:"50%",margin:"0 auto 20px",
            background: testState==="ok"?"var(--sage-soft)":testState==="fail"?"var(--danger-soft)":"var(--cream)",
            display:"grid",placeItems:"center",transition:"all 0.4s",
          }}>
            {testState==="testing" && (
              <div style={{width:32,height:32,border:"3px solid var(--sage-2)",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
            )}
            {testState==="ok"   && <I.Check size={36} stroke="var(--sage-2)"/>}
            {testState==="fail" && <I.Alert size={36} stroke="var(--danger)"/>}
          </div>

          <div className="serif" style={{fontSize:20,marginBottom:8}}>
            {testState==="testing"?"กำลังทดสอบการเชื่อมต่อ…":testState==="ok"?"เชื่อมต่อสำเร็จ!":"ไม่สามารถเชื่อมต่อได้"}
          </div>
          <div className="muted small" style={{marginBottom:24}}>
            {testState==="testing"
              ? `กำลังเชื่อมต่อ ${form.protocol} → ${form.host}:${form.port||defaultPort(form.protocol)}…`
              : testState==="ok"
              ? `${form.protocol} · ${form.host}:${form.port||defaultPort(form.protocol)} · พร้อมใช้งาน`
              : "ตรวจสอบ IP, Port และ Credentials อีกครั้ง"}
          </div>

          {testState==="ok" && (
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginTop:8}}>
              {[
                {l:"Latency",  v:"12 ms"},
                {l:"Protocol", v:form.protocol},
                {l:"Status",   v:"✓ Ready"},
              ].map(x=>(
                <div key={x.l} style={{background:"var(--sage-soft)",borderRadius:8,padding:"12px"}}>
                  <div className="tiny mono uc muted">{x.l}</div>
                  <div className="mono mt-1" style={{color:"var(--sage-2)"}}>{x.v}</div>
                </div>
              ))}
            </div>
          )}
          {testState==="fail" && (
            <button className="btn" onClick={()=>setStep(2)}>← แก้ไขข้อมูล</button>
          )}
        </div>
      )}

      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </Modal>
  );
}

// ── Modal: แก้ไขการเชื่อมต่อ ──────────────────────────────────
function EditConnectionModal({ conn, onSave }) {
  const [name, setName]   = React.useState(conn.name);
  const [host, setHost]   = React.useState(conn.host);
  const [port, setPort]   = React.useState(conn.port);
  const [zone, setZone]   = React.useState(conn.zone);
  const [user, setUser]   = React.useState("");
  const [pass, setPass]   = React.useState("");
  return (
    <Modal title={`แก้ไข — ${conn.id}`} sub={`${conn.type.toUpperCase()} · ${conn.protocol}`}
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button><button className="btn primary" onClick={()=>{popModal();onSave({...conn,name,host,port,zone});}}>บันทึก</button></>}
    >
      <div className="field"><label>ชื่ออุปกรณ์</label><input value={name} onChange={e=>setName(e.target.value)}/></div>
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}><label>IP Address</label><input value={host} onChange={e=>setHost(e.target.value)} style={{fontFamily:"var(--f-mono)"}}/></div>
        <div className="field" style={{margin:0}}><label>Port</label><input value={port} onChange={e=>setPort(e.target.value)} style={{fontFamily:"var(--f-mono)"}}/></div>
      </div>
      <div className="field mt-3"><label>โซน</label>
        <div className="flex gap-2">
          {FARM_ZONES.map(z=>(
            <div key={z.id} onClick={()=>setZone(z.id)} style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"8px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>โซน {z.id}</div>
          ))}
        </div>
      </div>
      <div className="grid g-2" style={{gap:12,marginTop:4}}>
        <div className="field" style={{margin:0}}><label>Username</label><input value={user} onChange={e=>setUser(e.target.value)} placeholder="admin"/></div>
        <div className="field" style={{margin:0}}><label>Password ใหม่</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="เว้นว่างหากไม่เปลี่ยน"/></div>
      </div>
    </Modal>
  );
}

  }

  const filteredLogs = logs.filter(l => {
    const matchFilter = logFilter === "all" || l.action === logFilter;
    const matchSearch = !search || l.name.includes(search) || l.door.includes(search) || l.card.includes(search);
    return matchFilter && matchSearch;

// ── Add Door Modal ────────────────────────────────────────────
function AddDoorModal({ onAdd }) {
  const [name,   setName]   = React.useState("");
  const [zone,   setZone]   = React.useState("A");
  const [type,   setType]   = React.useState("swing");
  const [lock,   setLock]   = React.useState("auto");
  const [reader, setReader] = React.useState("");
  const [cam,    setCam]    = React.useState("—");
  const [err,    setErr]    = React.useState("");

  function save() {
    if (!name.trim()) { setErr("กรุณากรอกชื่อประตู"); return; }
    const id = `DR-${String(Date.now()).slice(-3)}`;
    onAdd({ id, name:name.trim(), zone, type, lock, reader:reader||"—", cam, status:"locked", online:true, lastEvent:"just now" });
    popModal();
  }

  return (
    <Modal title="เพิ่มประตู / จุดเข้าออก" sub="ติดตั้งและเชื่อมต่อประตูเข้าสู่ระบบ"
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button><button className="btn primary" onClick={save}><I.Door size={14}/> เพิ่มประตู</button></>}
    >
      {err&&<div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}
      <div className="field"><label>ชื่อประตู / จุดเข้าออก *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น ประตูทางเข้าหลัก, ประตูโรงเรือน B"/></div>
      <div className="field">
        <label>โซน</label>
        <div className="flex gap-2">
          {FARM_ZONES.map(z=>(
            <div key={z.id} onClick={()=>setZone(z.id)} style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>โซน {z.id}</div>
          ))}
        </div>
      </div>
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}>
          <label>ประเภทประตู</label>
          <div className="flex gap-2" style={{flexWrap:"wrap"}}>
            {["swing","sliding","turnstile","barrier"].map(t=>(
              <div key={t} onClick={()=>setType(t)} style={{border:`1px solid ${type===t?"var(--ink)":"var(--hair)"}`,background:type===t?"var(--ink)":"var(--paper)",color:type===t?"var(--paper)":"var(--ink-2)",padding:"6px 10px",borderRadius:7,fontSize:11,cursor:"pointer",fontFamily:"var(--f-mono)"}}>
                {t}
              </div>
            ))}
          </div>
        </div>
        <div className="field" style={{margin:0}}>
          <label>ระบบล็อก</label>
          <div className="flex gap-2">
            {[{v:"auto",l:"อัตโนมัติ"},{v:"manual",l:"Manual"}].map(o=>(
              <div key={o.v} onClick={()=>setLock(o.v)} style={{flex:1,border:`1px solid ${lock===o.v?"var(--ink)":"var(--hair)"}`,background:lock===o.v?"var(--ink)":"var(--paper)",color:lock===o.v?"var(--paper)":"var(--ink-2)",padding:"8px 0",borderRadius:8,fontSize:12,cursor:"pointer",textAlign:"center"}}>{o.l}</div>
            ))}

// ── Add Card Modal ────────────────────────────────────────────
function AddCardModal({ doors, onAdd }) {
  const [name,   setName]   = React.useState("");
  const [role,   setRole]   = React.useState("Farm Staff");
  const [type,   setType]   = React.useState("standard");
  const [access, setAccess] = React.useState([]);
  const [exp,    setExp]    = React.useState("2027-01-01");
  const [err,    setErr]    = React.useState("");

  function toggleAccess(id) {
    setAccess(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);
  }

  function save() {
    if (!name.trim()) { setErr("กรุณากรอกชื่อผู้ถือบัตร"); return; }
    if (access.length===0 && type!=="master") { setErr("กรุณาเลือกสิทธิ์เข้าถึงอย่างน้อย 1 ประตู"); return; }
    const id = `CRD-${String(Date.now()).slice(-3)}`;
    onAdd({
      id, name:name.trim(), role, type,
      access: type==="master" ? doors.map(d=>d.id) : access,
      status:"active",
      issued: new Date().toISOString().slice(0,10),
      exp, lastUsed:"just now",
    });
    popModal();
  }

  return (
    <Modal wide title="ออกบัตรผ่านใหม่" sub="กำหนดสิทธิ์และขอบเขตการเข้าถึง"
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button><button className="btn primary" onClick={save}><I.CardId size={14}/> ออกบัตร</button></>}
    >
      {err&&<div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}

      {/* Preview */}
      <div style={{background:"var(--cream)",borderRadius:10,padding:"14px 16px",marginBottom:18,display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:52,height:34,borderRadius:8,background:type==="master"?"var(--sage)":type==="temp"?"var(--warn)":"var(--ink)",display:"grid",placeItems:"center",flexShrink:0}}>
          <I.CardId size={18} stroke="white"/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontFamily:"var(--f-serif)",fontSize:15}}>{name||"ชื่อผู้ถือบัตร"}</div>
          <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)",marginTop:2}}>
            {role} · {type==="master"?"Master":type==="temp"?"Temporary":"Standard"} · หมดอายุ {exp}
          </div>
        </div>
        <Chip tone={type==="master"?"sage":type==="temp"?"warn":""}>
          {type==="master"?"MASTER":type==="temp"?"TEMP":"STANDARD"}
        </Chip>
      </div>

      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}><label>ชื่อผู้ถือบัตร *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="ชื่อ-นามสกุล"/></div>
        <div className="field" style={{margin:0}}>
          <label>บทบาท</label>
          <select value={role} onChange={e=>setRole(e.target.value)} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
            {["Owner","Admin","Farm Staff","Contractor","Visitor"].map(r=><option key={r}>{r}</option>)}
          </select>
        </div>
      </div>

      <div className="field mt-3">
        <label>ประเภทบัตร</label>
        <div className="flex gap-2">
          {[{v:"master",l:"🔑 Master",desc:"เข้าได้ทุกประตู"},{v:"standard",l:"💳 Standard",desc:"เลือกสิทธิ์ได้"},{v:"temp",l:"⏱ ชั่วคราว",desc:"หมดอายุตามที่กำหนด"}].map(t=>(
            <div key={t.v} onClick={()=>setType(t.v)} style={{flex:1,border:`1.5px solid ${type===t.v?"var(--ink)":"var(--hair)"}`,background:type===t.v?"var(--ink)":"var(--paper)",color:type===t.v?"var(--paper)":"var(--ink-2)",padding:"10px 8px",borderRadius:9,fontSize:12,cursor:"pointer",textAlign:"center"}}>
              <div>{t.l}</div>
              <div style={{fontSize:10,opacity:.7,marginTop:3,fontFamily:"var(--f-mono)"}}>{t.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {type!=="master" && (
        <div className="field mt-3">
          <label>สิทธิ์เข้าถึงประตู</label>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {doors.map(d=>(
              <div key={d.id} onClick={()=>toggleAccess(d.id)} style={{
                border:`1.5px solid ${access.includes(d.id)?"var(--sage-2)":"var(--hair)"}`,
                borderRadius:8,padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,
                background:access.includes(d.id)?"var(--sage-soft)":"var(--paper)",transition:"all 0.12s",
              }}>
                <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${access.includes(d.id)?"var(--sage-2)":"var(--hair)"}`,background:access.includes(d.id)?"var(--sage-2)":"transparent",display:"grid",placeItems:"center",flexShrink:0}}>
                  {access.includes(d.id)&&<I.Check size={11} stroke="white"/>}
                </div>
                <div>
                  <div className="small ink2">{d.name}</div>
                  <div className="tiny mono muted">{d.id} · โซน {d.zone}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="field mt-3">
        <label>วันหมดอายุ</label>
        <input type="date" value={exp} onChange={e=>setExp(e.target.value)}/>
      </div>
    </Modal>
  );
}
