// Simple animated canvas-based fake live view
function CCTVLiveCanvas({ camId, status, isSelected }) {
  const cvRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const frameRef = React.useRef(0);

  React.useEffect(() => {
    const cv = cvRef.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width = 320;
    const H = cv.height = 180;

    // Use camId as seed for consistent visuals per camera
    const seed = camId.charCodeAt(4) || 1;
    const hue  = (seed * 47) % 360;

    function drawFrame() {
      frameRef.current++;
      const f = frameRef.current;

      if (status === "offline") {
        ctx.fillStyle = "#111"; ctx.fillRect(0,0,W,H);
        // Static noise
        const idata = ctx.createImageData(W,H);
        for (let i = 0; i < idata.data.length; i += 4) {
          const v = Math.random() * 30;
          idata.data[i] = idata.data[i+1] = idata.data[i+2] = v;
          idata.data[i+3] = 255;
        }
        ctx.putImageData(idata,0,0);
        ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
        ctx.fillText("SIGNAL LOST", W/2, H/2 - 6);
        ctx.font = "9px monospace"; ctx.fillText("NO INPUT", W/2, H/2 + 12);
        return;
      }

      // Background — dark green tint (night-vision-ish for farm)
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0, `hsl(${hue},18%,8%)`);
      grad.addColorStop(1, `hsl(${hue},22%,5%)`);
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

      // Fake "foliage" shapes in background
      for (let i = 0; i < 8; i++) {
        const bx = (seed * 31 * (i+1)) % W;
        const by = H * 0.3 + (seed * 13 * (i+1)) % (H * 0.4);
        const br = 20 + (seed * 7 * (i+1)) % 30;
        const alpha = 0.08 + Math.sin(f * 0.01 + i) * 0.02;
        ctx.beginPath();
        ctx.ellipse(bx, by, br, br * 0.6, 0, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${120+hue*0.1},50%,${12+i*2}%,${alpha})`;
        ctx.fill();
      }

      // Ground plane
      ctx.fillStyle = `hsl(${hue},15%,10%)`; ctx.fillRect(0, H*0.65, W, H*0.35);
      // Horizon line
      ctx.strokeStyle = `hsla(${hue},30%,30%,0.3)`; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(0,H*0.65); ctx.lineTo(W,H*0.65); ctx.stroke();

      // Moving "object" (simulated person/vehicle)
      const objX = ((f * (0.8 + seed * 0.1)) % (W + 60)) - 30;
      const objY = H * 0.58;
      ctx.fillStyle = `hsla(${hue},20%,60%,0.8)`;
      ctx.fillRect(objX, objY - 18, 10, 18);
      ctx.beginPath(); ctx.arc(objX + 5, objY - 22, 5, 0, Math.PI*2);
      ctx.fill();

      // Scanlines
      ctx.save(); ctx.globalAlpha = 0.04;
      for (let y = 0; y < H; y += 2) {
        ctx.fillStyle = "#000"; ctx.fillRect(0, y, W, 1);
      }
      ctx.restore();

      // Vignette
      const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
      vig.addColorStop(0, "transparent");
      vig.addColorStop(1, "rgba(0,0,0,0.5)");
      ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

      // Timestamp
      const now = new Date();
      const ts = `${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}:${now.getSeconds().toString().padStart(2,"0")}`;
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.font = "9px monospace"; ctx.textAlign = "right";
      ctx.fillText(ts, W - 8, H - 8);
      ctx.fillText(`${camId}`, 8 + camId.length * 5.4, H - 8);
      ctx.textAlign = "left";

      rafRef.current = requestAnimationFrame(drawFrame);
    }

    rafRef.current = requestAnimationFrame(drawFrame);
    return () => cancelAnimationFrame(rafRef.current);
  }, [camId, status]);

  return (
    <canvas ref={cvRef} style={{
      width:"100%", height:"100%", display:"block",
      imageRendering:"pixelated",
      filter: status==="warn" ? "sepia(0.3) hue-rotate(10deg)" : "none",
    }}/>
  );
}

// Playback timeline component
function PlaybackTimeline({ camId, onSeek }) {
  const [playing, setPlaying]     = React.useState(false);
  const [progress, setProgress]   = React.useState(0.35);
  const [speed, setSpeed]         = React.useState(1);
  const [selectedDate, setSelectedDate] = React.useState("2026-05-14");
  const rafRef = React.useRef(null);
  const tlRef  = React.useRef(null);

  // Fake events on timeline (motion events)
  const events = [
    {t:0.08, color:"var(--warn)",   label:"Motion"},
    {t:0.21, color:"var(--sage-2)", label:"Person"},
    {t:0.35, color:"var(--danger)", label:"Alert"},
    {t:0.52, color:"var(--warn)",   label:"Motion"},
    {t:0.73, color:"var(--sage-2)", label:"Person"},
    {t:0.88, color:"var(--warn)",   label:"Motion"},
  ];

  React.useEffect(() => {
    if (playing) {
      let last = null;
      function tick(ts) {
        if (last) {
          const dt = (ts - last) / 1000;
          setProgress(p => {
            const np = p + dt * speed * 0.01;
            if (np >= 1) { setPlaying(false); return 1; }
            return np;
          });
        }
        last = ts;
        rafRef.current = requestAnimationFrame(tick);
      }
      rafRef.current = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(rafRef.current);
    }
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing, speed]);

  function handleTimelineClick(e) {
    const rect = tlRef.current.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    setProgress(p);
    onSeek && onSeek(p);
  }

  const timeFromProgress = (p) => {
    const h = Math.floor(p * 24);
    const m = Math.floor((p * 24 * 60) % 60);
    return `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}`;
  };

  return (
    <div style={{background:"var(--ink)",padding:"16px 18px",borderRadius:"0 0 12px 12px"}}>
      {/* Camera selector + date */}
      <div className="flex-cb mb-3">
        <div className="flex-c gap-2">
          <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"rgba(255,255,255,0.5)"}}>PLAYBACK</div>
          <Chip tone="">{camId}</Chip>
        </div>
        <div className="flex-c gap-2">
          <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}
            style={{fontFamily:"var(--f-mono)",fontSize:11,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:6,color:"rgba(255,255,255,0.7)",padding:"4px 8px",outline:"none"}}/>
          <button className="btn" style={{fontSize:11,padding:"4px 10px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)"}}>
            <I.Download size={11}/> Export
          </button>
        </div>
      </div>

      {/* Timeline */}
      <div ref={tlRef} className="playback-timeline" onClick={handleTimelineClick} style={{marginBottom:12}}>
        {/* Hour marks */}
        {Array.from({length:25}).map((_,i)=>(
          <div key={i} style={{position:"absolute",left:`${(i/24)*100}%`,top:0,bottom:0,borderLeft:"1px solid rgba(255,255,255,0.06)",pointerEvents:"none"}}>
            {i % 6 === 0 && <div style={{position:"absolute",bottom:2,left:2,fontFamily:"var(--f-mono)",fontSize:8,color:"rgba(255,255,255,0.3)"}}>{i.toString().padStart(2,"0")}</div>}
          </div>
        ))}
        <div className="playback-track">
          <div className="playback-filled" style={{width:`${progress*100}%`}}/>
        </div>
        {/* Events */}
        {events.map((ev,i)=>(
          <div key={i} className="playback-event" style={{left:`${ev.t*100}%`,background:ev.color,top:"50%",transform:"translateY(-50%)"}}
            title={`${ev.label} @ ${timeFromProgress(ev.t)}`}/>
        ))}
        {/* Playhead */}
        <div className="playback-head" style={{left:`calc(${progress*100}% - 6px)`}}/>
      </div>

      {/* Controls */}
      <div className="flex-cb">
        <div className="flex-c gap-2">
          <button className="icon-btn" style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)",width:32,height:32}}
            onClick={() => setProgress(p => Math.max(0, p - 0.04))}><I.SkipB size={14}/></button>
          <button onClick={() => setPlaying(v=>!v)} style={{width:40,height:40,borderRadius:"50%",background:"var(--sage-2)",border:"none",display:"grid",placeItems:"center",cursor:"pointer",color:"white",flexShrink:0}}>
            {playing ? <I.Pause size={18}/> : <I.Play size={18}/>}
          </button>
          <button className="icon-btn" style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)",width:32,height:32}}
            onClick={() => setProgress(p => Math.min(1, p + 0.04))}><I.SkipF size={14}/></button>
          <div style={{fontFamily:"var(--f-mono)",fontSize:13,color:"rgba(255,255,255,0.8)",marginLeft:8}}>
            {timeFromProgress(progress)}
          </div>
        </div>
        <div className="flex-c gap-2">
          <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.4)"}}>SPEED</span>
          {[0.5,1,2,4,8].map(s=>(
            <button key={s} onClick={()=>setSpeed(s)} style={{fontFamily:"var(--f-mono)",fontSize:10,padding:"3px 7px",borderRadius:5,background:speed===s?"rgba(255,255,255,0.18)":"transparent",border:`1px solid ${speed===s?"rgba(255,255,255,0.3)":"transparent"}`,color:speed===s?"white":"rgba(255,255,255,0.4)",cursor:"pointer"}}>
              {s}x
            </button>
          ))}
        </div>
      </div>

      {/* Event legend */}
      <div className="flex-c gap-4 mt-3" style={{paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.08)"}}>
        {[{c:"var(--danger)",l:"Alert"},{c:"var(--warn)",l:"Motion"},{c:"var(--sage-2)",l:"Person Detected"}].map(x=>(
          <div key={x.l} className="flex-c gap-2">
            <div style={{width:8,height:8,borderRadius:2,background:x.c,flexShrink:0}}/>
            <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.5)"}}>{x.l}</span>
          </div>
        ))}
        <div style={{flex:1}}/>
        <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.3)"}}>คลิกบน Timeline เพื่อ Seek</span>
      </div>
    </div>
  );
}

                <button className="btn" style={{fontSize:11,padding:"6px 10px",flex:1,justifyContent:"center"}}
                  onClick={() => toggleCamStatus(selectedCam.id)}>
                  <I.Power size={12}/> {selectedCam.status==="online"?"ปิด":"เปิด"}
                </button>
              </div>

              {/* PTZ Controls (only for PTZ cameras) */}
              {selectedCam.id.startsWith("PTZ") && (
                <div style={{marginTop:14,borderTop:"1px solid var(--hair-2)",paddingTop:14}}>
                  <div className="card-sub mb-3">PTZ Control</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,width:132,margin:"0 auto"}}>
                    {[
                      {d:"",     a:""},
                      {d:"up",   a:"▲"},
                      {d:"",     a:""},
                      {d:"left", a:"◄"},
                      {d:"home", a:"◉"},
                      {d:"right",a:"►"},
                      {d:"",     a:""},
                      {d:"down", a:"▼"},
                      {d:"",     a:""},
                    ].map((b,i)=>(
                      b.d ? (
                        <button key={i} onClick={() => handlePTZ(b.d)} style={{height:38,border:"1px solid var(--hair)",borderRadius:7,background:b.d==="home"?"var(--ink)":"var(--paper)",color:b.d==="home"?"white":"var(--ink-2)",cursor:"pointer",fontSize:14,display:"grid",placeItems:"center"}}>{b.a}</button>
                      ) : <div key={i}/>
                    ))}
                  </div>
                  <div className="flex-c gap-2 mt-3 center" style={{justifyContent:"center"}}>
                    <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)"}}>Pan: {ptzPan}° · Tilt: {ptzTilt}°</div>
                  </div>
                </div>
              )}

              {/* Stream URL */}
              <div style={{marginTop:14,padding:"10px 12px",background:"var(--cream)",borderRadius:8}}>
                <div style={{fontFamily:"var(--f-mono)",fontSize:9,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Stream URL (RTSP)</div>
                <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--ink-2)",wordBreak:"break-all"}}>
                  rtsp://{selectedCam.ip}:554/Streaming/Channels/101
                </div>
                <button className="btn mt-2" style={{fontSize:10,padding:"4px 10px"}} onClick={() => {
                  navigator.clipboard?.writeText(`rtsp://${selectedCam.ip}:554/Streaming/Channels/101`).catch(()=>{});
                  pushToast("คัดลอก URL แล้ว","success");
                }}><I.Export size={11}/> Copy URL</button>
              </div>
            </div>
          )}

          {/* Recording schedule */}
          <div className="card">
            <div className="card-h">
              <div className="card-title">ตารางบันทึก</div>
              <button className="btn" style={{fontSize:11,padding:"5px 10px"}} onClick={() => pushToast("บันทึกตาราง Recording แล้ว","success")}><I.Check size={11}/> บันทึก</button>
            </div>
            {[
              {l:"บันทึกตลอด 24 ชม.", on:true},
              {l:"บันทึกเมื่อตรวจจับ Motion", on:true},
              {l:"AI Person Detection", on:true},
              {l:"บันทึกเสียง", on:false},
            ].map((r,i)=>(
              <div key={i} className="flex-cb" style={{padding:"10px 0",borderBottom:i<3?"1px solid var(--hair-2)":"none"}}>
                <div className="small ink2">{r.l}</div>
                <Toggle on={r.on} onClick={() => pushToast(`${r.l}: ${r.on?"ปิด":"เปิด"}`,"success")}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

// Add CCTV Camera Modal
function AddCCTVModal({ onAdd }) {
  const [name, setName]   = React.useState("");
  const [ip,   setIp]     = React.useState("");
  const [zone, setZone]   = React.useState("A");
  const [model, setModel] = React.useState("");
  const [protocol, setProt] = React.useState("RTSP");
  const [res, setRes]     = React.useState("4MP");
  const [fps, setFps]     = React.useState(25);
  const [err, setErr]     = React.useState("");
  const [testing, setTest] = React.useState(null);

  function doTest() {
    if (!ip.trim()) { setErr("กรุณากรอก IP Address"); return; }
    setErr(""); setTest("loading");
    setTimeout(() => setTest("ok"), 1800 + Math.random()*700);
  }

  function doSave() {
    if (!name.trim()) { setErr("กรุณากรอกชื่อกล้อง"); return; }
    if (!ip.trim())   { setErr("กรุณากรอก IP Address"); return; }
    const idx = Math.floor(Math.random()*900+100);
    onAdd({ id:`CAM-${zone}${String(idx).slice(-2)}`, name:name.trim(), zone, ip, port:"554", protocol, status:"online", fps, res, model:model||"IP Camera" });
    popModal();
  }

  return (
    <Modal title="เพิ่มกล้อง CCTV" sub="เชื่อมต่อกล้องเข้าระบบ SmartFarm"
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button>
        {testing!=="ok"&&<button className="btn" onClick={doTest} disabled={testing==="loading"}>{testing==="loading"?"กำลังทดสอบ…":"ทดสอบการเชื่อมต่อ"}</button>}
        {testing==="ok"&&<button className="btn primary" onClick={doSave}><I.Video size={14}/> เพิ่มกล้อง</button>}
      </>}>
      {err&&<div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}
      {testing==="ok"&&<div style={{background:"var(--sage-soft)",color:"var(--sage-2)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>✓ เชื่อมต่อสำเร็จ — กรอกข้อมูลแล้วกด เพิ่มกล้อง</div>}
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}><label>ชื่อกล้อง *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น CAM-A01 ทางเข้า"/></div>
        <div className="field" style={{margin:0}}><label>รุ่น / Model</label><input value={model} onChange={e=>setModel(e.target.value)} placeholder="เช่น Hikvision DS-2CD2143G2"/></div>
      </div>
      <div className="grid g-2" style={{gap:12,marginTop:12}}>
        <div className="field" style={{margin:0}}><label>IP Address *</label><input value={ip} onChange={e=>setIp(e.target.value)} placeholder="192.168.1.xxx" style={{fontFamily:"var(--f-mono)"}}/></div>
        <div className="field" style={{margin:0}}>
          <label>โปรโตคอล</label>
          <div className="flex gap-2">
            {["RTSP","ONVIF","HTTP"].map(p=>(
              <div key={p} onClick={()=>setProt(p)} style={{flex:1,border:`1px solid ${protocol===p?"var(--ink)":"var(--hair)"}`,background:protocol===p?"var(--ink)":"var(--paper)",color:protocol===p?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:11,cursor:"pointer",textAlign:"center",fontFamily:"var(--f-mono)"}}>{p}</div>
            ))}
          </div>
        </div>
      </div>
      <div className="field mt-3">
        <label>โซน</label>
        <div className="flex gap-2">
          {FARM_ZONES.map(z=>(
            <div key={z.id} onClick={()=>setZone(z.id)} style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>โซน {z.id}</div>
          ))}
        </div>
      </div>
      <div className="grid g-2" style={{gap:12,marginTop:12}}>
        <div className="field" style={{margin:0}}>
          <label>ความละเอียด</label>
          <select value={res} onChange={e=>setRes(e.target.value)} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
            {["2MP","4MP","8MP","12MP","640px"].map(r=><option key={r}>{r}</option>)}
          </select>
        </div>
        <div className="field" style={{margin:0}}>
          <label>Frame Rate (fps)</label>
          <select value={fps} onChange={e=>setFps(parseInt(e.target.value))} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
            {[9,15,20,25,30].map(f=><option key={f}>{f}</option>)}
          </select>
        </div>
      </div>
    </Modal>
  );
}

function AIAssistantPage() {
  const [messages, setMessages] = React.useState([
    {role:"assistant",text:"สวัสดีครับ! ผมคือ AI Farm Assistant ของ Kaimuk Smart Farm พร้อมช่วยตอบคำถามเกี่ยวกับฟาร์ม 🌿"},
  ]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const endRef = React.useRef(null);
  const suggested = ["โซนไหนต้องการน้ำบ้าง?","อุปกรณ์ไหน Offline?","ความเสี่ยงโรคพืชวันนี้?","เมื่อไหร่ควรเก็บเกี่ยว?","ทำไม Zone B อุณหภูมิสูง?","แสดง Critical Alerts ทั้งหมด"];
  const ANSWERS = {
    "โซนไหนต้องการน้ำ":"โซน C มีความชื้นดิน 22% ต่ำวิกฤต ต้องการรดน้ำทันที ส่วนโซน A อยู่ที่ 41% ใกล้ค่าเกณฑ์ แนะนำเฝ้าระวัง",
    "อุปกรณ์ไหน offline":"อุปกรณ์ที่ Offline: PMP-02 (ปั๊มสำรอง) และ Sensor PH-02 ที่ไม่ส่งข้อมูล 10 นาที ควรตรวจสอบสายสัญญาณ",
    "ความเสี่ยงโรคพืช":"โซน C มีความเสี่ยงสูง (58%) เนื่องจากความชื้นสะสม แนะนำฉีดสารป้องกัน Zone A-B ความเสี่ยงต่ำ (<20%)",
    "เมื่อไหร่ควรเก็บเกี่ยว":"Zone A (ผักสลัด) พร้อม 17 พ.ค. ประมาณ 380 กก. / Zone D พร้อม 30 พ.ค. / Melon B และ Tomato C รอถึงมิถุนายน",
    "critical alerts":"Critical Alerts ขณะนี้: 1) ถัง TK-03 เหลือ 15% (Zone C), 2) Soil Moisture 22% วิกฤต (Zone C), 3) อุณหภูมิ 37.2°C สูง (Zone B)",
  };
  function getAnswer(q) {
    const lq = q.toLowerCase();
    for (const [k,v] of Object.entries(ANSWERS)) {
      if (lq.includes(k.toLowerCase().replace("?",""))) return v;
    }
    return `ได้รับคำถาม: "${q}" — จากข้อมูลเซ็นเซอร์และอุปกรณ์: ฟาร์มทำงานปกติ 98.2% จุดที่ต้องเฝ้าระวังคือ Zone C (น้ำต่ำ) และโรงเรือน B (อุณหภูมิสูง) ครับ`;
  }
  function send(q) {
    if (!q.trim()) return;
    setMessages(prev => [...prev, {role:"user",text:q}]);
    setInput(""); setLoading(true);
    setTimeout(() => { setMessages(prev => [...prev, {role:"assistant",text:getAnswer(q)}]); setLoading(false); }, 800 + Math.random()*600);
  }
  React.useEffect(() => { endRef.current?.scrollIntoView({behavior:"smooth"}); }, [messages]);
  return (
    <>
      <div className="page-head">
        <div>
          <div className="muted small uc">AI Farm Assistant · Conversational AI</div>
          <h1>AI Farm Assistant</h1>
          <div className="meta mt-2">ถามคำถามเกี่ยวกับฟาร์ม เซ็นเซอร์ อุปกรณ์ และ AI Recommendations</div>
        </div>
        <div className="spacer"/>
        <div className="actions">
          <button className="btn" onClick={()=>setMessages([{role:"assistant",text:"สวัสดีครับ! พร้อมช่วยเหลือครับ 🌿"}])}><I.Refresh size={14}/> ล้างประวัติ</button>
        </div>
      </div>
      <div className="grid g-1-2" style={{gap:20,alignItems:"start"}}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="card">
            <div className="card-h"><div className="card-title">คำถามแนะนำ</div></div>
            {suggested.map((q,i)=>(
              <div key={i} onClick={()=>send(q)} style={{padding:"10px 12px",borderRadius:8,border:"1px solid var(--hair-2)",cursor:"pointer",fontSize:13,marginBottom:8,display:"flex",alignItems:"center",gap:10}} onMouseEnter={e=>e.currentTarget.style.background="var(--cream)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <I.AI size={14} stroke="var(--sage-2)"/><span>{q}</span>
              </div>
            ))}
          </div>
          <div className="card" style={{background:"var(--cream)"}}>
            <div className="tiny mono uc muted mb-3">AI Context</div>
            {[{l:"Sensors Online",v:"248"},{l:"Devices Active",v:"5/6"},{l:"Alerts ใหม่",v:"3"},{l:"Rules Active",v:"5"},{l:"Model",v:"AI Farm v3.2"}].map(x=>(
              <div key={x.l} className="flex-cb small" style={{padding:"5px 0"}}><span className="muted">{x.l}</span><span className="mono">{x.v}</span></div>
            ))}
          </div>
        </div>
        <div className="card" style={{padding:0,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          <div style={{flex:1,overflowY:"auto",padding:"18px",maxHeight:480,minHeight:340,display:"flex",flexDirection:"column",gap:12}}>
            {messages.map((m,i)=>(
              <div key={i} style={{display:"flex",gap:10,justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                {m.role==="assistant"&&<div style={{width:32,height:32,borderRadius:8,background:"var(--ink)",color:"white",display:"grid",placeItems:"center",flexShrink:0,marginTop:2}}><I.AI size={15} stroke="white"/></div>}
                <div style={{maxWidth:"80%",padding:"10px 14px",borderRadius:m.role==="user"?"12px 12px 4px 12px":"12px 12px 12px 4px",background:m.role==="user"?"var(--ink)":"var(--cream)",color:m.role==="user"?"white":"var(--ink)",fontSize:13,lineHeight:1.55}}>{m.text}</div>
                {m.role==="user"&&<div style={{width:32,height:32,borderRadius:8,background:"var(--sage)",color:"white",display:"grid",placeItems:"center",flexShrink:0,marginTop:2,fontFamily:"var(--f-serif)",fontSize:13}}>ฉ</div>}
              </div>
            ))}
            {loading&&<div style={{display:"flex",gap:10}}><div style={{width:32,height:32,borderRadius:8,background:"var(--ink)",color:"white",display:"grid",placeItems:"center",flexShrink:0}}><I.AI size={15} stroke="white"/></div><div style={{padding:"12px 16px",borderRadius:"12px 12px 12px 4px",background:"var(--cream)",display:"flex",gap:5,alignItems:"center"}}>{[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:999,background:"var(--muted-2)",animation:`bounce ${0.6}s ease ${i*0.15}s infinite alternate`}}/>)}</div></div>}

        </div>
      </div>
    </>
  );
}

function NotificationsPage() {
  const [filter, setFilter] = React.useState("all");
  const [activeTab, setActiveTab] = React.useState("alerts");
  const demo = !window.sb();
  const user = window._currentUser || {};

  const { data: dbAlerts, loading, refetch } = useSB(
    () => window.sbAlerts.getAll(100), []
  );
  const alerts = dbAlerts || window.DEMO.alerts;

  // Real-time new alerts
  React.useEffect(() => {
    if (demo) return;
    const sub = window.sbRT.subscribeAlerts(newAlert => {
      pushToast(`🔔 ${newAlert.title}`, newAlert.severity==="danger"||newAlert.severity==="critical"?"danger":"success");
      refetch();
    });
    return () => { try { sub && sub.unsubscribe(); } catch(e) {} };
  }, [demo]);

  const filtered = filter==="all" ? alerts
    : filter==="unread" ? alerts.filter(a=>!a.is_read)
    : alerts.filter(a=>(a.severity||a.sev)===filter);

  const unread = alerts.filter(a=>!a.is_read).length;
  const sevTone = {critical:"danger",danger:"danger",warning:"warn",info:"info"};

  function markRead(id) {
    if (demo) return;
    window.sbAlerts.markRead(id, user.id).then(() => refetch());
  }
  function markAllRead() {
    if (demo) { pushToast("Demo mode","warn"); return; }
    window.sbAlerts.markAllRead(user.id).then(() => { refetch(); pushToast("อ่านทั้งหมดแล้ว","success"); });
  }

  return (
    <>
      <div className="page-head">
        <div>
          <div className="muted small uc">Notification Center · {demo?"Demo":"Supabase Realtime"}</div>
          <h1>Notifications</h1>
          <div className="meta mt-2">{unread} ยังไม่อ่าน · {alerts.length} รายการทั้งหมด</div>
        </div>
        <div className="spacer"/>
        <div className="actions">
          <button className="btn" onClick={refetch} disabled={loading}><I.Refresh size={14}/></button>
          <button className="btn" onClick={markAllRead}><I.Check size={14}/> อ่านทั้งหมด</button>
          <button className="btn primary" onClick={()=>{
            if(demo){pushToast("Demo","warn");return;}
            window.sbAlerts.insert({severity:"info",title:"ทดสอบการแจ้งเตือน",message:"Alert ทดสอบจากระบบ",farm_name:"Kaimuk Farm"}).then(()=>{refetch();pushToast("ส่งแจ้งเตือนทดสอบแล้ว","success");});
          }}><I.Bell size={14}/> ทดสอบการแจ้งเตือน</button>
        </div>
      </div>

      {/* Summary KPIs */}
      <div className="grid g-4 mb-4">
        {[
          {l:"ทั้งหมด",     v:alerts.length,                                     f:"all"},
          {l:"ยังไม่อ่าน", v:unread,                                            f:"unread"},
          {l:"Critical",   v:alerts.filter(a=>["critical","danger"].includes(a.severity||a.sev)).length, f:"critical"},
          {l:"Warning",    v:alerts.filter(a=>(a.severity||a.sev)==="warning").length, f:"warning"},
        ].map(k=>(
          <div key={k.l} className="kpi" style={{cursor:"pointer",borderTop:`3px solid ${filter===k.f?"var(--ink)":"transparent"}`,transition:"all 0.15s"}} onClick={()=>setFilter(k.f)}>
            <div className="kpi-label">{k.l}</div>
            <div className="kpi-value">{k.v}</div>
          </div>
        ))}
      </div>

      {/* Tab Nav */}
      <div style={{display:"flex",gap:4,marginBottom:20,borderBottom:"1px solid var(--hair-2)"}}>
        {[{v:"alerts",l:"การแจ้งเตือน"},{v:"channels",l:"ช่องทาง"},{v:"history",l:"ประวัติ"}].map(t=>(
          <button key={t.v} onClick={()=>setActiveTab(t.v)}
            style={{padding:"9px 16px",border:"none",borderBottom:`2px solid ${activeTab===t.v?"var(--ink)":"transparent"}`,background:"transparent",color:activeTab===t.v?"var(--ink)":"var(--muted)",fontSize:13,cursor:"pointer",fontFamily:"var(--f-sans)",transition:"all 0.15s",marginBottom:-1}}>
            {t.l}
          </button>
        ))}
      </div>

      {activeTab === "alerts" && (
        <>
          {!demo && (
            <div className="success-banner mb-3" style={{background:"var(--sage-soft)",border:"1px solid var(--sage)",borderRadius:10,padding:"10px 16px",display:"flex",alignItems:"center",gap:10,fontSize:13,marginBottom:12}}>
              <I.Check size={15} stroke="var(--sage-2)"/>
              <span>● Real-time · รับการแจ้งเตือนใหม่อัตโนมัติผ่าน Supabase Realtime</span>
            </div>
          )}
          <div className="flex-c gap-2 mb-3" style={{flexWrap:"wrap"}}>
            {["all","unread","critical","warning","info"].map(f=>(
              <div key={f} onClick={()=>setFilter(f)} className={cx("chip",filter===f?"sage":"")} style={{cursor:"pointer",textTransform:"capitalize"}}>

      {activeTab === "channels" && (

                    <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
                      {[{l:"🌡",v:`${d.temp}°C`},{l:"💧",v:`${d.hum}%`},{l:"🌱",v:`${d.soil}%`}].map(x=>(
                        <div key={x.l} style={{fontFamily:"var(--f-mono)",fontSize:11,display:"flex",justifyContent:"space-between",color:"rgba(0,0,0,0.6)"}}><span>{x.l}</span><span>{x.v}</span></div>
                      ))}
                    </div>
                    {d.alerts>0&&<div style={{position:"absolute",top:8,right:8,width:20,height:20,borderRadius:999,background:"var(--danger)",color:"white",fontSize:10,display:"grid",placeItems:"center",fontFamily:"var(--f-mono)"}}>{d.alerts}</div>}
                    {d.status==="sage"&&<div style={{position:"absolute",bottom:10,right:10,width:8,height:8,borderRadius:999,background:cols[d.status],boxShadow:`0 0 0 4px rgba(34,197,94,0.3)`}}/>}
                  </div>
                );
              })}
            </div>
            <div style={{position:"absolute",bottom:16,left:24,right:24,height:3,background:"rgba(34,197,94,0.3)",borderRadius:2,overflow:"hidden"}}>
              <div style={{width:"60%",height:"100%",background:"var(--sage-2)",borderRadius:2,animation:"flow 2s linear infinite"}}/>
            </div>
            <style>{`@keyframes flow{from{transform:translateX(-100%)}to{transform:translateX(200%)}}`}</style>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {selZone ? (
            <div className="card">
              <div className="card-h">
                <div><div className="card-title">Zone {selZone} — {zData[selZone].crop}</div><div className="card-sub">REAL-TIME</div></div>
                <span className={cx("chip",zData[selZone].status)} style={{display:"inline-flex",alignItems:"center",gap:6}}><span className="ddot"/>{zData[selZone].status}</span>
              </div>
              <div className="grid g-2" style={{gap:10}}>
                {[{l:"Temperature",v:`${zData[selZone].temp}°C`},{l:"Humidity",v:`${zData[selZone].hum}%`},{l:"Soil Moisture",v:`${zData[selZone].soil}%`},{l:"Alerts",v:zData[selZone].alerts||"ไม่มี"}].map(x=>(
                  <div key={x.l} style={{background:"var(--cream)",padding:"10px 12px",borderRadius:8}}>
                    <div className="tiny mono uc muted">{x.l}</div>
                    <div className="mono" style={{fontSize:18,marginTop:4}}>{x.v}</div>
                  </div>
                ))}
              </div>
              <Sparkline data={series(`twin${selZone}`,24,20,80)} h={50}/>
              <div className="flex gap-2 mt-3">
                <button className="btn" style={{flex:1,justifyContent:"center",fontSize:12}} onClick={()=>pushToast("เปิดระบบน้ำ","success")}><I.Wave size={12}/> รดน้ำ</button>
                <button className="btn" style={{flex:1,justifyContent:"center",fontSize:12}} onClick={()=>pushToast("ดูรายละเอียด","success")}><I.Eye size={12}/> ดูเพิ่ม</button>
              </div>
            </div>
          ) : (
            <div className="card" style={{textAlign:"center",padding:"32px"}}>
              <I.Cube size={32} stroke="var(--muted-2)"/>
              <div className="serif mt-3" style={{fontSize:16}}>คลิก Zone เพื่อดูข้อมูล</div>
              <div className="small muted mt-2">เลือก Zone บนผัง Digital Twin</div>
            </div>
          )}
          <div className="card">
            <div className="card-h"><div className="card-title">AI Hotspot Areas</div></div>
            {[{zone:"C",issue:"ดินแห้ง — ชลประทานเร่งด่วน",tone:"danger"},{zone:"B",issue:"อุณหภูมิสูง — เปิดพัดลม",tone:"warn"}].map((h,i)=>(
              <div key={i} className="flex-c gap-3" style={{padding:"10px 0",borderBottom:i<1?"1px solid var(--hair-2)":"none"}}>
                <div style={{width:32,height:32,borderRadius:8,background:`var(--${h.tone}-soft)`,color:`var(--${h.tone})`,display:"grid",placeItems:"center",flexShrink:0}}><I.Alert size={14}/></div>
                <div className="small ink2">Zone {h.zone} — {h.issue}</div>
              </div>
            ))}
          </div>
          <div className="card">
            <div className="card-h"><div className="card-title">Device Status</div></div>
            {DEVICES.slice(0,4).map((d,i)=>{
              const Ico = I[d.icon]||I.Device;
              return (
                <div key={d.id} className="flex-cb" style={{padding:"8px 0",borderBottom:i<3?"1px solid var(--hair-2)":"none"}}>
                  <div className="flex-c gap-2"><Ico size={14}/><span className="small">{d.name}</span></div>
                  <span className={cx("chip",d.on?"sage":"")} style={{display:"inline-flex",alignItems:"center",gap:6}}><span className="ddot"/>{d.on?"ON":"OFF"}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </>
  );
}

Object.assign(window, {
  CommandCenterPage, ExecutiveDashboardPage, AutomationPage, VisionAnalyticsPage,
  PredictiveAIPage, AIAssistantPage, DroneIntelligencePage, WaterManagementPage,
  EnergyManagementPage, ProductionPage, InventoryPage, MaintenancePage,
  NotificationsPage, DigitalTwinPage,
  DRONE_MISSIONS, WATER_TANKS, ENERGY_DATA, CROPS, INVENTORY, MAINTENANCE,
  NOTIFICATIONS_DATA, AUTOMATION_RULES,
});

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
