<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SmartFarm · Kaimuk Monitoring Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Serif+Thai:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
/* SmartFarm — Japanese minimal design tokens */
:root {
  /* surfaces */
  --cream: #F4F1EA;
  --cream-2: #EEEAE0;
  --paper: #FBFAF7;
  --paper-2: #FFFFFF;

  /* ink */
  --ink: #1F1E1B;
  --ink-2: #3A3934;
  --muted: #76746C;
  --muted-2: #9C9A91;
  --hair: #DBD6CB;
  --hair-2: #E8E4D9;

  /* sage primary */
  --sage: oklch(0.72 0.045 145);
  --sage-2: oklch(0.62 0.06 145);
  --sage-soft: oklch(0.92 0.025 145);

  /* alert tones (subtle, never saturated) */
  --warn: oklch(0.74 0.09 70);
  --warn-soft: oklch(0.94 0.04 70);
  --danger: oklch(0.62 0.13 25);
  --danger-soft: oklch(0.94 0.04 25);
  --info: oklch(0.7 0.05 240);
  --info-soft: oklch(0.94 0.025 240);

  /* type */
  --f-sans: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, sans-serif;
  --f-serif: "IBM Plex Serif Thai", "IBM Plex Serif", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--f-sans);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* layout shell */
.app {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: var(--paper);
  border-right: 1px solid var(--hair);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}
.sidebar-header {
  flex-shrink: 0;
  padding: 22px 18px 0;
}
.sidebar-menu {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 18px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--hair) transparent;
}
.sidebar-menu::-webkit-scrollbar { width: 4px; }
.sidebar-menu::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }
.sidebar-footer {
  flex-shrink: 0;
  padding: 0 18px 18px;
  border-top: 1px solid var(--hair-2);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0 18px;
  border-bottom: 1px solid var(--hair-2);
  margin-bottom: 14px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--sage);
  display: grid; place-items: center;
  color: var(--paper);
}
.brand-name {
  font-family: var(--f-serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: -2px;
}

.nav-group-label {
  font-size: 10px;
  color: var(--muted-2);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 14px 8px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
  transition: background 120ms ease, color 120ms ease;
  position: relative;
  user-select: none;
}
.nav-item:hover { background: var(--cream); }
.nav-item.active {
  background: var(--ink);
  color: var(--paper);
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.15); color: var(--paper); }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
.nav-label { flex: 1; }
.nav-badge {
  font-family: var(--f-mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--cream-2);
  color: var(--muted);
}

/* topbar */
.topbar {
  height: 60px;
  background: var(--paper);
  border-bottom: 1px solid var(--hair);
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.crumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
}
.crumb .sep { color: var(--muted-2); }
.crumb .cur { color: var(--ink); }
.topbar-spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--cream);
  border: 1px solid var(--hair-2);
  border-radius: 8px;
  padding: 6px 10px;
  width: 260px;
  color: var(--muted);
  font-size: 12px;
}
.search input {
  border: none; background: transparent; outline: none;
  font-family: var(--f-sans); font-size: 12px; color: var(--ink);
  width: 100%;
}
.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 8px;
  border: 1px solid var(--hair-2);
  background: var(--paper);
  cursor: pointer;
  color: var(--ink-2);
  position: relative;
}
.icon-btn:hover { background: var(--cream); }
.icon-btn .dot {
  position: absolute; top: 7px; right: 7px;
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--danger);
}
.avatar {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  border: 1px solid var(--hair-2);
  cursor: pointer;
}
.avatar-img {
  width: 28px; height: 28px; border-radius: 999px;
  background: var(--sage-soft);
  display: grid; place-items: center;
  font-family: var(--f-serif);
  font-weight: 500;
  color: var(--sage-2);
  font-size: 12px;
}
.avatar-name { font-size: 12px; color: var(--ink); }
.avatar-role { font-size: 10px; color: var(--muted); }

/* main */
.main { padding: 24px 28px 64px; }
.page-head {
  display: flex; align-items: flex-end; gap: 20px;
  padding-bottom: 18px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--hair-2);
}
.page-head h1 {
  font-family: var(--f-serif);
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.015em;
  margin: 0 0 4px;
  line-height: 1.1;
}
.page-head .meta {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--f-mono);
}
.page-head .spacer { flex: 1; }
.page-head .actions { display: flex; gap: 8px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 12px;
  cursor: pointer;
  transition: background 120ms;
}
.btn:hover { background: var(--cream); }
.btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn.primary:hover { background: var(--ink-2); }
.btn.sage {
  background: var(--sage);
  color: var(--paper);
  border-color: var(--sage);
}
.btn.sage:hover { background: var(--sage-2); }
.btn.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
}
.btn.danger {
  background: var(--danger);
  color: var(--paper);
  border-color: var(--danger);
}

/* cards */
.card {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 12px;
  padding: 18px;
}
.card-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-family: var(--f-serif);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.card-sub {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--f-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* KPI */
.kpi {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  overflow: hidden;
}
.kpi-row { display: flex; align-items: center; justify-content: space-between; }
.kpi-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.kpi-icon {
  width: 26px; height: 26px;
  border-radius: 6px;
  background: var(--sage-soft);
  color: var(--sage-2);
  display: grid; place-items: center;
}
.kpi-value {
  font-family: var(--f-mono);
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.1;
}
.kpi-unit { font-size: 13px; color: var(--muted); margin-left: 4px; }
.kpi-delta {
  font-size: 11px;
  font-family: var(--f-mono);
  display: inline-flex; align-items: center; gap: 4px;
}
.kpi-delta.up { color: var(--sage-2); }
.kpi-delta.down { color: var(--danger); }
.kpi-spark { margin-top: 4px; height: 36px; }

/* tag/chip */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--f-mono);
  background: var(--cream);
  border: 1px solid var(--hair-2);
  color: var(--ink-2);
}
.chip.sage { background: var(--sage-soft); border-color: transparent; color: var(--sage-2); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.chip .ddot {
  width: 6px; height: 6px; border-radius: 999px; background: currentColor;
}

/* table */
.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
.tbl th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--hair-2);
  background: transparent;
}
.tbl td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--hair-2);
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--cream); }
.tbl .mono { font-family: var(--f-mono); }

/* segmented */
.seg {
  display: inline-flex;
  padding: 3px;
  background: var(--cream);
  border-radius: 8px;
  border: 1px solid var(--hair-2);
}
.seg button {
  border: none;
  background: transparent;
  padding: 5px 12px;
  font-family: var(--f-sans);
  font-size: 12px;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
}
.seg button.on {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* toggle */
.toggle {
  width: 38px; height: 22px;
  background: var(--hair);
  border-radius: 999px;
  position: relative;
  cursor: pointer;
  transition: background 160ms ease;
  flex-shrink: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--paper);
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  transition: left 180ms ease;
}
.toggle.on { background: var(--sage); }
.toggle.on::after { left: 18px; }

/* grids */
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }
.g-8 { grid-template-columns: repeat(8, minmax(0,1fr)); }

/* progress bar */
.bar {
  height: 4px;
  background: var(--hair-2);
  border-radius: 999px;
  overflow: hidden;
}
.bar > span {
  display: block;
  height: 100%;
  background: var(--sage);
  border-radius: inherit;
}

/* alerts */
.alert-row {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--hair-2);
  align-items: center;
}
.alert-row:last-child { border-bottom: none; }
.alert-dot {
  width: 8px; height: 8px; border-radius: 999px;
  background: var(--muted-2);
}
.alert-dot.danger { background: var(--danger); }
.alert-dot.warn { background: var(--warn); }
.alert-dot.info { background: var(--info); }
.alert-title { font-size: 13px; color: var(--ink); }
.alert-meta { font-size: 11px; color: var(--muted); font-family: var(--f-mono); margin-top: 2px; }
.alert-time { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }

/* divider */
.hr { height: 1px; background: var(--hair-2); margin: 16px 0; }
.vhr { width: 1px; background: var(--hair-2); align-self: stretch; }

/* utilities */
.mono { font-family: var(--f-mono); }
.serif { font-family: var(--f-serif); }
.muted { color: var(--muted); }
.muted2 { color: var(--muted-2); }
.ink2 { color: var(--ink-2); }
.tiny { font-size: 11px; }
.small { font-size: 12px; }
.large { font-size: 16px; }
.bold { font-weight: 500; }
.uc { text-transform: uppercase; letter-spacing: 0.1em; }
.right { text-align: right; }
.center { text-align: center; }
.flex { display: flex; }
.flex-c { display: flex; align-items: center; }
.flex-cb { display: flex; align-items: center; justify-content: space-between; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.w-full { width: 100%; }

/* login */
.login-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 460px;
  background: var(--cream);
}
.login-art {
  position: relative;
  background:
    radial-gradient(900px 600px at 30% 30%, oklch(0.93 0.04 145) 0%, transparent 60%),
    radial-gradient(700px 500px at 80% 80%, oklch(0.95 0.03 70) 0%, transparent 60%),
    var(--cream);
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--hair);
  overflow: hidden;
}
.login-form-wrap {
  background: var(--paper);
  display: grid;
  place-items: center;
  padding: 40px;
}

/* form */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.field input, .field select, .field textarea {
  font-family: var(--f-sans);
  font-size: 14px;
  padding: 11px 12px;
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 8px;
  color: var(--ink);
  outline: none;
  transition: border 120ms ease, background 120ms ease;
}
.field input:focus { border-color: var(--sage-2); background: var(--paper-2); }

/* charts svg defaults */
.spark path, .chart path { fill: none; }
.grid-line { stroke: var(--hair-2); stroke-width: 1; stroke-dasharray: 2 4; }

/* sensor card */
.sensor-card {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sensor-h { display: flex; align-items: center; justify-content: space-between; }
.sensor-name { font-size: 13px; color: var(--ink-2); }
.sensor-id { font-size: 10px; color: var(--muted-2); font-family: var(--f-mono); }
.sensor-val {
  font-family: var(--f-mono);
  font-size: 34px;
  font-weight: 300;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1;
}
.sensor-val .u { font-size: 14px; color: var(--muted); margin-left: 4px; }
.sensor-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--f-mono); }

/* device card */
.device-card {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.device-card.on { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
.device-state {
  font-family: var(--f-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* heatmap dot */
.pin {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 26px; height: 26px;
  border-radius: 999px;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  display: grid; place-items: center;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--ink);
  cursor: pointer;
}
.pin.sage { background: var(--sage); color: var(--paper); border-color: var(--sage-2); }
.pin.warn { background: var(--warn); color: var(--paper); border-color: var(--warn); }
.pin.danger { background: var(--danger); color: var(--paper); border-color: var(--danger); }

/* scroll bar subtle */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 8px; border: 2px solid var(--cream); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(31,30,27,0.45);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: grid; place-items: center;
  animation: fade-in 120ms ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 16px;
  padding: 28px;
  width: 480px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.18);
  animation: slide-up 160ms ease;
}
.modal.wide { width: 640px; }
@keyframes slide-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 22px;
}
.modal-title {
  font-family: var(--f-serif);
  font-size: 20px; font-weight: 500;
  letter-spacing: -0.01em;
}
.modal-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--f-mono); }
.modal-close {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--hair-2);
  background: transparent; cursor: pointer; color: var(--muted);
  flex-shrink: 0; margin-left: 12px;
}
.modal-close:hover { background: var(--cream); }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 24px; padding-top: 18px;
  border-top: 1px solid var(--hair-2);
}

/* toast notification */
.toast-wrap {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 2000; display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  animation: slide-up 180ms ease;
  max-width: 340px;
}
.toast.success { background: var(--sage-2); }
.toast.danger { background: var(--danger); }
.toast.warn { background: var(--warn); color: var(--ink); }

/* confirm dialog */
.confirm-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: grid; place-items: center;
  margin-bottom: 16px;
}
.confirm-icon.danger { background: var(--danger-soft); color: var(--danger); }
.confirm-icon.warn { background: var(--warn-soft); color: var(--warn); }

/* responsive small */
@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }

/* Mobile Drawer */
.mobile-overlay {
  position: fixed; inset: 0; background: rgba(31,30,27,0.5);
  z-index: 900; display: none;
  animation: fade-in 200ms ease;
}
.mobile-overlay.open { display: block; }
.mobile-drawer {
  position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
  background: var(--paper); border-right: 1px solid var(--hair);
  z-index: 901; display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
.mobile-drawer.open { transform: translateX(0); }
.hamburger {
  display: none;
  flex-direction: column; justify-content: center; align-items: center;
  gap: 4.5px; width: 34px; height: 34px;
  cursor: pointer; padding: 6px; border-radius: 8px;
  border: 1px solid var(--hair-2); background: var(--paper);
}
.hamburger span {
  display: block; width: 16px; height: 1.5px;
  background: var(--ink); border-radius: 2px;
  transition: all 180ms ease;
}
@media (max-width: 720px) { .hamburger { display: flex; } }

/* CCTV page styles */
.cctv-grid { display: grid; gap: 3px; background: #0a0f0a; }
.cctv-grid.layout-1 { grid-template-columns: 1fr; }
.cctv-grid.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.cctv-grid.layout-9 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.cctv-cell {
  position: relative; background: #0d160d; overflow: hidden;
  cursor: pointer; min-height: 180px;
}
.cctv-cell.selected { outline: 2px solid var(--sage); outline-offset: -2px; z-index: 2; }
.cctv-noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; opacity: 0.6;
}
.cctv-overlay {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);
}
.cctv-badge {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px; padding: 4px 8px;
  font-family: var(--f-mono); font-size: 10px;
  color: rgba(255,255,255,0.85); display: flex; align-items: center; gap: 6px;
  backdrop-filter: blur(4px);
}
.cctv-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #ff3333;
  animation: blink 1s ease-in-out infinite;
}
.cctv-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 12px;
  font-family: var(--f-mono); font-size: 10px; color: rgba(255,255,255,0.7);
  display: flex; align-items: center; justify-content: space-between;
}
.cctv-time {
  position: absolute; top: 10px; right: 10px;
  font-family: var(--f-mono); font-size: 10px; color: rgba(255,255,255,0.6);
}
.playback-timeline {
  position: relative; height: 48px; background: #111;
  border-radius: 6px; overflow: hidden; cursor: pointer;
}
.playback-track {
  position: absolute; top: 50%; transform: translateY(-50%);
  left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.1);
  border-radius: 2px;
}
.playback-filled {
  position: absolute; left: 0; height: 100%;
  background: var(--sage-2); border-radius: 2px;
  transition: width 0.5s linear;
}
.playback-head {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--sage-2);
  box-shadow: 0 0 8px rgba(0,0,0,0.5);
  transition: left 0.5s linear;
}
.playback-event {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 3px; height: 16px; border-radius: 2px;
}
.cctv-canvas-bg {
  width: 100%; height: 100%;
  image-rendering: pixelated;
}
/* Scan line effect on cameras */
.cctv-scanlines::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* Loading skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--hair-2) 25%, var(--cream-2) 50%, var(--hair-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Button disabled state */
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn:disabled:hover { background: var(--paper); }
.btn.primary:disabled:hover { background: var(--ink); }

/* Global search results */
.search-results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: var(--paper); border: 1px solid var(--hair);
  border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  z-index: 600; max-height: 360px; overflow-y: auto;
}
.search-result-item {
  display: flex; align-items: center; gap: 10px;

}
.search-result-item:hover { background: var(--cream); }
.search-result-item + .search-result-item { border-top: 1px solid var(--hair-2); }
/* pin-mode banner */
.pin-mode-banner {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; font-family: var(--f-mono); font-size: 12px;
  animation: slide-up 160ms ease;
}
.pin-mode-banner .pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #44ff88;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.pin-cursor * { cursor: crosshair !important; }
.map-pin-marker {
  position: absolute; transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10;
}
.map-pin-marker .ph {
  width: 22px; height: 22px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35); transition: transform 0.15s;
}
.map-pin-marker:hover .ph { transform: rotate(-45deg) scale(1.2); }
.map-pin-marker .pl {
  background: var(--ink); color: var(--paper);
  font-family: var(--f-mono); font-size: 9px; padding: 2px 6px;
  border-radius: 4px; margin-top: 3px; white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

  // Shimmed for non-React context; actual hook is below as sbHook
  // This is a placeholder — real hook defined in React script
}

// ── PROFILES ─────────────────────────────────────────────────────────
window.sbProfiles = {
  getAll: () => sb() && sb().from('profiles').select('*').order('created_at', { ascending: false }),
  getOne: (id) => sb() && sb().from('profiles').select('*').eq('id', id).single(),
  update: (id, data) => sb() && sb().from('profiles').update({...data, updated_at: new Date().toISOString()}).eq('id', id),
  updateLastSeen: (id) => sb() && sb().from('profiles').update({last_seen: new Date().toISOString()}).eq('id', id),
};

// ── FARM ZONES ───────────────────────────────────────────────────────
window.sbZones = {
  getAll: () => sb() && sb().from('farm_zones').select('*').order('id'),
  update: (id, data) => sb() && sb().from('farm_zones').update(data).eq('id', id),
};

// ── SENSORS ──────────────────────────────────────────────────────────
window.sbSensors = {
  getAll: () => sb() && sb().from('sensors').select('*, farm_zones(name)').order('id'),
  getLatest: () => sb() && sb().from('sensor_latest').select('*'),
  insert: (data) => sb() && sb().from('sensors').insert(data).select().single(),
  update: (id, data) => sb() && sb().from('sensors').update({...data, updated_at: new Date().toISOString()}).eq('id', id),
  delete: (id) => sb() && sb().from('sensors').delete().eq('id', id),
  getReadings: (sensorId, hours = 24) => {
    const since = new Date(Date.now() - hours * 3600000).toISOString();
    return sb() && sb().from('sensor_readings')
      .select('value, recorded_at')
      .eq('sensor_id', sensorId)
      .gte('recorded_at', since)
      .order('recorded_at', { ascending: true })
      .limit(100);
  },
  insertReading: (sensorId, value) => sb() && sb().from('sensor_readings').insert({ sensor_id: sensorId, value }),
};

// ── DEVICES ──────────────────────────────────────────────────────────
window.sbDevices = {
  getAll: () => sb() && sb().from('devices').select('*, farm_zones(name)').order('id'),
  toggle: (id, newState, userId) => {
    if (!sb()) return Promise.reject('No Supabase');
    const now = new Date().toISOString();
    return sb().from('devices')
      .update({ is_on: newState, last_toggled_at: now, last_toggled_by: userId, updated_at: now })
      .eq('id', id)
      .then(res => {
        if (!res.error) {
          // Log the action
          sb().from('device_logs').insert({
            device_id: id,
            action: newState ? 'ON' : 'OFF',
            triggered_by: userId,
          });
        }
        return res;
      });
  },
  emergencyStop: (userId) => {
    if (!sb()) return Promise.reject('No Supabase');
    const now = new Date().toISOString();
    return sb().from('devices')
      .update({ is_on: false, updated_at: now })
      .neq('id', '___')  // update all
      .then(res => {
        if (!res.error) {
          sb().from('device_logs').insert({
            device_id: null, action: 'EMERGENCY_STOP', triggered_by: userId,
            note: 'Emergency stop all devices'
          });
        }
        return res;
      });
  },
  insert: (data) => sb() && sb().from('devices').insert(data).select().single(),
  update: (id, data) => sb() && sb().from('devices').update({...data, updated_at: new Date().toISOString()}).eq('id', id),

    .order('logged_at', { ascending: false })
    .limit(limit),
};

};

// ── REALTIME SUBSCRIPTIONS ───────────────────────────────────────────
window.sbRT = {

    if (!sb()) return;
    const sub = sb().channel('alerts-rt')

        callback && callback(payload.new);
      })
      .subscribe();
    window.sbRT._subs.push(sub);
    return sub;
  },
  unsubscribeAll: () => {
    window.sbRT._subs.forEach(sub => { try { sub.unsubscribe(); } catch(e) {} });
    window.sbRT._subs = [];

  const hours = Math.floor(mins / 60);

  const days = Math.floor(hours / 24);
  return days + ' วันที่แล้ว';
};

// ---------- helpers ----------
const cx = (...c) => c.filter(Boolean).join(" ");
const rnd = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }; };

// generate smooth sparkline series
function series(seed, n = 36, min = 20, max = 80, drift = 0) {
  const r = rnd(seed);
  const out = [];
  let v = (min + max) / 2;
  for (let i = 0; i < n; i++) {
    v += (r() - 0.5) * (max - min) * 0.12 + drift;
    v = Math.max(min, Math.min(max, v));
    out.push(v);
  }
  return out;
}

// build SVG path from points
function linePath(data, w, h, padY = 4) {
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const step = w / (data.length - 1);
  return data.map((v, i) => {
    const x = i * step;
    const y = padY + (h - padY * 2) * (1 - (v - min) / rng);
    return `${i === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(" ");
}

function areaPath(data, w, h, padY = 4) {
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => {
    const x = i * step;
    const y = padY + (h - padY * 2) * (1 - (v - min) / rng);
    return `${x.toFixed(2)} ${y.toFixed(2)}`;
  });
  return `M${pts[0]} L${pts.slice(1).join(" L")} L${w} ${h} L0 ${h} Z`;
}

// ---------- COMPONENTS ----------

function Sparkline({ data, w = 220, h = 40, color = "var(--sage-2)", fill = "var(--sage-soft)" }) {
  return (
    <svg className="spark" width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <path d={areaPath(data, w, h)} fill={fill} opacity="0.6" />
      <path d={linePath(data, w, h)} stroke={color} strokeWidth="1.5" />
    </svg>
  );
}

function Chart({ data, w = 600, h = 220, color = "var(--sage-2)", fill = "var(--sage-soft)", yLabel, xLabels, showGrid = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const padL = 40, padR = 10, padT = 14, padB = 24;
  const cw = w - padL - padR;
  const ch = h - padT - padB;
  const linePts = data.map((v, i) => {
    const x = padL + (i * cw) / (data.length - 1);
    const y = padT + ch * (1 - (v - min) / (max - min || 1));
    return [x, y];
  });
  const linePath = "M" + linePts.map(p => p.map(n => n.toFixed(1)).join(" ")).join(" L");
  const areaPath = linePath + ` L ${(padL + cw).toFixed(1)} ${(padT + ch).toFixed(1)} L ${padL.toFixed(1)} ${(padT + ch).toFixed(1)} Z`;
  const yTicks = 4;

  return (
    <svg className="chart" width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {showGrid && Array.from({ length: yTicks + 1 }).map((_, i) => {
        const y = padT + (ch * i) / yTicks;
        const val = max - ((max - min) * i) / yTicks;
        return (
          <g key={i}>
            <line x1={padL} y1={y} x2={padL + cw} y2={y} className="grid-line" />
            <text x={padL - 6} y={y + 3} textAnchor="end" fontSize="9" fontFamily="var(--f-mono)" fill="var(--muted)">{val.toFixed(0)}</text>
          </g>
        );
      })}
      {xLabels && xLabels.map((lab, i) => {
        const x = padL + (i * cw) / (xLabels.length - 1);
        return <text key={i} x={x} y={h - 8} textAnchor="middle" fontSize="9" fontFamily="var(--f-mono)" fill="var(--muted)">{lab}</text>;
      })}
      <path d={areaPath} fill={fill} opacity="0.5" />
      <path d={linePath} stroke={color} strokeWidth="1.5" fill="none" />
      {linePts.map((p, i) => i % 6 === 0 && <circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill="var(--paper)" stroke={color} strokeWidth="1.2" />)}
    </svg>
  );
}

function Donut({ value, max = 100, size = 80, color = "var(--sage)", track = "var(--hair-2)" }) {
  const r = size / 2 - 6;
  const c = 2 * Math.PI * r;
  const off = c * (1 - value / max);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth="6" fill="none" />
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth="6" fill="none"
              strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
              transform={`rotate(-90 ${size/2} ${size/2})`} />
      <text x={size/2} y={size/2 + 4} textAnchor="middle" fontFamily="var(--f-mono)" fontSize="16" fill="var(--ink)">{value}</text>
    </svg>

// ========== MODAL + TOAST SYSTEM ==========

// Global state via window (cross-script)
window._modalStack = window._modalStack || [];
window._toasts = window._toasts || [];
window._modalSetters = window._modalSetters || [];
window._toastSetters = window._toastSetters || [];

function pushModal(el) {
  window._modalStack.push(el);
  window._modalSetters.forEach(fn => fn([...window._modalStack]));
}
function popModal() {
  window._modalStack.pop();
  window._modalSetters.forEach(fn => fn([...window._modalStack]));
}
function pushToast(msg, tone = "success", duration = 2800) {
  const id = Date.now() + Math.random();
  window._toasts.push({ id, msg, tone });
  window._toastSetters.forEach(fn => fn([...window._toasts]));
  setTimeout(() => {
    window._toasts = window._toasts.filter(t => t.id !== id);
    window._toastSetters.forEach(fn => fn([...window._toasts]));
  }, duration);
}
window.pushModal = pushModal;
window.popModal  = popModal;
window.pushToast = pushToast;

function ModalRoot() {
  const [stack, setStack] = React.useState([]);
  React.useEffect(() => {
    window._modalSetters.push(setStack);
    return () => { window._modalSetters = window._modalSetters.filter(f => f !== setStack); };
  }, []);
  if (!stack.length) return null;
  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) popModal(); }}>
      {stack[stack.length - 1]}
    </div>
  );
}

function ToastRoot() {
  const [toasts, setToasts] = React.useState([]);
  React.useEffect(() => {
    window._toastSetters.push(setToasts);
    return () => { window._toastSetters = window._toastSetters.filter(f => f !== setToasts); };
  }, []);
  if (!toasts.length) return null;
  const icons = { success: <I.Check size={15}/>, danger: <I.Alert size={15}/>, warn: <I.Alert size={15}/>, default: <I.Bell size={15}/> };
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={cx("toast", t.tone)}>
          {icons[t.tone] || icons.default}
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function Modal({ title, sub, wide, children, footer }) {
  return (
    <div className={cx("modal", wide && "wide")} onClick={e => e.stopPropagation()}>
      <div className="modal-head">
        <div>
          <div className="modal-title">{title}</div>
          {sub && <div className="modal-sub">{sub}</div>}
        </div>
        <button className="modal-close" onClick={popModal}>✕</button>
      </div>
      {children}
      {footer && <div className="modal-footer">{footer}</div>}
    </div>
  );
}
window.Modal = Modal;

function ConfirmModal({ icon, tone = "danger", title, desc, confirmLabel = "ยืนยัน", onConfirm }) {
  return (
    <Modal title=" " footer={
      <>
        <button className="btn" onClick={popModal}>ยกเลิก</button>
        <button className={cx("btn", tone)} onClick={() => { popModal(); onConfirm && onConfirm(); }}>{confirmLabel}</button>
      </>
    }>
      <div className={cx("confirm-icon", tone)}>{icon}</div>
      <div className="serif" style={{fontSize: 18, marginBottom: 8}}>{title}</div>
      <div className="muted small">{desc}</div>
    </Modal>
  );
}
window.ConfirmModal = ConfirmModal;

Object.assign(window, {
  cx, rnd, series, linePath, areaPath,
  I, Sparkline, Chart, Donut, Toggle, Chip, Seg,
  FARM_ZONES, SENSORS, DEVICES, ALERTS, USERS, ROLE_PERMS, AUTOMATIONS, REPORTS,
  ModalRoot, ToastRoot, Modal, ConfirmModal, pushModal, popModal, pushToast
});

// ============ useSB HOOK (React) ============
function useSB(queryFn, deps = []) {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const ref = React.useRef(0);

  function refetch() {
    const ticket = ++ref.current;
    setLoading(true);
    setError(null);
    const res = queryFn();
    if (!res || !res.then) {
      // No Supabase — return null to signal demo
      setLoading(false);
      setData(null);
      return;
    }
    res.then(({ data: d, error: e }) => {
      if (ticket !== ref.current) return;
      if (e) setError(e.message);
      else setData(d);
      setLoading(false);
    }).catch(e => {
      if (ticket !== ref.current) return;
      setError(e.message);
      setLoading(false);
    });
  }

  React.useEffect(() => { refetch(); }, deps);
  return { data, loading, error, refetch };
}
window.useSB = useSB;

    () => window.sbZones.getAll(),
    []
  );

  const [search, setSearch] = React.useState("");
  const demo = !window.sb();

  const { data: dbSensors,  loading: sLoad,  refetch: refetchSensors  } = useSB(() => window.sbSensors.getLatest(), []);
  const { data: dbZones,    loading: zLoad                             } = useSB(() => window.sbZones.getAll(), []);

  // Merge sensor static + latest reading
  const sensors = React.useMemo(() => {
    const base = dbSensors || window.DEMO.sensors;
    return base.map(s => ({
      ...s,
      id:       s.sensor_id || s.id,
      value:    s.value,
      range:    [s.range_min ?? s.range?.[0] ?? 0, s.range_max ?? s.range?.[1] ?? 100],
      series:   series(s.sensor_id || s.id, 36, (s.range_min||0), (s.range_max||100)),
    }));
  }, [dbSensors]);

  const zones = dbZones || window.DEMO.zones;

  // Real-time subscription
  React.useEffect(() => {
    if (demo) return;
    const sub = window.sbRT.subscribeSensorReadings(() => refetchSensors());
    const iv = setInterval(() => refetchSensors(), 15000);
    return () => { try { sub && sub.unsubscribe(); } catch(e) {} clearInterval(iv); };
  }, [demo]);

  const filtered = sensors.filter(s => {
    const matchZone   = zone === "all" || s.zone_id === zone;
    const matchType   = filter === "all" || s.kind === filter;
    const matchSearch = !search || (s.id||"").toLowerCase().includes(search.toLowerCase()) || (s.name||"").toLowerCase().includes(search.toLowerCase());
    return matchZone && matchType && matchSearch;
  });

  function handleAddSensor() {
    pushModal(<AddSensorModal onAdd={newSensor => {
      if (demo) { pushToast(`Demo: เพิ่มเซ็นเซอร์ ${newSensor.id}`,"warn"); return; }
      window.sbSensors.insert({
        id: newSensor.id, name: newSensor.name, kind: newSensor.kind,
        unit: newSensor.unit, zone_id: newSensor.zone, icon: newSensor.icon,
        range_min: newSensor.range[0], range_max: newSensor.range[1],
      }).then(res => {
        if (res.error) { pushToast("เพิ่มไม่สำเร็จ: " + res.error.message,"danger"); return; }
        pushToast(`เพิ่มเซ็นเซอร์ ${newSensor.id} สำเร็จ`,"success");
        refetchSensors();
      });
    }}/>);
  }

  function handleDelete(s) {
    pushModal(<ConfirmModal icon={<I.Trash size={24}/>} tone="danger"
      title={`ลบเซ็นเซอร์ ${s.id}?`} desc="ข้อมูล Reading ทั้งหมดของเซ็นเซอร์นี้จะถูกลบด้วย"
      confirmLabel="ลบ"
      onConfirm={() => {
        if (demo) { pushToast("Demo mode","warn"); return; }
        window.sbSensors.delete(s.id).then(() => { pushToast("ลบเซ็นเซอร์แล้ว","danger"); refetchSensors(); });
      }}/>);
  }

  function handleExport() {
    const rows = ["ID,ชื่อ,โซน,ค่า,หน่วย,สถานะ",
      ...sensors.map(s => `${s.id},${s.name},${s.zone_id||s.zone},${s.value},${s.unit},${s.value >= s.range[0] && s.value <= s.range[1]?"ปกติ":"เกินช่วง"}`)
    ].join("\n");
    const blob = new Blob([rows],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sensors-export.csv"; a.click();
    pushToast("Export สำเร็จ","success");
  }

  return (
    <>
      <div className="page-head">
        <div>
          <div className="muted small uc">เซ็นเซอร์ทั้งหมด · {demo?"DEMO":"LIVE"}</div>
          <h1>Sensor Monitoring</h1>
          <div className="meta mt-2">
            {sensors.length} sensors · {sensors.filter(s=>s.is_online!==false).length} online
            {sLoad && " · กำลังโหลด…"}
            {!demo && " · อัพเดตทุก 15 วิ"}
          </div>
        </div>
        <div className="spacer"/>
        <div className="actions">
          <div className="search"><I.Search size={14}/><input placeholder="ค้นหาเซ็นเซอร์..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn" onClick={() => pushModal(<FilterModal currentFilter={filter} currentZone={zone} onApply={(f,z)=>{setFilter(f);setZone(z);pushToast("ตั้งตัวกรองแล้ว","success");}}/>)}><I.Filter size={14}/> Filter</button>
          <Seg options={[{v:"grid",l:"Grid"},{v:"list",l:"List"}]} value={view} onChange={setView}/>
        </div>
      </div>

      {/* Zone + Type filter strip */}
      <div className="flex-c gap-2 mb-4" style={{flexWrap:"wrap"}}>
        <span className="tiny mono uc muted">ZONE:</span>
        {[{id:"all",name:"ทั้งหมด"}, ...zones].map(z=>(
          <div key={z.id} onClick={()=>setZone(z.id)} className={cx("chip",zone===z.id&&"sage")} style={{cursor:"pointer"}}>
            {z.name && z.name.length > 6 ? `โซน ${z.id}` : (z.name || `โซน ${z.id}`)}
          </div>
        ))}
        <div style={{flex:1}}/>
        <span className="tiny mono uc muted">TYPE:</span>
        {["all","temperature","humidity","soil","ph","ec","light","co2","water"].map(f=>(
          <div key={f} onClick={()=>setFilter(f)} className={cx("chip",filter===f&&"sage")} style={{cursor:"pointer"}}>{f}</div>
        ))}
        <button className="btn sage" onClick={handleAddSensor}><I.Plus size={14}/> เพิ่มเซ็นเซอร์</button>
        <button className="btn" onClick={handleExport}><I.Export size={14}/> Export</button>
        <button className="btn" onClick={refetchSensors} disabled={sLoad}><I.Refresh size={14}/>{sLoad ? " โหลด…" : ""}</button>
      </div>

      {demo && (
        <div style={{background:"var(--warn-soft)",border:"1px solid var(--warn)",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,display:"flex",alignItems:"center",gap:10}}>
          <I.Alert size={14} stroke="var(--warn)"/>
          <span style={{color:"var(--warn)"}}>⚠ Demo Mode — กรอก Supabase URL และ Key ในหน้า Settings เพื่อดูข้อมูลจริงจากเซ็นเซอร์</span>
        </div>
      )}

      {sLoad && (
        <div className="grid g-4">
          {[1,2,3,4,5,6,7,8].map(i=><div key={i} className="skeleton" style={{height:180,borderRadius:12}}/>)}
        </div>
      )}

      {!sLoad && filtered.length === 0 && (
        <div className="card" style={{textAlign:"center",padding:"48px",color:"var(--muted)"}}>
          <I.Search size={32}/><div className="serif mt-4" style={{fontSize:18}}>ไม่พบเซ็นเซอร์</div>
          <div className="small mt-2">ลองเปลี่ยนคำค้นหาหรือตัวกรอง</div>
        </div>
      )}

      {!sLoad && view === "grid" && filtered.length > 0 && (
        <div className="grid g-4">
          {filtered.map(s => {
            const Ico = I[s.icon] || I.Sensor;
            const inRange = s.value >= s.range[0] && s.value <= s.range[1];
            const pct = ((s.value - s.range[0]) / (s.range[1] - s.range[0])) * 100;
            return (
              <div className="sensor-card" key={s.id} style={{cursor:"pointer"}}
                onClick={() => pushModal(<SensorDetailModal sensor={s} onDelete={() => handleDelete(s)} onRefresh={refetchSensors}/>)}>
                <div className="sensor-h">
                  <div className="flex-c gap-2">
                    <div className="kpi-icon"><Ico size={13}/></div>
                    <div>
                      <div className="sensor-name">{s.name}</div>
                      <div className="sensor-id">{s.id} · โซน {s.zone_id||s.zone}</div>
                    </div>
                  </div>
                  <Chip tone={inRange?"sage":"warn"} dot>{inRange?"ปกติ":"เกินช่วง"}</Chip>
                </div>
                <div className="flex-c" style={{alignItems:"baseline",gap:4}}>
                  <span className="sensor-val">{typeof s.value === 'number' ? s.value.toFixed(s.kind==='ph'?1:0) : s.value}<span className="u">{s.unit}</span></span>
                </div>
                <div>
                  <div className="bar"><span style={{width:`${Math.min(100,Math.max(0,pct))}%`,background:inRange?"var(--sage)":"var(--warn)"}}/></div>
                  <div className="sensor-meta mt-2"><span>min {s.range[0]}{s.unit}</span><span>max {s.range[1]}{s.unit}</span></div>
                </div>
                <Sparkline data={s.series} h={48}/>
                <div className="flex-cb tiny mono muted">
                  <span>{s.recorded_at ? timeAgo(s.recorded_at) : "updated 3s ago"}</span>
                  <span className="flex-c gap-2"><span style={{width:6,height:6,borderRadius:999,background:s.is_online===false?"var(--danger)":"var(--sage)"}}/>{s.is_online===false?"OFFLINE":"LIVE"}</span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {!sLoad && view === "list" && filtered.length > 0 && (
        <div className="card" style={{padding:0}}>
          <table className="tbl">
            <thead><tr><th>เซ็นเซอร์</th><th>รหัส</th><th>โซน</th><th>ค่าปัจจุบัน</th><th>ช่วง</th><th>กราฟ</th><th>อัพเดต</th><th>สถานะ</th><th></th></tr></thead>
            <tbody>
              {filtered.map(s => {
                const Ico = I[s.icon]||I.Sensor;
                const ok = s.value >= s.range[0] && s.value <= s.range[1];
                return (
                  <tr key={s.id} style={{cursor:"pointer"}} onClick={()=>pushModal(<SensorDetailModal sensor={s} onDelete={()=>handleDelete(s)} onRefresh={refetchSensors}/>)}>
                    <td><div className="flex-c gap-3"><div className="kpi-icon"><Ico size={13}/></div><span>{s.name}</span></div></td>
                    <td className="mono muted">{s.id}</td>
                    <td>โซน {s.zone_id||s.zone}</td>
                    <td className="mono" style={{fontSize:15}}>{typeof s.value==='number'?s.value.toFixed(1):s.value} <span className="muted tiny">{s.unit}</span></td>
                    <td className="mono muted tiny">{s.range[0]}–{s.range[1]} {s.unit}</td>
                    <td style={{width:160}}><Sparkline data={s.series} h={28}/></td>
                    <td className="tiny mono muted">{s.recorded_at ? timeAgo(s.recorded_at) : "3s ago"}</td>
                    <td><Chip tone={ok?"sage":"warn"} dot>{ok?"ปกติ":"เกินช่วง"}</Chip></td>
                    <td onClick={e=>e.stopPropagation()}>
                      <div className="flex gap-2">
                        <button className="icon-btn" onClick={()=>pushModal(<SensorDetailModal sensor={s} onDelete={()=>handleDelete(s)} onRefresh={refetchSensors}/>)}><I.More size={14}/></button>
                        <button className="icon-btn" onClick={()=>handleDelete(s)}><I.Trash size={12}/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* Stats summary */}
      {!sLoad && sensors.length > 0 && (
        <div className="card mt-4">
          <div className="card-h">
            <div><div className="card-title">สถิติเซ็นเซอร์</div><div className="card-sub">24 ชั่วโมงล่าสุด</div></div>
          </div>
          <div className="grid g-4" style={{gap:16}}>
            {[
              {l:"ค่าเฉลี่ย Temp",     v: sensors.find(s=>s.kind==='temperature')?.value?.toFixed(1)+"°C" || "—"},
              {l:"Soil Moisture ต่ำสุด",v: Math.min(...sensors.filter(s=>s.kind==='soil').map(s=>s.value))+"%" },
              {l:"Sensors ที่ผิดปกติ", v: sensors.filter(s=>s.value<s.range[0]||s.value>s.range[1]).length+" ตัว"},
              {l:"ข้อมูลจำนวน",         v: demo ? "—" : "Live"},
            ].map(x=>(
              <div key={x.l}><div className="tiny mono uc muted">{x.l}</div><div className="mono mt-2" style={{fontSize:18}}>{x.v}</div></div>
            ))}
          </div>
        </div>
      )}
    </>
  );
}


// ---- Sensor Modals ----
function AddSensorModal({ onAdd }) {
  const [id, setId]       = React.useState("");
  const [name, setName]   = React.useState("");
  const [kind, setKind]   = React.useState("temperature");
  const [zone, setZone]   = React.useState("A");
  const [unit, setUnit]   = React.useState("°C");
  const [minV, setMinV]   = React.useState("20");
  const [maxV, setMaxV]   = React.useState("40");
  const [err, setErr]     = React.useState("");

  const KINDS = [
    { v:"temperature", l:"Temperature", u:"°C", icon:"Temp" },
    { v:"humidity",    l:"Humidity",    u:"%",  icon:"Drop" },
    { v:"soil",        l:"Soil Moisture", u:"%", icon:"Leaf" },
    { v:"ph",          l:"pH Value",    u:"pH", icon:"Beaker" },
    { v:"ec",          l:"EC Value",    u:"mS/cm", icon:"Beaker" },
    { v:"light",       l:"Light",       u:"klx", icon:"Sun" },
    { v:"co2",         l:"CO₂ Level",   u:"ppm", icon:"Cloud" },
    { v:"water",       l:"Water Level", u:"%",  icon:"Wave" },
  ];
  React.useEffect(() => {
    const k = KINDS.find(k => k.v === kind);
    if (k) setUnit(k.u);
  }, [kind]);

  function handleSubmit() {
    if (!id.trim()) return setErr("กรุณากรอกรหัสเซ็นเซอร์");
    if (!name.trim()) return setErr("กรุณากรอกชื่อเซ็นเซอร์");
    const k = KINDS.find(k => k.v === kind);
    const newSensor = {
      id: id.toUpperCase(), kind, name, unit,
      value: parseFloat(((parseFloat(minV) + parseFloat(maxV)) / 2).toFixed(1)),
      range: [parseFloat(minV), parseFloat(maxV)],
      zone, icon: k?.icon || "Sensor",
      series: series(id, 36, parseFloat(minV), parseFloat(maxV)),
    };
    onAdd(newSensor);
    popModal();
  }

  return (
    <Modal title="เพิ่มเซ็นเซอร์ใหม่" sub="กรอกข้อมูลเซ็นเซอร์ IoT ที่ต้องการเพิ่ม"
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button><button className="btn primary" onClick={handleSubmit}><I.Plus size={14}/> เพิ่มเซ็นเซอร์</button></>}
    >
      {err && <div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"10px 14px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}>
          <label>รหัสเซ็นเซอร์ *</label>
          <input value={id} onChange={e=>setId(e.target.value)} placeholder="เช่น TMP-05"/>
        </div>
        <div className="field" style={{margin:0}}>
          <label>ชื่อแสดง *</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น Temperature Zone E"/>
        </div>
      </div>
      <div className="field mt-3">
        <label>ประเภทเซ็นเซอร์</label>
        <select value={kind} onChange={e=>setKind(e.target.value)} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
          {KINDS.map(k => <option key={k.v} value={k.v}>{k.l} ({k.u})</option>)}
        </select>
      </div>
      <div className="field">
        <label>โซน</label>
        <div className="flex gap-2">
          {FARM_ZONES.map(z => (
            <div key={z.id} onClick={() => setZone(z.id)}
                 style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"8px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>
              โซน {z.id}
            </div>
          ))}
        </div>
      </div>
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}>
          <label>ค่าต่ำสุด (min)</label>
          <input type="number" value={minV} onChange={e=>setMinV(e.target.value)}/>
        </div>
        <div className="field" style={{margin:0}}>
          <label>ค่าสูงสุด (max)</label>
          <input type="number" value={maxV} onChange={e=>setMaxV(e.target.value)}/>
        </div>
      </div>
    </Modal>
  );
}

function SensorDetailModal({ sensor, onDelete, onRefresh }) {
  const Ico = I[sensor.icon] || I.Sensor;
  const inRange = sensor.value >= sensor.range[0] && sensor.value <= sensor.range[1];
  const demo = !window.sb();

  // Load real chart data
  const { data: readings, loading: rLoad } = useSB(
    () => window.sbSensors.getReadings(sensor.id || sensor.sensor_id, 24),
    [sensor.id]
  );

  const chartData = readings && readings.length > 1
    ? readings.map(r => r.value)
    : sensor.series || series(sensor.id, 36, sensor.range[0], sensor.range[1]);

  const xLabels = readings && readings.length > 1
    ? readings.filter((_,i) => i % Math.floor(readings.length/7) === 0).map(r => new Date(r.recorded_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}))
    : ["00","04","08","12","16","20","24"];

  return (
    <Modal wide title={sensor.name} sub={`${sensor.id || sensor.sensor_id} · โซน ${sensor.zone_id || sensor.zone} · ${sensor.unit}`}
      footer={<>
        <button className="btn" onClick={popModal}>ปิด</button>
        <button className="btn" onClick={() => {
          if (!demo) window.sbSensors.insertReading(sensor.id || sensor.sensor_id, sensor.value + (Math.random()-0.5)*2);
          pushToast("บันทึก Reading แล้ว","success");
        }}><I.Plus size={13}/> บันทึกค่าตอนนี้</button>
        <button className="btn danger" onClick={() => {
          popModal();
          onDelete && onDelete();
        }}><I.Trash size={13}/> ลบเซ็นเซอร์</button>
      </>}
    >
      <div className="flex-c gap-4 mb-4">
        <div className="kpi-icon" style={{width:48,height:48,borderRadius:12}}><Ico size={22}/></div>
        <div>
          <div className="serif" style={{fontSize:40,letterSpacing:"-0.02em",lineHeight:1}}>
            {typeof sensor.value==='number' ? sensor.value.toFixed(sensor.kind==='ph'?2:1) : sensor.value}
            <span style={{fontSize:18,color:"var(--muted)",marginLeft:6}}>{sensor.unit}</span>
          </div>
          <div className="flex-c gap-2 mt-2">
            <Chip tone={inRange?"sage":"warn"} dot>{inRange?"ปกติ":"เกินช่วงที่กำหนด"}</Chip>
            {sensor.recorded_at && <span className="tiny mono muted">{timeAgo(sensor.recorded_at)}</span>}
            {!demo && <span className="chip info" style={{fontSize:9}}>Supabase Live</span>}
          </div>
        </div>
      </div>
      <div className="card" style={{marginBottom:14}}>
        <div className="card-h">
          <div className="card-title" style={{fontSize:13}}>กราฟ 24 ชั่วโมงล่าสุด</div>
          {rLoad && <span className="tiny mono muted">กำลังโหลด...</span>}
          {readings && <span className="tiny mono muted">{readings.length} data points</span>}
        </div>
        {rLoad
          ? <div className="skeleton" style={{height:180,borderRadius:8}}/>
          : <Chart data={chartData} xLabels={xLabels} h={180}/>
        }
      </div>
      <div className="grid g-2" style={{gap:12}}>
        {[
          {l:"ช่วงปกติ",   v:`${sensor.range[0]} – ${sensor.range[1]} ${sensor.unit}`},
          {l:"โซน",        v:`โซน ${sensor.zone_id||sensor.zone}`},
          {l:"โปรโตคอล",  v:sensor.protocol||"ESP32 · LoRa"},
          {l:"Gateway",    v:sensor.gateway||"GW-02 · แม่ริม"},
          {l:"อัพเดตล่าสุด", v:sensor.recorded_at ? timeAgo(sensor.recorded_at) : "3 วินาที"},
          {l:"สถานะ",      v:sensor.is_online===false?"Offline":"Online"},
        ].map(x=>(
          <div key={x.l} style={{background:"var(--cream)",borderRadius:8,padding:"12px 14px"}}>
            <div className="tiny mono uc muted">{x.l}</div>
            <div className="mono mt-2">{x.v}</div>
          </div>
        ))}
      </div>
    </Modal>
  );
}

    >
      <div className="field">
        <label>โซน</label>
        <div className="flex gap-2" style={{flexWrap:"wrap"}}>

          ))}

      </div>
      <div className="field mt-3">
        <label>ประเภท</label>
        <div className="flex gap-2" style={{flexWrap:"wrap"}}>

            <div key={type} onClick={()=>setF(type)} style={{border:`1px solid ${f===type?"var(--ink)":"var(--hair)"}`,background:f===type?"var(--ink)":"var(--paper)",color:f===type?"var(--paper)":"var(--ink-2)",padding:"8px 14px",borderRadius:8,fontSize:12,cursor:"pointer"}}>{type}</div>
          ))}
        </div>
      </div>
    </Modal>
  );
}


// ============ DEVICES ============
function DevicesPage() {
  const [search, setSearch]         = React.useState("");
  const [filterZone, setFilterZone] = React.useState("all");
  const [filterKind, setFilterKind] = React.useState("all");
  const demo = !window.sb();

  const { data: dbDevices, loading: dLoad, refetch: refetchDevices } = useSB(
    () => window.sbDevices.getAll(), []
  );

  // Normalize device data
  const devices = React.useMemo(() => {
    const base = dbDevices || window.DEMO.devices;
    return base.map(d => ({
      ...d,
      on: d.is_on !== undefined ? d.is_on : (d.on || false),
      flow: d.flow_info || d.flow || "—",
      zone: d.zone_id || d.zone,
      power: (d.power_kw || 0) + " kW",
    }));
  }, [dbDevices]);

  // Real-time device updates
  React.useEffect(() => {
    if (demo) return;
    const sub = window.sbRT.subscribeDevices(() => refetchDevices());
    return () => { try { sub && sub.unsubscribe(); } catch(e) {} };
  }, [demo]);

  const onTotal    = devices.filter(d => d.on).length;
  const totalPower = devices.filter(d=>d.on).reduce((s,d) => s + (d.power_kw||0), 0).toFixed(1);

  const filtered = devices.filter(d => {
    const matchZ = filterZone==="all" || (d.zone_id||d.zone)===filterZone;
    const matchK = filterKind==="all" || d.kind===filterKind;
    const matchS = !search || d.name.toLowerCase().includes(search.toLowerCase()) || d.id.toLowerCase().includes(search.toLowerCase());
    return matchZ && matchK && matchS;
  });

  function handleToggle(d) {
    const newState = !d.on;
    if (demo) { pushToast("Demo mode — เชื่อม Supabase เพื่อควบคุมจริง","warn"); return; }
    const userId = window._supabase?._authUser?.id;
    window.sbDevices.toggle(d.id, newState, userId)
      .then(res => {
        if (res.error) { pushToast("เกิดข้อผิดพลาด: "+res.error.message,"danger"); return; }
        pushToast(`${d.name}: ${newState?"เปิด":"ปิด"}แล้ว`, newState?"success":"warn");
        refetchDevices();
      });
  }

  function handleEmergencyStop() {
    pushModal(<ConfirmModal icon={<I.Power size={24}/>} tone="danger"
      title="Emergency Stop ทุกอุปกรณ์?"
      desc="ปั๊มน้ำ พัดลม และไฟ Grow Light ทั้งหมดจะหยุดทำงานทันที"
      confirmLabel="หยุดฉุกเฉิน"
      onConfirm={() => {
        if (demo) { pushToast("Demo mode","warn"); return; }
        window.sbDevices.emergencyStop()
          .then(() => { pushToast("⚠️ Emergency Stop — อุปกรณ์ทั้งหมดหยุดแล้ว","danger"); refetchDevices(); });
      }}/>);
  }

  function handleAdd() {
    pushModal(<AddDeviceModal existingIds={devices.map(d=>d.id)} onAdd={dev => {
      if (demo) { pushToast("Demo: "+dev.id,"warn"); return; }
      window.sbDevices.insert({
        id:dev.id, name:dev.name, kind:dev.kind, icon:dev.icon,
        zone_id:dev.zone, is_on:dev.on||false, power_kw:parseFloat(dev.power)||0,
        flow_info:dev.flow, protocol:dev.proto||"MQTT",
        ip_address:dev.host||null, port:dev.port||null,
      }).then(res => {
        if (res.error) { pushToast("เพิ่มไม่สำเร็จ: "+res.error.message,"danger"); return; }
        pushToast(`เพิ่มอุปกรณ์ ${dev.id} สำเร็จ`,"success");
        refetchDevices();
      });
    }}/>);
  }

  function handleDelete(d) {
    pushModal(<ConfirmModal icon={<I.Trash size={24}/>} tone="danger"
      title={`ลบ ${d.name}?`} desc="ข้อมูล Log ทั้งหมดของอุปกรณ์นี้จะถูกลบด้วย"
      confirmLabel="ลบ"
      onConfirm={() => {
        if (demo) return;
        window.sbDevices.delete(d.id).then(() => { pushToast("ลบอุปกรณ์แล้ว","danger"); refetchDevices(); });
      }}/>);
  }

  return (
    <>
      <div className="page-head">
        <div>
          <div className="muted small uc">อุปกรณ์ IoT · {demo?"DEMO":"LIVE via Supabase"}</div>
          <h1>Device Control</h1>
          <div className="meta mt-2">{devices.length} อุปกรณ์ · {onTotal} ทำงานอยู่ · กำลังไฟรวม {totalPower} kW</div>
        </div>
        <div className="spacer"/>
        <div className="actions">
          <div className="search"><I.Search size={14}/><input placeholder="ค้นหาอุปกรณ์..." value={search} onChange={e=>setSearch(e.target.value)}/></div>
          <button className="btn" onClick={() => pushModal(<ScheduleModal/>)}><I.Clock size={14}/> Schedules</button>
          <button className="btn" onClick={refetchDevices} disabled={dLoad}><I.Refresh size={14}/></button>
          <button className="btn primary" onClick={handleAdd}><I.Plus size={14}/> เพิ่มอุปกรณ์</button>
          <button className="btn danger" onClick={handleEmergencyStop}><I.Power size={14}/> Emergency Stop</button>
        </div>
      </div>

      {/* Filter bar */}
      <div className="flex-c gap-2 mb-4" style={{flexWrap:"wrap"}}>
        <span className="tiny mono uc muted">ZONE:</span>
        {["all","A","B","C","D"].map(z=>(
          <div key={z} onClick={()=>setFilterZone(z)} className={cx("chip",filterZone===z&&"sage")} style={{cursor:"pointer"}}>{z==="all"?"ทั้งหมด":`โซน ${z}`}</div>
        ))}
        <div style={{flex:1}}/>
        <span className="tiny mono uc muted">TYPE:</span>
        {["all","pump","fan","light"].map(k=>(
          <div key={k} onClick={()=>setFilterKind(k)} className={cx("chip",filterKind===k&&"sage")} style={{cursor:"pointer"}}>
            {k==="all"?"ทุกประเภท":k==="pump"?"ปั๊มน้ำ":k==="fan"?"พัดลม":"ไฟ"}
          </div>
        ))}
      </div>

      {demo && (
        <div style={{background:"var(--warn-soft)",border:"1px solid var(--warn)",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,display:"flex",gap:10}}>
          <I.Alert size={14} stroke="var(--warn)"/>
          <span style={{color:"var(--warn)"}}>Demo Mode — Toggle จะไม่บันทึกจริง กรอก Supabase credentials เพื่อควบคุมอุปกรณ์จริง</span>
        </div>
      )}

      {dLoad ? (
        <div className="grid g-3">{[1,2,3,4,5,6].map(i=><div key={i} className="skeleton" style={{height:220,borderRadius:14}}/>)}</div>
      ) : filtered.length === 0 ? (
        <div className="card" style={{textAlign:"center",padding:"48px",color:"var(--muted)"}}>
          <I.Device size={32}/>
          <div className="serif mt-4" style={{fontSize:18}}>ไม่พบอุปกรณ์</div>
          <div className="small mt-2">ลองเปลี่ยนตัวกรอง</div>
        </div>
      ) : (
        <div className="grid g-3 mb-4">
          {filtered.map(d => {
            const Ico = I[d.icon] || I.Device;
            return (
              <div className={cx("device-card", d.on&&"on")} key={d.id}>
                <div className="flex-cb">
                  <div className="flex-c gap-3">
                    <div className="kpi-icon" style={{width:36,height:36,background:d.on?"var(--sage)":"var(--cream)",color:d.on?"var(--paper)":"var(--muted-2)"}}>
                      <Ico size={18}/>
                    </div>
                    <div>
                      <div className="serif" style={{fontSize:16}}>{d.name}</div>
                      <div className="tiny mono muted">{d.id} · โซน {d.zone_id||d.zone}</div>
                    </div>
                  </div>
                  <Toggle on={d.on} onClick={() => handleToggle(d)}/>
                </div>
                <div className="flex-cb">
                  <div style={{color:d.on?"var(--sage-2)":"var(--muted)",fontFamily:"var(--f-mono)",fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em"}}>
                    {d.on?"● ON":"○ OFF"}
                  </div>
                  <div className="tiny mono muted">{d.flow_info||d.flow}</div>
                </div>
                <div className="flex-cb small">
                  <span className="mono muted">{d.power_kw||0} kW</span>
                  {d.last_toggled_at && <span className="tiny muted">{timeAgo(d.last_toggled_at)}</span>}
                </div>
                <div className="flex gap-2 mt-2">
                  <button className="btn" style={{flex:1,justifyContent:"center",fontSize:11}} onClick={()=>handleToggle(d)}>
                    {d.on ? "ปิด" : "เปิด"}
                  </button>
                  <button className="icon-btn" onClick={()=>pushModal(<EditDeviceModal device={d} onSave={upd=>{ if(!demo) window.sbDevices.update(upd.id,{name:upd.name,zone_id:upd.zone}).then(()=>{pushToast("อัพเดตแล้ว","success");refetchDevices();}); }} onDelete={()=>handleDelete(d)}/>)}><I.Edit size={12}/></button>
                  <button className="icon-btn" onClick={()=>handleDelete(d)}><I.Trash size={12}/></button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Automation rules (live) */}
      <AutomationRulesCard/>
    </>
  );
}

// Mini Automation card used in Devices page
function AutomationRulesCard() {
  const demo = !window.sb();
  const { data: dbRules, loading, refetch } = useSB(() => window.sbRules.getAll(), []);
  const rules = dbRules || window.DEMO.rules;

  return (
    <div className="card">
      <div className="card-h">
        <div><div className="card-title">Automation Rules</div><div className="card-sub">{rules.length} RULES · {rules.filter(r=>r.is_active).length} ACTIVE</div></div>
        <button className="btn primary" onClick={()=>pushModal(<AddAutomationModal onAdd={r=>{
          if(demo){pushToast("Demo","warn");return;}
          window.sbRules.insert({name:r.name,is_active:true,condition:r.cond,action:r.act}).then(()=>{pushToast("เพิ่ม Rule แล้ว","success");refetch();});
        }}/>)}><I.Plus size={14}/> เพิ่มกฎใหม่</button>
      </div>
      <table className="tbl">
        <thead><tr><th style={{width:40}}></th><th>ชื่อกฎ</th><th>เงื่อนไข</th><th>การกระทำ</th><th>วันนี้</th><th></th></tr></thead>
        <tbody>
          {rules.map((a,i) => (
            <tr key={a.id||i}>
              <td><Toggle on={a.is_active!==undefined?a.is_active:a.on} onClick={()=>{
                if(demo){pushToast("Demo","warn");return;}
                window.sbRules.toggle(a.id, !(a.is_active!==undefined?a.is_active:a.on)).then(()=>refetch());
              }}/></td>
              <td><div className="ink2">{a.name}</div></td>
              <td className="mono muted small">{a.condition||a.cond}</td>
              <td className="small">{a.action||a.act}</td>
              <td><div className="mono" style={{fontSize:15}}>{a.runs_today||a.runs||0}<span className="muted tiny"> ครั้ง</span></div></td>
              <td><button className="icon-btn" onClick={()=>{if(!demo)window.sbRules.delete(a.id).then(()=>{pushToast("ลบกฎแล้ว","danger");refetch();})}}><I.Trash size={12}/></button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}


// ─── Modal เพิ่มอุปกรณ์ใหม่ ───────────────────────────────────
function AddDeviceModal({ existingIds, onAdd }) {
  const CATEGORIES = [
    {
      id:"farm", label:"อุปกรณ์ฟาร์ม", icon:"Leaf", color:"var(--sage-2)", bg:"var(--sage-soft)",
      desc:"ปั๊มน้ำ · พัดลม · Grow Light · ปั๊มหมอก",
      kinds:[
        {v:"pump",  l:"ปั๊มน้ำ",         icon:"Pump",  prefix:"PMP", power:"1.2 kW",  proto:"MQTT", flow:"12.4 L/min"},
        {v:"fan",   l:"พัดลม",            icon:"Fan",   prefix:"FAN", power:"0.4 kW",  proto:"MQTT", flow:"Mid speed"},
        {v:"light", l:"Grow Light",       icon:"Bulb",  prefix:"LGT", power:"0.3 kW",  proto:"MQTT", flow:"Spectrum: full"},
        {v:"mist",  l:"ปั๊มหมอก",         icon:"Drop",  prefix:"MST", power:"0.3 kW",  proto:"MQTT", flow:"2.1 L/min"},
        {v:"valve", l:"โซลินอยด์วาล์ว",   icon:"Pump",  prefix:"VLV", power:"0.05 kW", proto:"MQTT", flow:"On/Off"},
        {v:"feeder",l:"เครื่องให้ปุ๋ย",   icon:"Leaf",  prefix:"FDR", power:"0.1 kW",  proto:"MQTT", flow:"2.4 L/h"},
      ],
    },
    {
      id:"cctv", label:"กล้อง CCTV", icon:"Video", color:"var(--info)", bg:"var(--info-soft)",
      desc:"RTSP · ONVIF · IP Camera · PTZ · AI Camera",
      kinds:[
        {v:"cctv_ip",   l:"IP Camera",      icon:"Video",  prefix:"CAM", power:"0.02 kW", proto:"RTSP",  flow:"RTSP"},
        {v:"cctv_ptz",  l:"PTZ Camera",     icon:"Camera", prefix:"PTZ", power:"0.04 kW", proto:"ONVIF", flow:"RTSP"},
        {v:"cctv_therm",l:"Thermal Camera", icon:"Temp",   prefix:"THM", power:"0.05 kW", proto:"RTSP",  flow:"RTSP"},
        {v:"cctv_ai",   l:"AI Camera",      icon:"AI",     prefix:"AIC", power:"0.06 kW", proto:"RTSP",  flow:"RTSP"},
      ],
    },
    {
      id:"iot", label:"IoT / Sensor Node", icon:"Sensor", color:"var(--warn)", bg:"var(--warn-soft)",
      desc:"MQTT · Modbus · LoRa · Zigbee · HTTP",
      kinds:[
        {v:"gateway", l:"LoRa Gateway",    icon:"Wifi",   prefix:"GWY", power:"0.08 kW", proto:"LoRa",   flow:"LoRaWAN"},
        {v:"node",    l:"Sensor Node",     icon:"Sensor", prefix:"NOD", power:"0.02 kW", proto:"MQTT",   flow:"Sensor"},
        {v:"plc",     l:"PLC Controller",  icon:"Device", prefix:"PLC", power:"0.15 kW", proto:"Modbus", flow:"Modbus"},
        {v:"zigbee",  l:"Zigbee Coord.",   icon:"Wifi",   prefix:"ZBE", power:"0.03 kW", proto:"Zigbee", flow:"Zigbee"},
        {v:"energy",  l:"Energy Meter",    icon:"Line",   prefix:"ENR", power:"0.01 kW", proto:"Modbus", flow:"Modbus"},
        {v:"weather", l:"Weather Station", icon:"Cloud",  prefix:"WTH", power:"0.02 kW", proto:"HTTP",   flow:"HTTP"},
      ],
    },
  ];

  const DEF_PORT = {RTSP:"554",ONVIF:"80",MQTT:"1883",LoRa:"1700",Modbus:"502",Zigbee:"8080",HTTP:"80"};

  const [step,    setStep]    = React.useState(1);
  const [cat,     setCat]     = React.useState(null);
  const [kind,    setKind]    = React.useState(null);
  const [name,    setName]    = React.useState("");
  const [zone,    setZone]    = React.useState("A");
  const [host,    setHost]    = React.useState("");
  const [port,    setPort]    = React.useState("");
  const [user,    setUser]    = React.useState("");
  const [pass,    setPass]    = React.useState("");
  const [power,   setPower]   = React.useState("");
  const [startOn, setStartOn] = React.useState(false);
  const [testing, setTesting] = React.useState(null);
  const [err,     setErr]     = React.useState("");

  const needsNet = cat && cat.id !== "farm";

  function genId() {
    if (!kind) return "---";
    let n = 1;
    while (existingIds.includes(`${kind.prefix}-${String(n).padStart(2,"0")}`)) n++;
    return `${kind.prefix}-${String(n).padStart(2,"0")}`;
  }

  function pickCat(c) { setCat(c); setKind(null); setStep(2); }
  function pickKind(k) { setKind(k); setPower(k.power); setPort(DEF_PORT[k.proto]||""); setStep(3); }

  function doTest() {
    if (!host.trim()) { setErr("กรุณากรอก IP Address"); return; }
    setErr(""); setTesting("loading");
    setTimeout(() => setTesting("ok"), 1800 + Math.random()*700);
  }

  function doSave() {
    if (!name.trim()) { setErr("กรุณากรอกชื่ออุปกรณ์"); return; }
    onAdd({
      id: genId(), name: name.trim(), kind: kind.v, icon: kind.icon,
      on: startOn, zone, flow: kind.flow,
      uptime: startOn ? "0m" : "—",
      power: startOn ? (power||kind.power) : "0 kW",
      host: host||null, port: port||DEF_PORT[kind.proto]||null,
      proto: kind.proto, catId: cat.id,
    });
    popModal();
  }

  const STEP_LABELS = ["หมวดหมู่","ประเภท","ตั้งค่า"];

  return (
    <Modal wide title="เพิ่มอุปกรณ์ใหม่" sub="Device Setup Wizard"
      footer={
        <div style={{display:"flex",alignItems:"center",width:"100%",gap:8}}>
          <div className="flex-c gap-2" style={{flex:1}}>
            {STEP_LABELS.map((s,i)=>(
              <React.Fragment key={s}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <div style={{width:22,height:22,borderRadius:999,display:"grid",placeItems:"center",fontSize:10,fontFamily:"var(--f-mono)",flexShrink:0,
                    background:step>i+1?"var(--sage-2)":step===i+1?"var(--ink)":"var(--hair-2)",
                    color:step>=i+1?"var(--paper)":"var(--muted)"}}>
                    {step>i+1?<I.Check size={10}/>:i+1}
                  </div>
                  {step===i+1&&<span style={{fontSize:10,fontFamily:"var(--f-mono)",color:"var(--ink)"}}>{s}</span>}
                </div>
                {i<2&&<div style={{width:16,height:1,background:"var(--hair-2)",flexShrink:0}}/>}
              </React.Fragment>
            ))}
          </div>
          <button className="btn" onClick={step===1?popModal:()=>setStep(s=>s-1)}>
            {step===1?"ยกเลิก":"← ย้อนกลับ"}
          </button>
          {step===3&&needsNet&&testing!=="ok"&&(
            <button className="btn" onClick={doTest} disabled={testing==="loading"}>
              {testing==="loading"?"กำลังทดสอบ…":<><I.Signal size={13}/> ทดสอบเชื่อมต่อ</>}
            </button>
          )}
          {step===3&&<button className="btn primary" onClick={doSave}><I.Plus size={14}/> เพิ่มอุปกรณ์</button>}
        </div>
      }
    >
      {err&&<div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}

      {/* ── STEP 1: หมวดหมู่ ── */}
      {step===1&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="small muted mb-2">เลือกประเภทอุปกรณ์ที่ต้องการเพิ่ม</div>
          {CATEGORIES.map(c=>(
            <div key={c.id} onClick={()=>pickCat(c)} style={{
              border:`2px solid ${cat?.id===c.id?c.color:"var(--hair)"}`,borderRadius:12,
              padding:"18px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:18,transition:"all 0.14s",
              background:cat?.id===c.id?`color-mix(in srgb,${c.color} 7%,var(--paper))`:"var(--paper)",
            }}
            onMouseEnter={e=>{if(cat?.id!==c.id){e.currentTarget.style.borderColor=c.color;}}}
            onMouseLeave={e=>{if(cat?.id!==c.id){e.currentTarget.style.borderColor="var(--hair)";}}}
            >
              <div style={{width:52,height:52,borderRadius:14,background:c.bg,color:c.color,display:"grid",placeItems:"center",flexShrink:0}}>
                {React.createElement(I[c.icon]||I.Device,{size:24})}
              </div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--f-serif)",fontSize:17,marginBottom:5}}>{c.label}</div>
                <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"var(--muted)"}}>{c.desc}</div>
              </div>
              <I.Right size={16} stroke="var(--muted)"/>
            </div>
          ))}
        </div>
      )}

      {/* ── STEP 2: ประเภทย่อย ── */}
      {step===2&&cat&&(
        <div>
          <div className="flex-c gap-3 mb-4">
            <div style={{width:34,height:34,borderRadius:9,background:cat.bg,color:cat.color,display:"grid",placeItems:"center"}}>
              {React.createElement(I[cat.icon]||I.Device,{size:17})}
            </div>
            <div>
              <div style={{fontFamily:"var(--f-serif)",fontSize:15}}>{cat.label}</div>
              <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"var(--muted)"}}>เลือกประเภทย่อย</div>
            </div>
          </div>
          <div className="grid g-2" style={{gap:10}}>
            {cat.kinds.map((k,i)=>(
              <div key={i} onClick={()=>pickKind(k)} style={{
                border:`1.5px solid ${kind===k?cat.color:"var(--hair)"}`,borderRadius:10,
                padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,
                background:kind===k?cat.bg:"var(--paper)",transition:"all 0.12s",
              }}
              onMouseEnter={e=>{if(kind!==k){e.currentTarget.style.borderColor=cat.color;}}}
              onMouseLeave={e=>{if(kind!==k){e.currentTarget.style.borderColor="var(--hair)";}}}
              >
                <div style={{width:36,height:36,borderRadius:9,background:kind===k?cat.color:"var(--cream)",color:kind===k?"white":"var(--muted)",display:"grid",placeItems:"center",flexShrink:0,transition:"all 0.12s"}}>
                  {React.createElement(I[k.icon]||I.Device,{size:16})}
                </div>
                <div>
                  <div style={{fontSize:13,color:"var(--ink-2)",fontWeight:500}}>{k.l}</div>
                  <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)",marginTop:2}}>{k.proto} · {k.power}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── STEP 3: กรอกข้อมูล ── */}
      {step===3&&kind&&(
        <div>
          {/* Preview */}
          <div style={{background:"var(--cream)",borderRadius:10,padding:"14px 16px",marginBottom:18,display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:42,height:42,borderRadius:10,background:startOn?cat.color:"var(--hair)",color:startOn?"white":"var(--muted-2)",display:"grid",placeItems:"center",flexShrink:0,transition:"background 0.2s"}}>
              {React.createElement(I[kind.icon]||I.Device,{size:20})}
            </div>
            <div style={{flex:1}}>

    {id: "EC-01",  x: 78, y: 72, kind: "sage", label: "E", name: "EC-01", val: "1.8", zone: "D"},
  ];
  const allPins = [...basePins, ...customPins];

  const devices = [
    {id: "PMP-01", x: 22, y: 48, on: true, name: "ปั๊มน้ำหลัก #1"},

    if (!pinMode) return;
    const rect = mapRef.current.getBoundingClientRect();

    const yPct = ((e.clientY - rect.top)  / rect.height) * 100;
    openPinModal(xPct, yPct);
  }

  function openPinModal(x, y) {
    pushModal(
      <NewPinModal
        x={x} y={y}

          setCustomPins(prev => [...prev, pin]);

          pushToast(`ปักหมุด "${pin.name}" สำเร็จ`, "success");

        onCancel={() => { setPinMode(false); popModal(); }}
      />
    );
  }

  function deletePin(id) {
    setCustomPins(prev => prev.filter(p => p.id !== id));

  }

  return (
    <>
