// Simple animated canvas-based fake live view
function CCTVLiveCanvas({ camId, status, isSelected }) {
  const cvRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const frameRef = React.useRef(0);

  React.useEffect(() => {
    const cv = cvRef.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width = 320;
    const H = cv.height = 180;

    // Use camId as seed for consistent visuals per camera
    const seed = camId.charCodeAt(4) || 1;
    const hue  = (seed * 47) % 360;

    function drawFrame() {
      frameRef.current++;
      const f = frameRef.current;

      if (status === "offline") {
        ctx.fillStyle = "#111"; ctx.fillRect(0,0,W,H);
        // Static noise
        const idata = ctx.createImageData(W,H);
        for (let i = 0; i < idata.data.length; i += 4) {
          const v = Math.random() * 30;
          idata.data[i] = idata.data[i+1] = idata.data[i+2] = v;
          idata.data[i+3] = 255;
        }
        ctx.putImageData(idata,0,0);
        ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
        ctx.fillText("SIGNAL LOST", W/2, H/2 - 6);
        ctx.font = "9px monospace"; ctx.fillText("NO INPUT", W/2, H/2 + 12);
        return;
      }

      // Background — dark green tint (night-vision-ish for farm)
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0, `hsl(${hue},18%,8%)`);
      grad.addColorStop(1, `hsl(${hue},22%,5%)`);
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

      // Fake "foliage" shapes in background
      for (let i = 0; i < 8; i++) {
        const bx = (seed * 31 * (i+1)) % W;
        const by = H * 0.3 + (seed * 13 * (i+1)) % (H * 0.4);
        const br = 20 + (seed * 7 * (i+1)) % 30;
        const alpha = 0.08 + Math.sin(f * 0.01 + i) * 0.02;
        ctx.beginPath();
        ctx.ellipse(bx, by, br, br * 0.6, 0, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${120+hue*0.1},50%,${12+i*2}%,${alpha})`;
        ctx.fill();
      }

      // Ground plane
      ctx.fillStyle = `hsl(${hue},15%,10%)`; ctx.fillRect(0, H*0.65, W, H*0.35);
      // Horizon line
      ctx.strokeStyle = `hsla(${hue},30%,30%,0.3)`; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(0,H*0.65); ctx.lineTo(W,H*0.65); ctx.stroke();

      // Moving "object" (simulated person/vehicle)
      const objX = ((f * (0.8 + seed * 0.1)) % (W + 60)) - 30;
      const objY = H * 0.58;
      ctx.fillStyle = `hsla(${hue},20%,60%,0.8)`;
      ctx.fillRect(objX, objY - 18, 10, 18);
      ctx.beginPath(); ctx.arc(objX + 5, objY - 22, 5, 0, Math.PI*2);
      ctx.fill();

      // Scanlines
      ctx.save(); ctx.globalAlpha = 0.04;
      for (let y = 0; y < H; y += 2) {
        ctx.fillStyle = "#000"; ctx.fillRect(0, y, W, 1);
      }
      ctx.restore();

      // Vignette
      const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
      vig.addColorStop(0, "transparent");
      vig.addColorStop(1, "rgba(0,0,0,0.5)");
      ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

      // Timestamp
      const now = new Date();
      const ts = `${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}:${now.getSeconds().toString().padStart(2,"0")}`;
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.font = "9px monospace"; ctx.textAlign = "right";
      ctx.fillText(ts, W - 8, H - 8);
      ctx.fillText(`${camId}`, 8 + camId.length * 5.4, H - 8);
      ctx.textAlign = "left";

      rafRef.current = requestAnimationFrame(drawFrame);
    }

    rafRef.current = requestAnimationFrame(drawFrame);
    return () => cancelAnimationFrame(rafRef.current);
  }, [camId, status]);

  return (
    <canvas ref={cvRef} style={{
      width:"100%", height:"100%", display:"block",
      imageRendering:"pixelated",
      filter: status==="warn" ? "sepia(0.3) hue-rotate(10deg)" : "none",
    }}/>
  );
}

// Playback timeline component
function PlaybackTimeline({ camId, onSeek }) {
  const [playing, setPlaying]     = React.useState(false);
  const [progress, setProgress]   = React.useState(0.35);
  const [speed, setSpeed]         = React.useState(1);
  const [selectedDate, setSelectedDate] = React.useState("2026-05-14");
  const rafRef = React.useRef(null);
  const tlRef  = React.useRef(null);

  // Fake events on timeline (motion events)
  const events = [
    {t:0.08, color:"var(--warn)",   label:"Motion"},
    {t:0.21, color:"var(--sage-2)", label:"Person"},
    {t:0.35, color:"var(--danger)", label:"Alert"},
    {t:0.52, color:"var(--warn)",   label:"Motion"},
    {t:0.73, color:"var(--sage-2)", label:"Person"},
    {t:0.88, color:"var(--warn)",   label:"Motion"},
  ];

  React.useEffect(() => {
    if (playing) {
      let last = null;
      function tick(ts) {
        if (last) {
          const dt = (ts - last) / 1000;
          setProgress(p => {
            const np = p + dt * speed * 0.01;
            if (np >= 1) { setPlaying(false); return 1; }
            return np;
          });
        }
        last = ts;
        rafRef.current = requestAnimationFrame(tick);
      }
      rafRef.current = requestAnimationFrame(tick);
    } else {
      cancelAnimationFrame(rafRef.current);
    }
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing, speed]);

  function handleTimelineClick(e) {
    const rect = tlRef.current.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    setProgress(p);
    onSeek && onSeek(p);
  }

  const timeFromProgress = (p) => {
    const h = Math.floor(p * 24);
    const m = Math.floor((p * 24 * 60) % 60);
    return `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}`;
  };

  return (
    <div style={{background:"var(--ink)",padding:"16px 18px",borderRadius:"0 0 12px 12px"}}>
      {/* Camera selector + date */}
      <div className="flex-cb mb-3">
        <div className="flex-c gap-2">
          <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"rgba(255,255,255,0.5)"}}>PLAYBACK</div>
          <Chip tone="">{camId}</Chip>
        </div>
        <div className="flex-c gap-2">
          <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}
            style={{fontFamily:"var(--f-mono)",fontSize:11,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:6,color:"rgba(255,255,255,0.7)",padding:"4px 8px",outline:"none"}}/>
          <button className="btn" style={{fontSize:11,padding:"4px 10px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)"}}>
            <I.Download size={11}/> Export
          </button>
        </div>
      </div>

      {/* Timeline */}
      <div ref={tlRef} className="playback-timeline" onClick={handleTimelineClick} style={{marginBottom:12}}>
        {/* Hour marks */}
        {Array.from({length:25}).map((_,i)=>(
          <div key={i} style={{position:"absolute",left:`${(i/24)*100}%`,top:0,bottom:0,borderLeft:"1px solid rgba(255,255,255,0.06)",pointerEvents:"none"}}>
            {i % 6 === 0 && <div style={{position:"absolute",bottom:2,left:2,fontFamily:"var(--f-mono)",fontSize:8,color:"rgba(255,255,255,0.3)"}}>{i.toString().padStart(2,"0")}</div>}
          </div>
        ))}
        <div className="playback-track">
          <div className="playback-filled" style={{width:`${progress*100}%`}}/>
        </div>
        {/* Events */}
        {events.map((ev,i)=>(
          <div key={i} className="playback-event" style={{left:`${ev.t*100}%`,background:ev.color,top:"50%",transform:"translateY(-50%)"}}
            title={`${ev.label} @ ${timeFromProgress(ev.t)}`}/>
        ))}
        {/* Playhead */}
        <div className="playback-head" style={{left:`calc(${progress*100}% - 6px)`}}/>
      </div>

      {/* Controls */}
      <div className="flex-cb">
        <div className="flex-c gap-2">
          <button className="icon-btn" style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)",width:32,height:32}}
            onClick={() => setProgress(p => Math.max(0, p - 0.04))}><I.SkipB size={14}/></button>
          <button onClick={() => setPlaying(v=>!v)} style={{width:40,height:40,borderRadius:"50%",background:"var(--sage-2)",border:"none",display:"grid",placeItems:"center",cursor:"pointer",color:"white",flexShrink:0}}>
            {playing ? <I.Pause size={18}/> : <I.Play size={18}/>}
          </button>
          <button className="icon-btn" style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.7)",width:32,height:32}}
            onClick={() => setProgress(p => Math.min(1, p + 0.04))}><I.SkipF size={14}/></button>
          <div style={{fontFamily:"var(--f-mono)",fontSize:13,color:"rgba(255,255,255,0.8)",marginLeft:8}}>
            {timeFromProgress(progress)}
          </div>
        </div>
        <div className="flex-c gap-2">
          <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.4)"}}>SPEED</span>
          {[0.5,1,2,4,8].map(s=>(
            <button key={s} onClick={()=>setSpeed(s)} style={{fontFamily:"var(--f-mono)",fontSize:10,padding:"3px 7px",borderRadius:5,background:speed===s?"rgba(255,255,255,0.18)":"transparent",border:`1px solid ${speed===s?"rgba(255,255,255,0.3)":"transparent"}`,color:speed===s?"white":"rgba(255,255,255,0.4)",cursor:"pointer"}}>
              {s}x
            </button>
          ))}
        </div>
      </div>

      {/* Event legend */}
      <div className="flex-c gap-4 mt-3" style={{paddingTop:10,borderTop:"1px solid rgba(255,255,255,0.08)"}}>
        {[{c:"var(--danger)",l:"Alert"},{c:"var(--warn)",l:"Motion"},{c:"var(--sage-2)",l:"Person Detected"}].map(x=>(
          <div key={x.l} className="flex-c gap-2">
            <div style={{width:8,height:8,borderRadius:2,background:x.c,flexShrink:0}}/>
            <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.5)"}}>{x.l}</span>
          </div>
        ))}
        <div style={{flex:1}}/>
        <span style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.3)"}}>คลิกบน Timeline เพื่อ Seek</span>
      </div>
    </div>
  );
}

                {selected===cam.id && layout==="1" && (
                  <div style={{position:"absolute",top:10,right:10,display:"flex",gap:6}}>
                    <button onClick={e=>{e.stopPropagation();handleSnapshot(cam);}} style={{background:"rgba(0,0,0,0.65)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,color:"white",padding:"5px 9px",fontSize:10,fontFamily:"var(--f-mono)",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
                      <I.Snapshot size={11}/> Snapshot
                    </button>
                    <button onClick={e=>{e.stopPropagation();setFullscreen(v=>!v);}} style={{background:"rgba(0,0,0,0.65)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:6,color:"white",padding:"5px 8px",fontSize:10,fontFamily:"var(--f-mono)",cursor:"pointer"}}>
                      <I.Maximize size={11}/>
                    </button>
                  </div>
                )}
              </div>
            ))}
            {/* Empty slots */}
            {Array.from({length: Math.max(0, displayCount - displayCams.length)}).map((_,i) => (
              <div key={`empty-${i}`} className="cctv-cell" style={{display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10,cursor:"default"}}>
                <I.Video size={24} stroke="rgba(255,255,255,0.1)"/>
                <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"rgba(255,255,255,0.1)"}}>ไม่มีกล้อง</div>
              </div>
            ))}
          </div>

          {/* Playback controls (only in playback mode) */}
          {mode === "playback" && selectedCam && (
            <PlaybackTimeline camId={selected} onSeek={(p) => {}}/>
          )}
        </div>

        {/* Right panel */}
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {/* Camera list */}
          <div className="card" style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"14px 16px",borderBottom:"1px solid var(--hair-2)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div className="card-title">กล้องทั้งหมด</div>
              <span className="nav-badge">{cameras.length}</span>
            </div>
            <div style={{maxHeight:360,overflowY:"auto"}}>
              {cameras.map((cam,i) => (
                <div key={cam.id}
                  onClick={() => { setSelected(cam.id); if(layout!=="1") setLayout("1"); }}
                  style={{
                    display:"flex",alignItems:"center",gap:12,padding:"12px 16px",
                    cursor:"pointer",borderBottom:i<cameras.length-1?"1px solid var(--hair-2)":"none",
                    background:selected===cam.id?"var(--cream)":"transparent",
                    transition:"background 0.1s",
                  }}>
                  <div style={{
                    width:36,height:36,borderRadius:9,flexShrink:0,display:"grid",placeItems:"center",
                    background:cam.status==="online"?"var(--sage-soft)":cam.status==="warn"?"var(--warn-soft)":"var(--danger-soft)",
                    color:cam.status==="online"?"var(--sage-2)":cam.status==="warn"?"var(--warn)":"var(--danger)",
                  }}>
                    <I.Video size={16}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,color:"var(--ink-2)",fontWeight:500,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{cam.name}</div>
                    <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)",marginTop:2}}>{cam.id} · โซน {cam.zone}</div>
                  </div>
                  <Chip tone={cam.status==="online"?"sage":cam.status==="warn"?"warn":"danger"} dot>
                    {cam.status==="online"?"Live":cam.status==="warn"?"Warn":"Off"}
                  </Chip>
                </div>
              ))}
            </div>
          </div>

          {/* Selected camera detail */}
          {selectedCam && (
            <div className="card">
              <div className="card-h">
                <div className="card-title">{selectedCam.name}</div>
                <Chip tone={selectedCam.status==="online"?"sage":selectedCam.status==="warn"?"warn":"danger"} dot>
                  {selectedCam.status}
                </Chip>
              </div>
              <div className="grid g-2" style={{gap:10,marginBottom:14}}>
                {[
                  {l:"Camera ID", v:selectedCam.id},
                  {l:"Zone", v:`โซน ${selectedCam.zone}`},
                  {l:"IP Address", v:selectedCam.ip},
                  {l:"Resolution", v:selectedCam.res},
                  {l:"Frame Rate", v:`${selectedCam.fps} fps`},
                  {l:"Model", v:selectedCam.model},
                ].map(x=>(
                  <div key={x.l} style={{background:"var(--cream)",padding:"8px 10px",borderRadius:7}}>
                    <div style={{fontFamily:"var(--f-mono)",fontSize:9,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.1em"}}>{x.l}</div>
                    <div style={{fontFamily:"var(--f-mono)",fontSize:12,marginTop:3,wordBreak:"break-all"}}>{x.v}</div>
                  </div>
                ))}
              </div>

              {/* Actions */}
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button className="btn" style={{fontSize:11,padding:"6px 10px",flex:1,justifyContent:"center"}}
                  onClick={() => handleSnapshot(selectedCam)}>
                  <I.Snapshot size={12}/> Snapshot
                </button>
                <button className="btn" style={{fontSize:11,padding:"6px 10px",flex:1,justifyContent:"center"}}
                  onClick={() => { setMode("playback"); pushToast(`เปิด Playback ${selectedCam.id}`,"success"); }}>
                  <I.SkipB size={12}/> Playback
                </button>
                <button className="btn" style={{fontSize:11,padding:"6px 10px",flex:1,justifyContent:"center"}}
                  onClick={() => toggleCamStatus(selectedCam.id)}>
                  <I.Power size={12}/> {selectedCam.status==="online"?"ปิด":"เปิด"}
                </button>
              </div>

              {/* PTZ Controls (only for PTZ cameras) */}
              {selectedCam.id.startsWith("PTZ") && (
                <div style={{marginTop:14,borderTop:"1px solid var(--hair-2)",paddingTop:14}}>
                  <div className="card-sub mb-3">PTZ Control</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,width:132,margin:"0 auto"}}>
                    {[
                      {d:"",     a:""},
                      {d:"up",   a:"▲"},
                      {d:"",     a:""},
                      {d:"left", a:"◄"},
                      {d:"home", a:"◉"},
                      {d:"right",a:"►"},
                      {d:"",     a:""},
                      {d:"down", a:"▼"},
                      {d:"",     a:""},
                    ].map((b,i)=>(
                      b.d ? (
                        <button key={i} onClick={() => handlePTZ(b.d)} style={{height:38,border:"1px solid var(--hair)",borderRadius:7,background:b.d==="home"?"var(--ink)":"var(--paper)",color:b.d==="home"?"white":"var(--ink-2)",cursor:"pointer",fontSize:14,display:"grid",placeItems:"center"}}>{b.a}</button>
                      ) : <div key={i}/>
                    ))}
                  </div>
                  <div className="flex-c gap-2 mt-3 center" style={{justifyContent:"center"}}>
                    <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)"}}>Pan: {ptzPan}° · Tilt: {ptzTilt}°</div>
                  </div>
                </div>
              )}

              {/* Stream URL */}
              <div style={{marginTop:14,padding:"10px 12px",background:"var(--cream)",borderRadius:8}}>
                <div style={{fontFamily:"var(--f-mono)",fontSize:9,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Stream URL (RTSP)</div>
                <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--ink-2)",wordBreak:"break-all"}}>
                  rtsp://{selectedCam.ip}:554/Streaming/Channels/101
                </div>
                <button className="btn mt-2" style={{fontSize:10,padding:"4px 10px"}} onClick={() => {
                  navigator.clipboard?.writeText(`rtsp://${selectedCam.ip}:554/Streaming/Channels/101`).catch(()=>{});
                  pushToast("คัดลอก URL แล้ว","success");
                }}><I.Export size={11}/> Copy URL</button>
              </div>
            </div>
          )}

          {/* Recording schedule */}
          <div className="card">
            <div className="card-h">
              <div className="card-title">ตารางบันทึก</div>
              <button className="btn" style={{fontSize:11,padding:"5px 10px"}} onClick={() => pushToast("บันทึกตาราง Recording แล้ว","success")}><I.Check size={11}/> บันทึก</button>
            </div>
            {[
              {l:"บันทึกตลอด 24 ชม.", on:true},
              {l:"บันทึกเมื่อตรวจจับ Motion", on:true},
              {l:"AI Person Detection", on:true},
              {l:"บันทึกเสียง", on:false},
            ].map((r,i)=>(
              <div key={i} className="flex-cb" style={{padding:"10px 0",borderBottom:i<3?"1px solid var(--hair-2)":"none"}}>
                <div className="small ink2">{r.l}</div>
                <Toggle on={r.on} onClick={() => pushToast(`${r.l}: ${r.on?"ปิด":"เปิด"}`,"success")}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

// Add CCTV Camera Modal
function AddCCTVModal({ onAdd }) {
  const [name, setName]   = React.useState("");
  const [ip,   setIp]     = React.useState("");
  const [zone, setZone]   = React.useState("A");
  const [model, setModel] = React.useState("");
  const [protocol, setProt] = React.useState("RTSP");
  const [res, setRes]     = React.useState("4MP");
  const [fps, setFps]     = React.useState(25);
  const [err, setErr]     = React.useState("");
  const [testing, setTest] = React.useState(null);

  function doTest() {
    if (!ip.trim()) { setErr("กรุณากรอก IP Address"); return; }
    setErr(""); setTest("loading");
    setTimeout(() => setTest("ok"), 1800 + Math.random()*700);
  }

  function doSave() {
    if (!name.trim()) { setErr("กรุณากรอกชื่อกล้อง"); return; }
    if (!ip.trim())   { setErr("กรุณากรอก IP Address"); return; }
    const idx = Math.floor(Math.random()*900+100);
    onAdd({ id:`CAM-${zone}${String(idx).slice(-2)}`, name:name.trim(), zone, ip, port:"554", protocol, status:"online", fps, res, model:model||"IP Camera" });
    popModal();
  }

  return (
    <Modal title="เพิ่มกล้อง CCTV" sub="เชื่อมต่อกล้องเข้าระบบ SmartFarm"
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button>
        {testing!=="ok"&&<button className="btn" onClick={doTest} disabled={testing==="loading"}>{testing==="loading"?"กำลังทดสอบ…":"ทดสอบการเชื่อมต่อ"}</button>}
        {testing==="ok"&&<button className="btn primary" onClick={doSave}><I.Video size={14}/> เพิ่มกล้อง</button>}
      </>}>
      {err&&<div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}
      {testing==="ok"&&<div style={{background:"var(--sage-soft)",color:"var(--sage-2)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>✓ เชื่อมต่อสำเร็จ — กรอกข้อมูลแล้วกด เพิ่มกล้อง</div>}
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}><label>ชื่อกล้อง *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น CAM-A01 ทางเข้า"/></div>
        <div className="field" style={{margin:0}}><label>รุ่น / Model</label><input value={model} onChange={e=>setModel(e.target.value)} placeholder="เช่น Hikvision DS-2CD2143G2"/></div>
      </div>
      <div className="grid g-2" style={{gap:12,marginTop:12}}>
        <div className="field" style={{margin:0}}><label>IP Address *</label><input value={ip} onChange={e=>setIp(e.target.value)} placeholder="192.168.1.xxx" style={{fontFamily:"var(--f-mono)"}}/></div>
        <div className="field" style={{margin:0}}>
          <label>โปรโตคอล</label>
          <div className="flex gap-2">
            {["RTSP","ONVIF","HTTP"].map(p=>(
              <div key={p} onClick={()=>setProt(p)} style={{flex:1,border:`1px solid ${protocol===p?"var(--ink)":"var(--hair)"}`,background:protocol===p?"var(--ink)":"var(--paper)",color:protocol===p?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:11,cursor:"pointer",textAlign:"center",fontFamily:"var(--f-mono)"}}>{p}</div>
            ))}
          </div>
        </div>
      </div>
      <div className="field mt-3">
        <label>โซน</label>
        <div className="flex gap-2">
          {FARM_ZONES.map(z=>(
            <div key={z.id} onClick={()=>setZone(z.id)} style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>โซน {z.id}</div>
          ))}
        </div>
      </div>
      <div className="grid g-2" style={{gap:12,marginTop:12}}>
        <div className="field" style={{margin:0}}>
          <label>ความละเอียด</label>
          <select value={res} onChange={e=>setRes(e.target.value)} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
            {["2MP","4MP","8MP","12MP","640px"].map(r=><option key={r}>{r}</option>)}
          </select>
        </div>
        <div className="field" style={{margin:0}}>
          <label>Frame Rate (fps)</label>
          <select value={fps} onChange={e=>setFps(parseInt(e.target.value))} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
            {[9,15,20,25,30].map(f=><option key={f}>{f}</option>)}
          </select>
        </div>
      </div>
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
