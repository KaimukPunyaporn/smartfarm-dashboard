<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SmartFarm · Kaimuk Monitoring Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Serif+Thai:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
/* SmartFarm — Japanese minimal design tokens */
:root {
  /* surfaces */
  --cream: #F4F1EA;
  --cream-2: #EEEAE0;
  --paper: #FBFAF7;
  --paper-2: #FFFFFF;

  /* ink */
  --ink: #1F1E1B;
  --ink-2: #3A3934;
  --muted: #76746C;
  --muted-2: #9C9A91;
  --hair: #DBD6CB;
  --hair-2: #E8E4D9;

  /* sage primary */
  --sage: oklch(0.72 0.045 145);
  --sage-2: oklch(0.62 0.06 145);
  --sage-soft: oklch(0.92 0.025 145);

  /* alert tones (subtle, never saturated) */
  --warn: oklch(0.74 0.09 70);
  --warn-soft: oklch(0.94 0.04 70);
  --danger: oklch(0.62 0.13 25);
  --danger-soft: oklch(0.94 0.04 25);
  --info: oklch(0.7 0.05 240);
  --info-soft: oklch(0.94 0.025 240);

  /* type */
  --f-sans: "IBM Plex Sans Thai", "IBM Plex Sans", system-ui, sans-serif;
  --f-serif: "IBM Plex Serif Thai", "IBM Plex Serif", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--f-sans);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* layout shell */
.app {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: var(--paper);
  border-right: 1px solid var(--hair);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}
.sidebar-header {
  flex-shrink: 0;
  padding: 22px 18px 0;
}
.sidebar-menu {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 18px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--hair) transparent;
}
.sidebar-menu::-webkit-scrollbar { width: 4px; }
.sidebar-menu::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }
.sidebar-footer {
  flex-shrink: 0;
  padding: 0 18px 18px;
  border-top: 1px solid var(--hair-2);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0 18px;
  border-bottom: 1px solid var(--hair-2);
  margin-bottom: 14px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--sage);
  display: grid; place-items: center;
  color: var(--paper);
}
.brand-name {
  font-family: var(--f-serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: -2px;
}

.nav-group-label {
  font-size: 10px;
  color: var(--muted-2);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 14px 8px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 13px;
  transition: background 120ms ease, color 120ms ease;
  position: relative;
  user-select: none;
}
.nav-item:hover { background: var(--cream); }
.nav-item.active {
  background: var(--ink);
  color: var(--paper);
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.15); color: var(--paper); }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
.nav-label { flex: 1; }
.nav-badge {
  font-family: var(--f-mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--cream-2);
  color: var(--muted);
}

/* topbar */
.topbar {
  height: 60px;
  background: var(--paper);
  border-bottom: 1px solid var(--hair);
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.crumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--muted);
}
.crumb .sep { color: var(--muted-2); }
.crumb .cur { color: var(--ink); }
.topbar-spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--cream);
  border: 1px solid var(--hair-2);
  border-radius: 8px;
  padding: 6px 10px;
  width: 260px;
  color: var(--muted);
  font-size: 12px;
}
.search input {
  border: none; background: transparent; outline: none;
  font-family: var(--f-sans); font-size: 12px; color: var(--ink);
  width: 100%;
}
.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 8px;
  border: 1px solid var(--hair-2);
  background: var(--paper);
  cursor: pointer;
  color: var(--ink-2);
  position: relative;
}
.icon-btn:hover { background: var(--cream); }
.icon-btn .dot {
  position: absolute; top: 7px; right: 7px;
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--danger);
}
.avatar {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  border: 1px solid var(--hair-2);
  cursor: pointer;
}
.avatar-img {
  width: 28px; height: 28px; border-radius: 999px;
  background: var(--sage-soft);
  display: grid; place-items: center;
  font-family: var(--f-serif);
  font-weight: 500;
  color: var(--sage-2);
  font-size: 12px;
}
.avatar-name { font-size: 12px; color: var(--ink); }
.avatar-role { font-size: 10px; color: var(--muted); }

/* main */
.main { padding: 24px 28px 64px; }
.page-head {
  display: flex; align-items: flex-end; gap: 20px;
  padding-bottom: 18px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--hair-2);
}
.page-head h1 {
  font-family: var(--f-serif);
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.015em;
  margin: 0 0 4px;
  line-height: 1.1;
}
.page-head .meta {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--f-mono);
}
.page-head .spacer { flex: 1; }
.page-head .actions { display: flex; gap: 8px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 12px;
  cursor: pointer;
  transition: background 120ms;
}
.btn:hover { background: var(--cream); }
.btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn.primary:hover { background: var(--ink-2); }
.btn.sage {
  background: var(--sage);
  color: var(--paper);
  border-color: var(--sage);
}
.btn.sage:hover { background: var(--sage-2); }
.btn.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
}
.btn.danger {
  background: var(--danger);
  color: var(--paper);
  border-color: var(--danger);
}

/* cards */
.card {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 12px;
  padding: 18px;
}
.card-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-family: var(--f-serif);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.card-sub {
  font-size: 11px;
  color: var(--muted);
  font-family: var(--f-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* KPI */
.kpi {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  overflow: hidden;
}
.kpi-row { display: flex; align-items: center; justify-content: space-between; }
.kpi-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.kpi-icon {
  width: 26px; height: 26px;
  border-radius: 6px;
  background: var(--sage-soft);
  color: var(--sage-2);
  display: grid; place-items: center;
}
.kpi-value {
  font-family: var(--f-mono);
  font-size: 30px;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.1;
}
.kpi-unit { font-size: 13px; color: var(--muted); margin-left: 4px; }
.kpi-delta {
  font-size: 11px;
  font-family: var(--f-mono);
  display: inline-flex; align-items: center; gap: 4px;
}
.kpi-delta.up { color: var(--sage-2); }
.kpi-delta.down { color: var(--danger); }
.kpi-spark { margin-top: 4px; height: 36px; }

/* tag/chip */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--f-mono);
  background: var(--cream);
  border: 1px solid var(--hair-2);
  color: var(--ink-2);
}
.chip.sage { background: var(--sage-soft); border-color: transparent; color: var(--sage-2); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.chip .ddot {
  width: 6px; height: 6px; border-radius: 999px; background: currentColor;
}

/* table */
.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
.tbl th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--hair-2);
  background: transparent;
}
.tbl td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--hair-2);
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--cream); }
.tbl .mono { font-family: var(--f-mono); }

/* segmented */
.seg {
  display: inline-flex;
  padding: 3px;
  background: var(--cream);
  border-radius: 8px;
  border: 1px solid var(--hair-2);
}
.seg button {
  border: none;
  background: transparent;
  padding: 5px 12px;
  font-family: var(--f-sans);
  font-size: 12px;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
}
.seg button.on {
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* toggle */
.toggle {
  width: 38px; height: 22px;
  background: var(--hair);
  border-radius: 999px;
  position: relative;
  cursor: pointer;
  transition: background 160ms ease;
  flex-shrink: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  background: var(--paper);
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  transition: left 180ms ease;
}
.toggle.on { background: var(--sage); }
.toggle.on::after { left: 18px; }

/* grids */
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.g-1-2 { grid-template-columns: 1fr 2fr; }
.g-8 { grid-template-columns: repeat(8, minmax(0,1fr)); }

/* progress bar */
.bar {
  height: 4px;
  background: var(--hair-2);
  border-radius: 999px;
  overflow: hidden;
}
.bar > span {
  display: block;
  height: 100%;
  background: var(--sage);
  border-radius: inherit;
}

/* alerts */
.alert-row {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--hair-2);
  align-items: center;
}
.alert-row:last-child { border-bottom: none; }
.alert-dot {
  width: 8px; height: 8px; border-radius: 999px;
  background: var(--muted-2);
}
.alert-dot.danger { background: var(--danger); }
.alert-dot.warn { background: var(--warn); }
.alert-dot.info { background: var(--info); }
.alert-title { font-size: 13px; color: var(--ink); }
.alert-meta { font-size: 11px; color: var(--muted); font-family: var(--f-mono); margin-top: 2px; }
.alert-time { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }

/* divider */
.hr { height: 1px; background: var(--hair-2); margin: 16px 0; }
.vhr { width: 1px; background: var(--hair-2); align-self: stretch; }

/* utilities */
.mono { font-family: var(--f-mono); }
.serif { font-family: var(--f-serif); }
.muted { color: var(--muted); }
.muted2 { color: var(--muted-2); }
.ink2 { color: var(--ink-2); }
.tiny { font-size: 11px; }
.small { font-size: 12px; }
.large { font-size: 16px; }
.bold { font-weight: 500; }
.uc { text-transform: uppercase; letter-spacing: 0.1em; }
.right { text-align: right; }
.center { text-align: center; }
.flex { display: flex; }
.flex-c { display: flex; align-items: center; }
.flex-cb { display: flex; align-items: center; justify-content: space-between; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.w-full { width: 100%; }

/* login */
.login-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 460px;
  background: var(--cream);
}
.login-art {
  position: relative;
  background:
    radial-gradient(900px 600px at 30% 30%, oklch(0.93 0.04 145) 0%, transparent 60%),
    radial-gradient(700px 500px at 80% 80%, oklch(0.95 0.03 70) 0%, transparent 60%),
    var(--cream);
  padding: 40px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid var(--hair);
  overflow: hidden;
}
.login-form-wrap {
  background: var(--paper);
  display: grid;
  place-items: center;
  padding: 40px;
}

/* form */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.field input, .field select, .field textarea {
  font-family: var(--f-sans);
  font-size: 14px;
  padding: 11px 12px;
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 8px;
  color: var(--ink);
  outline: none;
  transition: border 120ms ease, background 120ms ease;
}
.field input:focus { border-color: var(--sage-2); background: var(--paper-2); }

/* charts svg defaults */
.spark path, .chart path { fill: none; }
.grid-line { stroke: var(--hair-2); stroke-width: 1; stroke-dasharray: 2 4; }

/* sensor card */
.sensor-card {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sensor-h { display: flex; align-items: center; justify-content: space-between; }
.sensor-name { font-size: 13px; color: var(--ink-2); }
.sensor-id { font-size: 10px; color: var(--muted-2); font-family: var(--f-mono); }
.sensor-val {
  font-family: var(--f-mono);
  font-size: 34px;
  font-weight: 300;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1;
}
.sensor-val .u { font-size: 14px; color: var(--muted); margin-left: 4px; }
.sensor-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--f-mono); }

/* device card */
.device-card {
  background: var(--paper-2);
  border: 1px solid var(--hair-2);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.device-card.on { border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
.device-state {
  font-family: var(--f-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* heatmap dot */
.pin {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 26px; height: 26px;
  border-radius: 999px;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  display: grid; place-items: center;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--ink);
  cursor: pointer;
}
.pin.sage { background: var(--sage); color: var(--paper); border-color: var(--sage-2); }
.pin.warn { background: var(--warn); color: var(--paper); border-color: var(--warn); }
.pin.danger { background: var(--danger); color: var(--paper); border-color: var(--danger); }

/* scroll bar subtle */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 8px; border: 2px solid var(--cream); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(31,30,27,0.45);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: grid; place-items: center;
  animation: fade-in 120ms ease;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper);
  border: 1px solid var(--hair);
  border-radius: 16px;
  padding: 28px;
  width: 480px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,0.18);
  animation: slide-up 160ms ease;
}
.modal.wide { width: 640px; }
@keyframes slide-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 22px;
}
.modal-title {
  font-family: var(--f-serif);
  font-size: 20px; font-weight: 500;
  letter-spacing: -0.01em;
}
.modal-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: var(--f-mono); }
.modal-close {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 8px; border: 1px solid var(--hair-2);
  background: transparent; cursor: pointer; color: var(--muted);
  flex-shrink: 0; margin-left: 12px;
}
.modal-close:hover { background: var(--cream); }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 24px; padding-top: 18px;
  border-top: 1px solid var(--hair-2);
}

/* toast notification */
.toast-wrap {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 2000; display: flex; flex-direction: column; gap: 10px;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  animation: slide-up 180ms ease;
  max-width: 340px;
}
.toast.success { background: var(--sage-2); }
.toast.danger { background: var(--danger); }
.toast.warn { background: var(--warn); color: var(--ink); }

/* confirm dialog */
.confirm-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: grid; place-items: center;
  margin-bottom: 16px;
}
.confirm-icon.danger { background: var(--danger-soft); color: var(--danger); }
.confirm-icon.warn { background: var(--warn-soft); color: var(--warn); }

/* responsive small */
@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .g-8 { grid-template-columns: repeat(4, minmax(0,1fr)); }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .login-shell { grid-template-columns: 1fr; }
  .g-2-1, .g-1-2, .g-2 { grid-template-columns: 1fr; }
  .g-4, .g-3 { grid-template-columns: 1fr; }
  .g-8 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .main { padding: 16px 14px 64px; }
  .topbar { padding: 0 14px; }
  .page-head { flex-wrap: wrap; gap: 12px; }
  .page-head .actions { flex-wrap: wrap; gap: 6px; }
  .search { width: 100%; max-width: none; }
  .tbl th, .tbl td { padding: 10px 8px; font-size: 12px; }
}

/* Mobile Drawer */
.mobile-overlay {
  position: fixed; inset: 0; background: rgba(31,30,27,0.5);
  z-index: 900; display: none;
  animation: fade-in 200ms ease;
}
.mobile-overlay.open { display: block; }
.mobile-drawer {
  position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
  background: var(--paper); border-right: 1px solid var(--hair);
  z-index: 901; display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 240ms cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
.mobile-drawer.open { transform: translateX(0); }
.hamburger {
  display: none;
  flex-direction: column; justify-content: center; align-items: center;
  gap: 4.5px; width: 34px; height: 34px;
  cursor: pointer; padding: 6px; border-radius: 8px;
  border: 1px solid var(--hair-2); background: var(--paper);
}
.hamburger span {
  display: block; width: 16px; height: 1.5px;
  background: var(--ink); border-radius: 2px;
  transition: all 180ms ease;
}
@media (max-width: 720px) { .hamburger { display: flex; } }

/* CCTV page styles */
.cctv-grid { display: grid; gap: 3px; background: #0a0f0a; }
.cctv-grid.layout-1 { grid-template-columns: 1fr; }
.cctv-grid.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.cctv-grid.layout-9 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.cctv-cell {
  position: relative; background: #0d160d; overflow: hidden;
  cursor: pointer; min-height: 180px;
}
.cctv-cell.selected { outline: 2px solid var(--sage); outline-offset: -2px; z-index: 2; }
.cctv-noise {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; opacity: 0.6;
}
.cctv-overlay {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);
}
.cctv-badge {
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px; padding: 4px 8px;
  font-family: var(--f-mono); font-size: 10px;
  color: rgba(255,255,255,0.85); display: flex; align-items: center; gap: 6px;
  backdrop-filter: blur(4px);
}
.cctv-live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #ff3333;
  animation: blink 1s ease-in-out infinite;
}
.cctv-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 12px;
  font-family: var(--f-mono); font-size: 10px; color: rgba(255,255,255,0.7);
  display: flex; align-items: center; justify-content: space-between;
}
.cctv-time {
  position: absolute; top: 10px; right: 10px;
  font-family: var(--f-mono); font-size: 10px; color: rgba(255,255,255,0.6);
}
.playback-timeline {
  position: relative; height: 48px; background: #111;
  border-radius: 6px; overflow: hidden; cursor: pointer;
}
.playback-track {
  position: absolute; top: 50%; transform: translateY(-50%);
  left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.1);
  border-radius: 2px;
}
.playback-filled {
  position: absolute; left: 0; height: 100%;
  background: var(--sage-2); border-radius: 2px;
  transition: width 0.5s linear;
}
.playback-head {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--sage-2);
  box-shadow: 0 0 8px rgba(0,0,0,0.5);
  transition: left 0.5s linear;
}
.playback-event {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 3px; height: 16px; border-radius: 2px;
}
.cctv-canvas-bg {
  width: 100%; height: 100%;
  image-rendering: pixelated;
}
/* Scan line effect on cameras */
.cctv-scanlines::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
}

/* Loading skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--hair-2) 25%, var(--cream-2) 50%, var(--hair-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 6px;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Button disabled state */
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn:disabled:hover { background: var(--paper); }
.btn.primary:disabled:hover { background: var(--ink); }

/* Global search results */
.search-results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: var(--paper); border: 1px solid var(--hair);
  border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  z-index: 600; max-height: 360px; overflow-y: auto;
}
.search-result-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 13px;
}
.search-result-item:hover { background: var(--cream); }
.search-result-item + .search-result-item { border-top: 1px solid var(--hair-2); }
/* pin-mode banner */
.pin-mode-banner {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; font-family: var(--f-mono); font-size: 12px;
  animation: slide-up 160ms ease;
}
.pin-mode-banner .pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #44ff88;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.pin-cursor * { cursor: crosshair !important; }
.map-pin-marker {
  position: absolute; transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10;
}
.map-pin-marker .ph {
  width: 22px; height: 22px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); display: grid; place-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35); transition: transform 0.15s;
}
.map-pin-marker:hover .ph { transform: rotate(-45deg) scale(1.2); }
.map-pin-marker .pl {
  background: var(--ink); color: var(--paper);
  font-family: var(--f-mono); font-size: 9px; padding: 2px 6px;
  border-radius: 4px; margin-top: 3px; white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

</style>

// ---------- helpers ----------
const cx = (...c) => c.filter(Boolean).join(" ");
const rnd = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }; };

// generate smooth sparkline series
function series(seed, n = 36, min = 20, max = 80, drift = 0) {
  const r = rnd(seed);
  const out = [];
  let v = (min + max) / 2;
  for (let i = 0; i < n; i++) {
    v += (r() - 0.5) * (max - min) * 0.12 + drift;
    v = Math.max(min, Math.min(max, v));
    out.push(v);
  }
  return out;
}

// build SVG path from points
function linePath(data, w, h, padY = 4) {
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const step = w / (data.length - 1);
  return data.map((v, i) => {
    const x = i * step;
    const y = padY + (h - padY * 2) * (1 - (v - min) / rng);
    return `${i === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`;
  }).join(" ");
}

function areaPath(data, w, h, padY = 4) {
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((v, i) => {
    const x = i * step;
    const y = padY + (h - padY * 2) * (1 - (v - min) / rng);
    return `${x.toFixed(2)} ${y.toFixed(2)}`;
  });
  return `M${pts[0]} L${pts.slice(1).join(" L")} L${w} ${h} L0 ${h} Z`;
}

// ---------- COMPONENTS ----------

function Sparkline({ data, w = 220, h = 40, color = "var(--sage-2)", fill = "var(--sage-soft)" }) {
  return (
    <svg className="spark" width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <path d={areaPath(data, w, h)} fill={fill} opacity="0.6" />
      <path d={linePath(data, w, h)} stroke={color} strokeWidth="1.5" />
    </svg>
  );
}

function Chart({ data, w = 600, h = 220, color = "var(--sage-2)", fill = "var(--sage-soft)", yLabel, xLabels, showGrid = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const padL = 40, padR = 10, padT = 14, padB = 24;
  const cw = w - padL - padR;
  const ch = h - padT - padB;
  const linePts = data.map((v, i) => {
    const x = padL + (i * cw) / (data.length - 1);
    const y = padT + ch * (1 - (v - min) / (max - min || 1));
    return [x, y];
  });
  const linePath = "M" + linePts.map(p => p.map(n => n.toFixed(1)).join(" ")).join(" L");
  const areaPath = linePath + ` L ${(padL + cw).toFixed(1)} ${(padT + ch).toFixed(1)} L ${padL.toFixed(1)} ${(padT + ch).toFixed(1)} Z`;
  const yTicks = 4;

  return (
    <svg className="chart" width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {showGrid && Array.from({ length: yTicks + 1 }).map((_, i) => {
        const y = padT + (ch * i) / yTicks;
        const val = max - ((max - min) * i) / yTicks;
        return (
          <g key={i}>
            <line x1={padL} y1={y} x2={padL + cw} y2={y} className="grid-line" />
            <text x={padL - 6} y={y + 3} textAnchor="end" fontSize="9" fontFamily="var(--f-mono)" fill="var(--muted)">{val.toFixed(0)}</text>
          </g>
        );
      })}
      {xLabels && xLabels.map((lab, i) => {
        const x = padL + (i * cw) / (xLabels.length - 1);
        return <text key={i} x={x} y={h - 8} textAnchor="middle" fontSize="9" fontFamily="var(--f-mono)" fill="var(--muted)">{lab}</text>;
      })}
      <path d={areaPath} fill={fill} opacity="0.5" />
      <path d={linePath} stroke={color} strokeWidth="1.5" fill="none" />
      {linePts.map((p, i) => i % 6 === 0 && <circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill="var(--paper)" stroke={color} strokeWidth="1.2" />)}
    </svg>
  );
}

function Donut({ value, max = 100, size = 80, color = "var(--sage)", track = "var(--hair-2)" }) {
  const r = size / 2 - 6;
  const c = 2 * Math.PI * r;
  const off = c * (1 - value / max);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth="6" fill="none" />
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth="6" fill="none"
              strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}
              transform={`rotate(-90 ${size/2} ${size/2})`} />
      <text x={size/2} y={size/2 + 4} textAnchor="middle" fontFamily="var(--f-mono)" fontSize="16" fill="var(--ink)">{value}</text>
    </svg>
  );
}

function Toggle({ on, onClick }) {
  return <div className={cx("toggle", on && "on")} onClick={onClick} />;
}

function Chip({ tone = "", children, dot = false }) {
  return <span className={cx("chip", tone)}>{dot && <span className="ddot" />}{children}</span>;
}

function Seg({ options, value, onChange }) {
  return (
    <div className="seg">
      {options.map(o => (
        <button key={o.v} className={cx(value === o.v && "on")} onClick={() => onChange(o.v)}>{o.l}</button>
      ))}
    </div>
  );
}

// ========== MODAL + TOAST SYSTEM ==========

// Global state via window (cross-script)
window._modalStack = window._modalStack || [];
window._toasts = window._toasts || [];
window._modalSetters = window._modalSetters || [];
window._toastSetters = window._toastSetters || [];

function pushModal(el) {
  window._modalStack.push(el);
  window._modalSetters.forEach(fn => fn([...window._modalStack]));
}
function popModal() {
  window._modalStack.pop();
  window._modalSetters.forEach(fn => fn([...window._modalStack]));
}
function pushToast(msg, tone = "success", duration = 2800) {
  const id = Date.now() + Math.random();
  window._toasts.push({ id, msg, tone });
  window._toastSetters.forEach(fn => fn([...window._toasts]));
  setTimeout(() => {
    window._toasts = window._toasts.filter(t => t.id !== id);
    window._toastSetters.forEach(fn => fn([...window._toasts]));
  }, duration);
}
window.pushModal = pushModal;
window.popModal  = popModal;
window.pushToast = pushToast;

function ModalRoot() {
  const [stack, setStack] = React.useState([]);
  React.useEffect(() => {
    window._modalSetters.push(setStack);
    return () => { window._modalSetters = window._modalSetters.filter(f => f !== setStack); };
  }, []);
  if (!stack.length) return null;
  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) popModal(); }}>
      {stack[stack.length - 1]}
    </div>
  );
}

function ToastRoot() {
  const [toasts, setToasts] = React.useState([]);
  React.useEffect(() => {
    window._toastSetters.push(setToasts);
    return () => { window._toastSetters = window._toastSetters.filter(f => f !== setToasts); };
  }, []);
  if (!toasts.length) return null;
  const icons = { success: <I.Check size={15}/>, danger: <I.Alert size={15}/>, warn: <I.Alert size={15}/>, default: <I.Bell size={15}/> };
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={cx("toast", t.tone)}>
          {icons[t.tone] || icons.default}
          <span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}

function Modal({ title, sub, wide, children, footer }) {
  return (
    <div className={cx("modal", wide && "wide")} onClick={e => e.stopPropagation()}>
      <div className="modal-head">
        <div>
          <div className="modal-title">{title}</div>
          {sub && <div className="modal-sub">{sub}</div>}
        </div>
        <button className="modal-close" onClick={popModal}>✕</button>
      </div>
      {children}
      {footer && <div className="modal-footer">{footer}</div>}
    </div>
  );
}
window.Modal = Modal;

function ConfirmModal({ icon, tone = "danger", title, desc, confirmLabel = "ยืนยัน", onConfirm }) {
  return (
    <Modal title=" " footer={
      <>
        <button className="btn" onClick={popModal}>ยกเลิก</button>
        <button className={cx("btn", tone)} onClick={() => { popModal(); onConfirm && onConfirm(); }}>{confirmLabel}</button>
      </>
    }>
      <div className={cx("confirm-icon", tone)}>{icon}</div>
      <div className="serif" style={{fontSize: 18, marginBottom: 8}}>{title}</div>
      <div className="muted small">{desc}</div>
    </Modal>
  );
}
window.ConfirmModal = ConfirmModal;

Object.assign(window, {
  cx, rnd, series, linePath, areaPath,
  I, Sparkline, Chart, Donut, Toggle, Chip, Seg,
  FARM_ZONES, SENSORS, DEVICES, ALERTS, USERS, ROLE_PERMS, AUTOMATIONS, REPORTS,
  ModalRoot, ToastRoot, Modal, ConfirmModal, pushModal, popModal, pushToast
});

<script type="text/babel" data-presets="env-react">
/* SmartFarm — Login + Dashboard + Sensors + Devices */

// ============ LOGIN ============
function LoginPage({ onLogin }) {
  const [email,    setEmail]    = React.useState("");
  const [pw,       setPw]       = React.useState("");
  const [loading,  setLoading]  = React.useState(false);
  const [gLoading, setGLoading] = React.useState(false);
  const [err,      setErr]      = React.useState("");
  const [mode,     setMode]     = React.useState("login");
  const [sent,     setSent]     = React.useState(false);

  const getSb = () => window._supabase || null;

  function handleEmailLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (!email.trim()) { setErr("กรุณากรอกอีเมล"); return; }
    if (!pw.trim())    { setErr("กรุณากรอกรหัสผ่าน"); return; }
    const sb = getSb();
    if (!sb) { setErr("ยังไม่ได้ตั้งค่า Supabase — กรอก URL และ Key หรือใช้ Demo ก่อน"); return; }
    setLoading(true); setErr("");
    sb.auth.signInWithPassword({ email: email.trim(), password: pw })
      .then(res => {
        if (res.error) {
          setErr(res.error.message === "Invalid login credentials" ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง" : res.error.message);
          setLoading(false); return;
        }
        upsertProfile(sb, res.data.user);
        fetchRole(sb, res.data.user).then(role => {
          setLoading(false);
          onLogin({ ...res.data.user, _role: role });
        });
      })
      .catch(e => { setErr(e.message); setLoading(false); });
  }

  function handleRegister() {
    if (!email.trim() || !pw.trim()) { setErr("กรุณากรอกอีเมลและรหัสผ่าน"); return; }
    if (pw.length < 6) { setErr("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"); return; }
    const sb = getSb();
    if (!sb) { setErr("ยังไม่ได้ตั้งค่า Supabase"); return; }
    setLoading(true); setErr("");
    sb.auth.signUp({ email: email.trim(), password: pw })
      .then(res => {
        setLoading(false);
        if (res.error) { setErr(res.error.message); return; }
        if (res.data.user && !res.data.user.email_confirmed_at) { setSent(true); }
        else if (res.data.user) { upsertProfile(sb, res.data.user); onLogin(res.data.user); }
      })
      .catch(e => { setErr(e.message); setLoading(false); });
  }

  function handleReset() {
    if (!email.trim()) { setErr("กรุณากรอกอีเมล"); return; }
    const sb = getSb();
    if (!sb) { setErr("ยังไม่ได้ตั้งค่า Supabase"); return; }
    setLoading(true); setErr("");
    sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin })
      .then(res => {
        setLoading(false);
        if (res.error) setErr(res.error.message); else setSent(true);
      })

// ---- Sensor Modals ----
function AddSensorModal({ onAdd }) {
  const [id, setId]       = React.useState("");
  const [name, setName]   = React.useState("");
  const [kind, setKind]   = React.useState("temperature");
  const [zone, setZone]   = React.useState("A");
  const [unit, setUnit]   = React.useState("°C");
  const [minV, setMinV]   = React.useState("20");
  const [maxV, setMaxV]   = React.useState("40");
  const [err, setErr]     = React.useState("");

  const KINDS = [
    { v:"temperature", l:"Temperature", u:"°C", icon:"Temp" },
    { v:"humidity",    l:"Humidity",    u:"%",  icon:"Drop" },
    { v:"soil",        l:"Soil Moisture", u:"%", icon:"Leaf" },
    { v:"ph",          l:"pH Value",    u:"pH", icon:"Beaker" },
    { v:"ec",          l:"EC Value",    u:"mS/cm", icon:"Beaker" },
    { v:"light",       l:"Light",       u:"klx", icon:"Sun" },
    { v:"co2",         l:"CO₂ Level",   u:"ppm", icon:"Cloud" },
    { v:"water",       l:"Water Level", u:"%",  icon:"Wave" },
  ];
  React.useEffect(() => {
    const k = KINDS.find(k => k.v === kind);
    if (k) setUnit(k.u);
  }, [kind]);

  function handleSubmit() {
    if (!id.trim()) return setErr("กรุณากรอกรหัสเซ็นเซอร์");
    if (!name.trim()) return setErr("กรุณากรอกชื่อเซ็นเซอร์");
    const k = KINDS.find(k => k.v === kind);
    const newSensor = {
      id: id.toUpperCase(), kind, name, unit,
      value: parseFloat(((parseFloat(minV) + parseFloat(maxV)) / 2).toFixed(1)),
      range: [parseFloat(minV), parseFloat(maxV)],
      zone, icon: k?.icon || "Sensor",
      series: series(id, 36, parseFloat(minV), parseFloat(maxV)),
    };
    onAdd(newSensor);
    popModal();
  }

  return (
    <Modal title="เพิ่มเซ็นเซอร์ใหม่" sub="กรอกข้อมูลเซ็นเซอร์ IoT ที่ต้องการเพิ่ม"
      footer={<><button className="btn" onClick={popModal}>ยกเลิก</button><button className="btn primary" onClick={handleSubmit}><I.Plus size={14}/> เพิ่มเซ็นเซอร์</button></>}
    >
      {err && <div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"10px 14px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}>
          <label>รหัสเซ็นเซอร์ *</label>
          <input value={id} onChange={e=>setId(e.target.value)} placeholder="เช่น TMP-05"/>
        </div>
        <div className="field" style={{margin:0}}>
          <label>ชื่อแสดง *</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="เช่น Temperature Zone E"/>
        </div>
      </div>
      <div className="field mt-3">
        <label>ประเภทเซ็นเซอร์</label>
        <select value={kind} onChange={e=>setKind(e.target.value)} style={{fontFamily:"var(--f-sans)",fontSize:14,padding:"11px 12px",background:"var(--paper)",border:"1px solid var(--hair)",borderRadius:8,color:"var(--ink)",outline:"none"}}>
          {KINDS.map(k => <option key={k.v} value={k.v}>{k.l} ({k.u})</option>)}
        </select>
      </div>
      <div className="field">
        <label>โซน</label>
        <div className="flex gap-2">
          {FARM_ZONES.map(z => (
            <div key={z.id} onClick={() => setZone(z.id)}
                 style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"8px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>
              โซน {z.id}
            </div>
          ))}
        </div>
      </div>
      <div className="grid g-2" style={{gap:12}}>
        <div className="field" style={{margin:0}}>
          <label>ค่าต่ำสุด (min)</label>
          <input type="number" value={minV} onChange={e=>setMinV(e.target.value)}/>
        </div>
        <div className="field" style={{margin:0}}>
          <label>ค่าสูงสุด (max)</label>
          <input type="number" value={maxV} onChange={e=>setMaxV(e.target.value)}/>
        </div>
      </div>
    </Modal>
  );
}

          <I.Device size={32}/>

          <div className="small mt-2">ลองเปลี่ยนตัวกรอง หรือ<button className="btn" style={{marginLeft:8,padding:"4px 12px",fontSize:12}} onClick={openAdd}><I.Plus size={12}/> เพิ่มอุปกรณ์ใหม่</button></div>
        </div>
      ) : (
        <div className="grid g-3 mb-4">
          {filtered.map(d => {
            const Ico = I[d.icon] || I.Device;
            return (
              <div className={cx("device-card", d.on && "on")} key={d.id}>
                <div className="flex-cb">
                  <div className="flex-c gap-3">
                    <div className="kpi-icon" style={{width:36,height:36,background:d.on?"var(--sage)":"var(--cream)",color:d.on?"var(--paper)":"var(--muted-2)"}}>
                      <Ico size={18}/>
                    </div>
                    <div>
                      <div className="serif" style={{fontSize:16}}>{d.name}</div>
                      <div className="tiny mono muted">{d.id} · โซน {d.zone}</div>
                    </div>
                  </div>
                  <Toggle on={d.on} onClick={() => toggle(d.id)}/>
                </div>
                <div className="flex-cb">
                  <div style={{color: d.on ? "var(--sage-2)" : "var(--muted)", fontFamily:"var(--f-mono)", fontSize:11, textTransform:"uppercase", letterSpacing:"0.1em"}}>
                    {d.on ? "● ON" : "○ OFF"}
                  </div>
                  <div className="tiny mono muted">{d.flow}</div>
                </div>
                <div className="hr" style={{margin:0}}/>
                <div className="grid g-3" style={{gap:8}}>
                  <div><div className="tiny mono uc muted">UPTIME</div><div className="mono">{d.uptime}</div></div>
                  <div><div className="tiny mono uc muted">POWER</div><div className="mono">{d.power}</div></div>
                  <div><div className="tiny mono uc muted">PROTO</div><div className="mono">MQTT</div></div>
                </div>
                <div className="flex gap-2">
                  <button className="btn" style={{flex:1,justifyContent:"center"}} onClick={() => pushModal(<DeviceScheduleModal device={d}/>)}><I.Clock size={12}/> ตั้งเวลา</button>
                  <button className="btn" style={{flex:1,justifyContent:"center"}} onClick={() => openEdit(d)}><I.Gear size={12}/> ปรับแต่ง</button>
                  <button className="icon-btn" style={{flexShrink:0}} title="ลบอุปกรณ์"
                    onClick={() => pushModal(
                      <ConfirmModal icon={<I.Trash size={22}/>} tone="danger"
                        title={`ลบ ${d.name}?`}
                        desc="อุปกรณ์จะถูกลบออกจากระบบทั้งหมด และไม่สามารถกู้คืนได้"
                        confirmLabel="ลบอุปกรณ์"
                        onConfirm={() => deleteDevice(d.id)}
                      />
                    )}
                  ><I.Trash size={13}/></button>
                </div>
              </div>
            );
          })}

          {/* Add device card */}
          <div
            onClick={openAdd}
            style={{
              border:"2px dashed var(--hair)", borderRadius:14, display:"flex",
              flexDirection:"column", alignItems:"center", justifyContent:"center",
              gap:10, cursor:"pointer", padding:"32px 20px", color:"var(--muted)",
              transition:"border-color 0.15s, color 0.15s", minHeight:220,
            }}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--sage)";e.currentTarget.style.color="var(--sage-2)";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--hair)";e.currentTarget.style.color="var(--muted)";}}
          >
            <div style={{width:44,height:44,borderRadius:12,border:"2px dashed currentColor",display:"grid",placeItems:"center"}}>
              <I.Plus size={22}/>
            </div>
            <div style={{fontFamily:"var(--f-serif)",fontSize:15}}>เพิ่มอุปกรณ์ใหม่</div>
            <div style={{fontSize:11,fontFamily:"var(--f-mono)",textAlign:"center",lineHeight:1.5}}>
              ปั๊มน้ำ · พัดลม · Grow Light<br/>กล้อง CCTV · IoT Sensor
            </div>
          </div>
        </div>
      )}

      {/* automation rules */}
      <div className="card">
        <div className="card-h">
          <div>
            <div className="card-title">Automation Rules</div>
            <div className="card-sub">5 RULES · 4 ACTIVE</div>
          </div>
          <button className="btn primary" onClick={() => pushModal(<AddAutomationModal onAdd={() => pushToast("เพิ่มกฎ Automation สำเร็จ","success")}/>)}><I.Plus size={14}/> เพิ่มกฎใหม่</button>
        </div>
        <table className="tbl">
          <thead><tr>
            <th style={{width:40}}></th><th>ชื่อกฎ</th><th>เงื่อนไข</th><th>การกระทำ</th><th>ทำงานวันนี้</th><th></th>
          </tr></thead>
          <tbody>
            {AUTOMATIONS.map((a, i) => (
              <tr key={i}>
                <td><Toggle on={a.on}/></td>
                <td><div className="ink2">{a.name}</div></td>
                <td className="mono muted small">{a.cond}</td>
                <td className="small">{a.act}</td>
                <td><div className="mono" style={{fontSize:15}}>{a.runs}<span className="muted tiny"> ครั้ง</span></div></td>
                <td><div className="flex gap-2"><button className="icon-btn"><I.Edit size={12}/></button><button className="icon-btn"><I.More size={12}/></button></div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* schedule grid */}
      <div className="card mt-4">
        <div className="card-h">
          <div>
            <div className="card-title">Schedule — สัปดาห์นี้</div>
            <div className="card-sub">10 — 16 พฤษภาคม 2026</div>
          </div>
          <Seg options={[{v:"w",l:"Week"},{v:"d",l:"Day"}]} value="w" onChange={()=>{}}/>
        </div>
        <ScheduleGrid/>
      </div>
    </>
  );
}

// ─── Modal เพิ่มอุปกรณ์ใหม่ ───────────────────────────────────
function AddDeviceModal({ existingIds, onAdd }) {
  const CATEGORIES = [
    {
      id:"farm", label:"อุปกรณ์ฟาร์ม", icon:"Leaf", color:"var(--sage-2)", bg:"var(--sage-soft)",
      desc:"ปั๊มน้ำ · พัดลม · Grow Light · ปั๊มหมอก",
      kinds:[
        {v:"pump",  l:"ปั๊มน้ำ",         icon:"Pump",  prefix:"PMP", power:"1.2 kW",  proto:"MQTT", flow:"12.4 L/min"},
        {v:"fan",   l:"พัดลม",            icon:"Fan",   prefix:"FAN", power:"0.4 kW",  proto:"MQTT", flow:"Mid speed"},
        {v:"light", l:"Grow Light",       icon:"Bulb",  prefix:"LGT", power:"0.3 kW",  proto:"MQTT", flow:"Spectrum: full"},
        {v:"mist",  l:"ปั๊มหมอก",         icon:"Drop",  prefix:"MST", power:"0.3 kW",  proto:"MQTT", flow:"2.1 L/min"},
        {v:"valve", l:"โซลินอยด์วาล์ว",   icon:"Pump",  prefix:"VLV", power:"0.05 kW", proto:"MQTT", flow:"On/Off"},
        {v:"feeder",l:"เครื่องให้ปุ๋ย",   icon:"Leaf",  prefix:"FDR", power:"0.1 kW",  proto:"MQTT", flow:"2.4 L/h"},
      ],
    },
    {
      id:"cctv", label:"กล้อง CCTV", icon:"Video", color:"var(--info)", bg:"var(--info-soft)",
      desc:"RTSP · ONVIF · IP Camera · PTZ · AI Camera",
      kinds:[
        {v:"cctv_ip",   l:"IP Camera",      icon:"Video",  prefix:"CAM", power:"0.02 kW", proto:"RTSP",  flow:"RTSP"},
        {v:"cctv_ptz",  l:"PTZ Camera",     icon:"Camera", prefix:"PTZ", power:"0.04 kW", proto:"ONVIF", flow:"RTSP"},
        {v:"cctv_therm",l:"Thermal Camera", icon:"Temp",   prefix:"THM", power:"0.05 kW", proto:"RTSP",  flow:"RTSP"},
        {v:"cctv_ai",   l:"AI Camera",      icon:"AI",     prefix:"AIC", power:"0.06 kW", proto:"RTSP",  flow:"RTSP"},
      ],
    },
    {
      id:"iot", label:"IoT / Sensor Node", icon:"Sensor", color:"var(--warn)", bg:"var(--warn-soft)",
      desc:"MQTT · Modbus · LoRa · Zigbee · HTTP",
      kinds:[
        {v:"gateway", l:"LoRa Gateway",    icon:"Wifi",   prefix:"GWY", power:"0.08 kW", proto:"LoRa",   flow:"LoRaWAN"},
        {v:"node",    l:"Sensor Node",     icon:"Sensor", prefix:"NOD", power:"0.02 kW", proto:"MQTT",   flow:"Sensor"},
        {v:"plc",     l:"PLC Controller",  icon:"Device", prefix:"PLC", power:"0.15 kW", proto:"Modbus", flow:"Modbus"},
        {v:"zigbee",  l:"Zigbee Coord.",   icon:"Wifi",   prefix:"ZBE", power:"0.03 kW", proto:"Zigbee", flow:"Zigbee"},
        {v:"energy",  l:"Energy Meter",    icon:"Line",   prefix:"ENR", power:"0.01 kW", proto:"Modbus", flow:"Modbus"},
        {v:"weather", l:"Weather Station", icon:"Cloud",  prefix:"WTH", power:"0.02 kW", proto:"HTTP",   flow:"HTTP"},
      ],
    },
  ];

  const DEF_PORT = {RTSP:"554",ONVIF:"80",MQTT:"1883",LoRa:"1700",Modbus:"502",Zigbee:"8080",HTTP:"80"};

  const [step,    setStep]    = React.useState(1);
  const [cat,     setCat]     = React.useState(null);
  const [kind,    setKind]    = React.useState(null);
  const [name,    setName]    = React.useState("");
  const [zone,    setZone]    = React.useState("A");
  const [host,    setHost]    = React.useState("");
  const [port,    setPort]    = React.useState("");
  const [user,    setUser]    = React.useState("");
  const [pass,    setPass]    = React.useState("");
  const [power,   setPower]   = React.useState("");
  const [startOn, setStartOn] = React.useState(false);
  const [testing, setTesting] = React.useState(null);
  const [err,     setErr]     = React.useState("");

  const needsNet = cat && cat.id !== "farm";

  function genId() {
    if (!kind) return "---";
    let n = 1;
    while (existingIds.includes(`${kind.prefix}-${String(n).padStart(2,"0")}`)) n++;
    return `${kind.prefix}-${String(n).padStart(2,"0")}`;
  }

  function pickCat(c) { setCat(c); setKind(null); setStep(2); }
  function pickKind(k) { setKind(k); setPower(k.power); setPort(DEF_PORT[k.proto]||""); setStep(3); }

  function doTest() {
    if (!host.trim()) { setErr("กรุณากรอก IP Address"); return; }
    setErr(""); setTesting("loading");
    setTimeout(() => setTesting("ok"), 1800 + Math.random()*700);
  }

  function doSave() {
    if (!name.trim()) { setErr("กรุณากรอกชื่ออุปกรณ์"); return; }
    onAdd({
      id: genId(), name: name.trim(), kind: kind.v, icon: kind.icon,
      on: startOn, zone, flow: kind.flow,
      uptime: startOn ? "0m" : "—",
      power: startOn ? (power||kind.power) : "0 kW",
      host: host||null, port: port||DEF_PORT[kind.proto]||null,
      proto: kind.proto, catId: cat.id,
    });
    popModal();
  }

  const STEP_LABELS = ["หมวดหมู่","ประเภท","ตั้งค่า"];

  return (
    <Modal wide title="เพิ่มอุปกรณ์ใหม่" sub="Device Setup Wizard"
      footer={
        <div style={{display:"flex",alignItems:"center",width:"100%",gap:8}}>
          <div className="flex-c gap-2" style={{flex:1}}>
            {STEP_LABELS.map((s,i)=>(
              <React.Fragment key={s}>
                <div style={{display:"flex",alignItems:"center",gap:4}}>
                  <div style={{width:22,height:22,borderRadius:999,display:"grid",placeItems:"center",fontSize:10,fontFamily:"var(--f-mono)",flexShrink:0,
                    background:step>i+1?"var(--sage-2)":step===i+1?"var(--ink)":"var(--hair-2)",
                    color:step>=i+1?"var(--paper)":"var(--muted)"}}>
                    {step>i+1?<I.Check size={10}/>:i+1}
                  </div>
                  {step===i+1&&<span style={{fontSize:10,fontFamily:"var(--f-mono)",color:"var(--ink)"}}>{s}</span>}
                </div>
                {i<2&&<div style={{width:16,height:1,background:"var(--hair-2)",flexShrink:0}}/>}
              </React.Fragment>
            ))}
          </div>
          <button className="btn" onClick={step===1?popModal:()=>setStep(s=>s-1)}>
            {step===1?"ยกเลิก":"← ย้อนกลับ"}
          </button>
          {step===3&&needsNet&&testing!=="ok"&&(
            <button className="btn" onClick={doTest} disabled={testing==="loading"}>
              {testing==="loading"?"กำลังทดสอบ…":<><I.Signal size={13}/> ทดสอบเชื่อมต่อ</>}
            </button>
          )}
          {step===3&&<button className="btn primary" onClick={doSave}><I.Plus size={14}/> เพิ่มอุปกรณ์</button>}
        </div>
      }
    >
      {err&&<div style={{background:"var(--danger-soft)",color:"var(--danger)",padding:"8px 12px",borderRadius:8,fontSize:12,marginBottom:14}}>{err}</div>}

      {/* ── STEP 1: หมวดหมู่ ── */}
      {step===1&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="small muted mb-2">เลือกประเภทอุปกรณ์ที่ต้องการเพิ่ม</div>
          {CATEGORIES.map(c=>(
            <div key={c.id} onClick={()=>pickCat(c)} style={{
              border:`2px solid ${cat?.id===c.id?c.color:"var(--hair)"}`,borderRadius:12,
              padding:"18px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:18,transition:"all 0.14s",
              background:cat?.id===c.id?`color-mix(in srgb,${c.color} 7%,var(--paper))`:"var(--paper)",
            }}
            onMouseEnter={e=>{if(cat?.id!==c.id){e.currentTarget.style.borderColor=c.color;}}}
            onMouseLeave={e=>{if(cat?.id!==c.id){e.currentTarget.style.borderColor="var(--hair)";}}}
            >
              <div style={{width:52,height:52,borderRadius:14,background:c.bg,color:c.color,display:"grid",placeItems:"center",flexShrink:0}}>
                {React.createElement(I[c.icon]||I.Device,{size:24})}
              </div>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--f-serif)",fontSize:17,marginBottom:5}}>{c.label}</div>
                <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"var(--muted)"}}>{c.desc}</div>
              </div>
              <I.Right size={16} stroke="var(--muted)"/>
            </div>
          ))}
        </div>
      )}

      {/* ── STEP 2: ประเภทย่อย ── */}
      {step===2&&cat&&(
        <div>
          <div className="flex-c gap-3 mb-4">
            <div style={{width:34,height:34,borderRadius:9,background:cat.bg,color:cat.color,display:"grid",placeItems:"center"}}>
              {React.createElement(I[cat.icon]||I.Device,{size:17})}
            </div>
            <div>
              <div style={{fontFamily:"var(--f-serif)",fontSize:15}}>{cat.label}</div>
              <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"var(--muted)"}}>เลือกประเภทย่อย</div>
            </div>
          </div>
          <div className="grid g-2" style={{gap:10}}>
            {cat.kinds.map((k,i)=>(
              <div key={i} onClick={()=>pickKind(k)} style={{
                border:`1.5px solid ${kind===k?cat.color:"var(--hair)"}`,borderRadius:10,
                padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,
                background:kind===k?cat.bg:"var(--paper)",transition:"all 0.12s",
              }}
              onMouseEnter={e=>{if(kind!==k){e.currentTarget.style.borderColor=cat.color;}}}
              onMouseLeave={e=>{if(kind!==k){e.currentTarget.style.borderColor="var(--hair)";}}}
              >
                <div style={{width:36,height:36,borderRadius:9,background:kind===k?cat.color:"var(--cream)",color:kind===k?"white":"var(--muted)",display:"grid",placeItems:"center",flexShrink:0,transition:"all 0.12s"}}>
                  {React.createElement(I[k.icon]||I.Device,{size:16})}
                </div>
                <div>
                  <div style={{fontSize:13,color:"var(--ink-2)",fontWeight:500}}>{k.l}</div>
                  <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)",marginTop:2}}>{k.proto} · {k.power}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── STEP 3: กรอกข้อมูล ── */}
      {step===3&&kind&&(
        <div>
          {/* Preview */}
          <div style={{background:"var(--cream)",borderRadius:10,padding:"14px 16px",marginBottom:18,display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:42,height:42,borderRadius:10,background:startOn?cat.color:"var(--hair)",color:startOn?"white":"var(--muted-2)",display:"grid",placeItems:"center",flexShrink:0,transition:"background 0.2s"}}>
              {React.createElement(I[kind.icon]||I.Device,{size:20})}
            </div>
            <div style={{flex:1}}>
              <div style={{fontFamily:"var(--f-serif)",fontSize:15}}>{name||`${kind.l} ใหม่`}</div>
              <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted)",marginTop:2}}>
                {genId()} · โซน {zone} · {kind.proto}{host?` · ${host}:${port||DEF_PORT[kind.proto]}`:""}
              </div>
            </div>
            <div className="flex-c gap-2">
              <Chip tone={cat.id==="cctv"?"info":cat.id==="iot"?"warn":"sage"}>{cat.label}</Chip>
              <Chip tone={startOn?"sage":""} dot>{startOn?"ON":"OFF"}</Chip>
            </div>
          </div>

          {/* Basic */}
          <div className="grid g-2" style={{gap:12}}>
            <div className="field" style={{margin:0}}>
              <label>ชื่ออุปกรณ์ *</label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder={`เช่น ${kind.l} โซน ${zone}`}/>
            </div>
            <div className="field" style={{margin:0}}>
              <label>รหัส ID (อัตโนมัติ)</label>
              <input value={genId()} readOnly style={{color:"var(--muted)",background:"var(--cream)",fontFamily:"var(--f-mono)"}}/>
            </div>
          </div>

          <div className="field mt-3">
            <label>โซน</label>
            <div className="flex gap-2">
              {FARM_ZONES.map(z=>(
                <div key={z.id} onClick={()=>setZone(z.id)} style={{flex:1,border:`1px solid ${zone===z.id?"var(--ink)":"var(--hair)"}`,background:zone===z.id?"var(--ink)":"var(--paper)",color:zone===z.id?"var(--paper)":"var(--ink-2)",padding:"9px 0",borderRadius:8,fontSize:13,cursor:"pointer",textAlign:"center"}}>
                  โซน {z.id}
                </div>
              ))}
            </div>
          </div>

          {/* Network (CCTV + IoT) */}
          {needsNet&&(
            <>
              <div className="hr"/>
              <div style={{fontFamily:"var(--f-mono)",fontSize:10,color:"var(--muted-2)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:12}}>🔌 การเชื่อมต่อเครือข่าย</div>
              <div className="grid g-2" style={{gap:12}}>
                <div className="field" style={{margin:0}}>
                  <label>IP Address *</label>
                  <input value={host} onChange={e=>setHost(e.target.value)} placeholder="192.168.1.xxx" style={{fontFamily:"var(--f-mono)"}}/>
                </div>
                <div className="field" style={{margin:0}}>
                  <label>Port</label>
                  <input value={port} onChange={e=>setPort(e.target.value)} placeholder={DEF_PORT[kind.proto]||""} style={{fontFamily:"var(--f-mono)"}}/>
                </div>
              </div>
              <div className="grid g-2" style={{gap:12,marginTop:12}}>
                <div className="field" style={{margin:0}}><label>Username</label><input value={user} onChange={e=>setUser(e.target.value)} placeholder="admin"/></div>
                <div className="field" style={{margin:0}}><label>Password</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"/></div>
              </div>
              {cat.id==="cctv"&&host&&(
                <div style={{marginTop:10,padding:"8px 12px",background:"var(--cream)",borderRadius:8}}>
                  <div className="tiny mono uc muted mb-1">Stream URL Preview</div>
                  <div style={{fontFamily:"var(--f-mono)",fontSize:11,color:"var(--sage-2)",wordBreak:"break-all"}}>
                    rtsp://{user||"admin"}:***@{host}:{port||"554"}/Streaming/Channels/101
                  </div>
                </div>
              )}
              {cat.id==="iot"&&kind.proto==="MQTT"&&(
                <div className="field mt-3">
                  <label>MQTT Topic</label>
                  <input defaultValue={`farm/zone-${zone.toLowerCase()}/#`} style={{fontFamily:"var(--f-mono)"}}/>
                </div>
              )}
              {/* Test result */}
              {testing&&(
                <div style={{marginTop:12,padding:"11px 14px",borderRadius:8,display:"flex",alignItems:"center",gap:12,
                  background:testing==="ok"?"var(--sage-soft)":testing==="fail"?"var(--danger-soft)":"var(--cream)",
                  border:`1px solid ${testing==="ok"?"var(--sage)":testing==="fail"?"var(--danger)":"var(--hair-2)"}`,
                }}>
                  {testing==="loading"&&<div style={{width:15,height:15,border:"2px solid var(--sage-2)",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.7s linear infinite",flexShrink:0}}/>}
                  {testing==="ok"&&<I.Check size={15} stroke="var(--sage-2)"/>}
                  {testing==="fail"&&<I.Alert size={15} stroke="var(--danger)"/>}
                  <div style={{fontSize:12,color:testing==="ok"?"var(--sage-2)":testing==="fail"?"var(--danger)":"var(--ink-2)"}}>
                    {testing==="loading"?"กำลังเชื่อมต่อ…":testing==="ok"?`เชื่อมต่อสำเร็จ · Latency 12ms · ${kind.proto}`:"เชื่อมต่อล้มเหลว — ตรวจสอบ IP/Port/Credentials"}
                  </div>
                </div>
              )}
              <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
            </>
          )}

          {/* Power + on/off */}
          <div className="hr"/>
          <div className="grid g-2" style={{gap:12}}>
            <div className="field" style={{margin:0}}>
              <label>กำลังไฟ (kW)</label>

<script type="text/babel" data-presets="env-react">
/* SmartFarm — Map + AI Analysis */

function MapPage() {
  const [layer, setLayer]       = React.useState("sensors");
  const [viewMode, setViewMode] = React.useState("2d");
  const [selected, setSelected] = React.useState(null);
  const [pinMode, setPinMode]   = React.useState(false);
  const [customPins, setCustomPins] = React.useState([]);   // user-added pins
  const mapRef = React.useRef(null);

  const basePins = [
    {id: "TMP-01", x: 28, y: 30, kind: "sage", label: "T", name: "TMP-01", val: "28.4°C", zone: "A"},

    {id: "WTR-01", x: 58, y: 28, kind: "sage", label: "W", name: "WTR-01", val: "64%", zone: "B"},
    {id: "TMP-02", x: 64, y: 36, kind: "warn", label: "T", name: "TMP-02", val: "36.8°C", zone: "B"},
    {id: "CO2-01", x: 60, y: 44, kind: "sage", label: "C", name: "CO2-01", val: "612 ppm", zone: "B"},
    {id: "SOL-01", x: 38, y: 64, kind: "sage", label: "S", name: "SOL-01", val: "41%", zone: "C"},
    {id: "SOL-03", x: 44, y: 72, kind: "danger", label: "S", name: "SOL-03", val: "24%", zone: "C"},
    {id: "PH-01",  x: 72, y: 64, kind: "sage", label: "P", name: "PH-01", val: "6.4", zone: "D"},
    {id: "EC-01",  x: 78, y: 72, kind: "sage", label: "E", name: "EC-01", val: "1.8", zone: "D"},
  ];
  const allPins = [...basePins, ...customPins];

  const devices = [
    {id: "PMP-01", x: 22, y: 48, on: true, name: "ปั๊มน้ำหลัก #1"},
    {id: "FAN-01", x: 32, y: 18, on: true, name: "พัดลม A"},
    {id: "FAN-02", x: 70, y: 22, on: true, name: "พัดลม B"},
    {id: "LGT-02", x: 76, y: 78, on: true, name: "Grow Light #2"},
  ];

  function handleMapClick(e) {
    if (!pinMode) return;
    const rect = mapRef.current.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width)  * 100;
    const yPct = ((e.clientY - rect.top)  / rect.height) * 100;
    openPinModal(xPct, yPct);
  }

  function openPinModal(x, y) {
    pushModal(
      <NewPinModal
        x={x} y={y}
        onSave={(pin) => {
          setCustomPins(prev => [...prev, pin]);
          setPinMode(false);
          pushToast(`ปักหมุด "${pin.name}" สำเร็จ`, "success");
        }}
        onCancel={() => { setPinMode(false); popModal(); }}
      />
    );
  }

  function deletePin(id) {
    setCustomPins(prev => prev.filter(p => p.id !== id));
    pushToast("ลบหมุดแล้ว", "danger");
  }

  return (
    <>
      <div className="page-head">

            className={cx("btn", pinMode && "primary")}
            onClick={() => { setPinMode(v => !v); }}
            style={pinMode ? {background:"var(--sage)",borderColor:"var(--sage)"} : {}}
          >
            <I.Pin size={14}/>
            {pinMode ? " กำลังปักหมุด…" : " ปักหมุดใหม่"}
          </button>
        </div>
      </div>

      <div className="grid g-2-1">
        <div className="card" style={{padding: 0, overflow: "hidden"}}>
          <div

          >
            {/* Pin-mode overlay banner */}
            {pinMode && (
              <div className="pin-mode-banner">
                <div className="flex-c gap-3">
                  <span className="pulse-dot"/>
                  <span>โหมดปักหมุด — คลิกบนแผนที่เพื่อเลือกตำแหน่ง</span>
                </div>
                <button className="btn" style={{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"var(--paper)",fontSize:11,padding:"4px 12px"}}
                  onClick={e => { e.stopPropagation(); setPinMode(false); }}>
                  ✕ ยกเลิก
                </button>
              </div>
            )}

            {viewMode === "2d" ? (
              <>
                <FarmMap
                  layer={layer} pins={allPins} devices={devices}
                  onSelect={setSelected} selected={selected}
                  pinMode={pinMode}
                />
                {/* Custom pins overlay */}
                {customPins.map(pin => (
                  <div
                    key={pin.id}
                    className="map-pin-marker"
                    style={{left: `${pin.x}%`, top: `${pin.y}%`}}
                    title={pin.name}
                    onClick={e => { e.stopPropagation(); setSelected(pin); }}
                  >
                    <div className="ph" style={{
                      background: pin.kind === "danger" ? "var(--danger)" : pin.kind === "warn" ? "var(--warn)" : "var(--sage)",
                    }}>
                      <I.Pin size={10} stroke="white"/>
                    </div>
                    <div className="pl">{pin.name}</div>
                  </div>
                ))}
                {/* legend */}
                <div style={{position: "absolute", bottom: 14, left: 14, background: "var(--paper)", border: "1px solid var(--hair)", borderRadius: 10, padding: "10px 14px", display: "flex", gap: 16, fontFamily: "var(--f-mono)", fontSize: 11}}>

                  <span className="flex-c gap-2"><span style={{width:8,height:8,borderRadius:999,background:"var(--danger)"}}/> วิกฤต</span>
                  <span className="flex-c gap-2"><span style={{width:8,height:8,borderRadius:999,background:"var(--ink)",border:"2px solid var(--paper)"}}/> Device</span>

                {/* compass */}
                <div style={{position: "absolute", top: pinMode ? 54 : 14, right: 14, background: "var(--paper)", border: "1px solid var(--hair)", borderRadius: 999, width: 52, height: 52, display: "grid", placeItems: "center", transition:"top 0.2s"}}>
                  <div style={{textAlign: "center"}}>
                    <div className="serif" style={{fontSize: 14, lineHeight: 1}}>N</div>
                    <div className="tiny mono muted" style={{lineHeight: 1}}>↑</div>
                  </div>
                </div>
                {/* scale */}
                <div style={{position: "absolute", bottom: 14, right: 14, fontFamily: "var(--f-mono)", fontSize: 10, color: "var(--muted)"}}>
                  <div style={{width: 80, height: 6, borderLeft: "1px solid var(--ink)", borderRight: "1px solid var(--ink)", borderBottom: "1px solid var(--ink)"}}/>
                  <div style={{textAlign: "center", marginTop: 2}}>20 m</div>
                </div>
              </>
            ) : (
              <Farm3DView onSelect={setSelected} pinMode={pinMode} onPinPlace={() => { setPinMode(false); pushModal(<NewPinModal x={50} y={50} onSave={pin => { setCustomPins(prev=>[...prev,pin]); pushToast(`ปักหมุด "${pin.name}" สำเร็จ`,"success"); }} onCancel={()=>{setPinMode(false);popModal();}}/>) }} />
            )}
          </div>
        </div>

        <div>
          {selected ? (
            <div className="card">
              <div className="card-h">
                <div>
                  <div className="card-title">{selected.name}</div>
                  <div className="card-sub">โซน {selected.zone || "—"} · {selected.id}</div>
                </div>
                <div className="flex-c gap-2">
                  <Chip tone={selected.kind} dot>{selected.kind === "sage" ? "ปกติ" : selected.kind === "warn" ? "เตือน" : "วิกฤต"}</Chip>
                  {customPins.find(p => p.id === selected.id) && (

function Farm3DView({ onSelect, pinMode, onPinPlace }) {
  const cvRef  = React.useRef(null);
  const stRef  = React.useRef({
    angle: -0.52, tilt: 0.46, scale: 10.5,
    drag: false, lx: 0, ly: 0,
    hover: null, frame: 0, _pts: [],
    panX: 0, panZ: 0,
  });
  const rafRef = React.useRef(null);
  const [hover, setHover]   = React.useState(null);
  const [hint, setHint]     = React.useState(true);
  const pinModeRef  = React.useRef(pinMode);
  const onPinRef    = React.useRef(onPinPlace);
  React.useEffect(() => { pinModeRef.current = pinMode; }, [pinMode]);
  React.useEffect(() => { onPinRef.current = onPinPlace; }, [onPinPlace]);

  // ── isometric projection ──────────────────────────────────────
  function iso(x, y, z, st, W, H) {
    const a = st.angle, co = Math.cos(a), si = Math.sin(a);
    const rx = (x + st.panX) * co - (z + st.panZ) * si;
    const rz = (x + st.panX) * si + (z + st.panZ) * co;
    return [
      W * 0.5  + rx * st.scale,
      H * 0.46 + (rz * Math.cos(st.tilt) - y * Math.sin(st.tilt) * 0.92) * st.scale,
    ];
  }

  // ── draw helpers ──────────────────────────────────────────────
  function poly(ctx, pts, fill, strk, lw) {
    ctx.beginPath(); ctx.moveTo(...pts[0]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (strk) { ctx.strokeStyle = strk; ctx.lineWidth = lw || 0.5; ctx.stroke(); }
  }

  function box(ctx, x, y, z, W, H, D, top, lft, rgt, p, edgeClr) {
    const TL = p(x,   y+H, z),   TR = p(x+W, y+H, z);
    const BR = p(x+W, y+H, z+D), BL = p(x,   y+H, z+D);
    const LL = p(x,   y,   z),   LR = p(x,   y,   z+D);
    const RL = p(x+W, y,   z);
    const e  = edgeClr || "rgba(255,255,255,0.06)";
    poly(ctx, [TL,TR,BR,BL], top, e, 0.4);
    poly(ctx, [TL,BL,LR,LL], lft, e, 0.4);
    poly(ctx, [TR,BR,LR,RL], rgt, e, 0.4);
  }

  function cyl(ctx, x, y, z, r, h, fill, p, sc) {
    const b = p(x,y,z), t = p(x,y+h,z), rPx = r * sc;
    poly(ctx, [
      [b[0]-rPx, b[1]], [t[0]-rPx, t[1]],
      [t[0]+rPx, t[1]], [b[0]+rPx, b[1]],
    ], fill);
    ctx.beginPath();
    ctx.ellipse(t[0], t[1], rPx, rPx * 0.34, 0, 0, Math.PI*2);
    ctx.fillStyle = fill; ctx.fill();
  }

  function glowLine(ctx, pts, color, lw, blur) {
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = blur || 10;
    ctx.strokeStyle = color; ctx.lineWidth = lw || 1.5;
    ctx.beginPath(); ctx.moveTo(...pts[0]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]);
    ctx.stroke(); ctx.restore();
  }

  // ── main render ───────────────────────────────────────────────
  function render() {
    const cv = cvRef.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const st = stRef.current;
    st.frame++;
    const p = (x,y,z) => iso(x,y,z,st,W,H);
    const sc = st.scale;
    const f  = st.frame;

    // ── background ─────────────────────────────────────────────
    const bgGrad = ctx.createRadialGradient(W*.5, H*.45, 0, W*.5, H*.5, W*.7);
    bgGrad.addColorStop(0, "#0d1f14");
    bgGrad.addColorStop(1, "#060e08");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    // ── ground grid ────────────────────────────────────────────
    ctx.save(); ctx.globalAlpha = 0.18;
    for (let i = -36; i <= 36; i += 4) {
      glowLine(ctx, [p(i,0,-36), p(i,0,36)], "#22aa44", 0.4, 4);
      glowLine(ctx, [p(-36,0,i), p(36,0,i)], "#22aa44", 0.4, 4);
    }
    ctx.restore();

    // Ground base
    poly(ctx, [p(-36,0,-36),p(36,0,-36),p(36,0,36),p(-36,0,36)], "rgba(10,24,14,0.85)");

    // ── glowing perimeter road ─────────────────────────────────
    const roadCorners = [
      [p(-31,.08,-31), p(31,.08,-31), p(31,.08,31), p(-31,.08,31)],
    ];
    // Outer glow road fill
    poly(ctx, roadCorners[0], "rgba(20,36,24,0.6)");
    const roadPts = [...roadCorners[0], roadCorners[0][0]];
    for (let pass = 0; pass < 3; pass++) {
      const alpha = 0.15 + pass * 0.18 + 0.04 * Math.sin(f * 0.03);
      glowLine(ctx, roadPts, `rgba(180,140,40,${alpha})`, 2.5 - pass * 0.6, 18 - pass * 4);
    }
    // Inner highlight
    glowLine(ctx, roadPts, `rgba(255,210,60,${0.55 + 0.12 * Math.sin(f * 0.04)})`, 0.8, 8);

    // Internal paths (cross)
    const crossH = [p(-31,.1, 0), p(31,.1,0)];
    const crossV = [p(0,.1,-31), p(0,.1,31)];
    glowLine(ctx, crossH, "rgba(255,200,50,0.25)", 0.8, 6);
    glowLine(ctx, crossV, "rgba(255,200,50,0.25)", 0.8, 6);

    // ── Zone fills ─────────────────────────────────────────────
    const zones = [
      { pts: [p(-28,.1,-28),p(-3,.1,-28),p(-3,.1,-3),p(-28,.1,-3)],  fill:"rgba(30,100,50,0.13)",  strk:"rgba(60,180,80,0.25)"  },
      { pts: [p(3,.1,-28), p(28,.1,-28),p(28,.1,-3), p(3,.1,-3)],    fill:"rgba(40,100,100,0.12)", strk:"rgba(60,160,160,0.22)" },
      { pts: [p(-28,.1,3), p(-3,.1,3), p(-3,.1,28), p(-28,.1,28)],   fill:"rgba(100,40,30,0.12)",  strk:"rgba(180,70,50,0.22)"  },
      { pts: [p(3,.1,3),   p(28,.1,3), p(28,.1,28), p(3,.1,28)],     fill:"rgba(30,60,140,0.13)",  strk:"rgba(50,100,220,0.22)" },
    ];
    zones.forEach(z => {
      poly(ctx, z.pts, z.fill);
      ctx.save(); ctx.strokeStyle = z.strk; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(...z.pts[0]); z.pts.slice(1).forEach(pt => ctx.lineTo(...pt)); ctx.closePath(); ctx.stroke();
      ctx.restore();
    });

    // ── ZONE A — ผักสลัด (Isometric raised beds + crop rows) ─────
    // Soil beds
    for (let row = 0; row < 3; row++) {
      const bz = -26 + row * 7.5;
      box(ctx,-26,.0,-26+row*7.5, 20,.45,5,
        "rgba(62,42,22,0.95)","rgba(42,28,12,0.9)","rgba(50,34,16,0.9)", p);

      for (let c = 0; c < 8; c++) {
        const cx2 = -25 + c * 2.5 + 1.2, cz2 = bz + 2.5;
        const col = (row===1&&c===3) ? "rgba(160,220,60,0.9)" : "rgba(50,180,60,0.85)";

        const [lx,ly2] = p(cx2, 1.25, cz2);

        const g2 = ctx.createRadialGradient(lx,ly2,0,lx,ly2,lr);
        g2.addColorStop(0, col); g2.addColorStop(1,"rgba(20,80,20,0.3)");
        ctx.beginPath(); ctx.ellipse(lx,ly2,lr,lr*.52,0,0,Math.PI*2);
        ctx.fillStyle = g2; ctx.fill();
      }
    }

    // ── ZONE B — โรงเรือนเมล่อน ────────────────────────────────
    // Floor slab
    box(ctx,5,.0,-27, 21,.2,22, "rgba(30,58,44,0.9)","rgba(22,42,32,0.85)","rgba(26,50,38,0.85)",p);
    // Glass walls — semi transparent
    ctx.save(); ctx.globalAlpha = 0.14;
    box(ctx,5,.2,-27, 21,7.5,22, "rgba(140,220,200,0.7)","rgba(100,180,160,0.6)","rgba(120,200,180,0.65)",p);
    ctx.restore();
    // Frame edges glow
    const ghCorners = [[5,7.7,-27],[26,7.7,-27],[26,7.7,-5],[5,7.7,-5]];
    glowLine(ctx, [...ghCorners, ghCorners[0]].map(([x,,z])=>p(x,7.7,z)), "rgba(80,200,160,0.45)", 0.8, 6);
    [[5,-27],[26,-27],[26,-5],[5,-5]].forEach(([x,z])=>{
      glowLine(ctx,[p(x,.2,z),p(x,7.7,z)],"rgba(80,200,160,0.3)",0.5,3);

    // Roof arches
    for (let i=0;i<5;i++){

    for(let row=0;row<3;row++){

        lg.addColorStop(0,warn?"rgba(160,150,30,0.85)":"rgba(30,140,30,0.85)"); lg.addColorStop(1,"rgba(10,50,10,0.1)");
